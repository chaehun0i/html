name: Publish interview study pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check site files
        run: |
          test -s index.html
          test -s '면접_딥다이브_학습.html'
          test -s 'CS_기초부터_총정리.html'
      - uses: actions/configure-pages@v5
        if: ${{ !github.event.repository.private }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
