e:14px;line-height:1.85;margin:0;color:#44524d;word-break:keep-all}.self-check{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}.self-check button{font-size:12px;padding:5px 11px;background:transparent}.self-check button.selected{background:var(--soft);border-color:#b0cbbd;color:var(--accent)}.self-check button.review.selected{background:#fbefe2;border-color:#e4c5a4;color:var(--orange)}.reveal{font-size:14px;margin-top:5px;color:var(--accent)}.pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:20px 0 30px}.pager button{font-size:13px;min-width:35px;padding:5px 10px}.pager button[aria-current=page]{background:var(--accent);color:white;border-color:var(--accent)}.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:12px}.empty p{color:var(--muted);font-size:14px}.sources{border-top:1px solid var(--line);padding-top:18px;margin-top:20px;font-size:13px;color:var(--muted)}.sources summary{cursor:pointer;font-weight:600}.sources ul{padding-left:19px}.sources li{margin:8px 0}.sources p{font-size:12px;line-height:1.8}.time-note{font-size:12px;color:var(--muted);margin-top:15px}.print-note{display:none}.print-button{margin-top:10px;width:100%;font-size:12px;background:transparent}.top-anchor{scroll-margin-top:15px}.footer-note{text-align:center;font-size:12px;color:var(--muted);margin-top:30px}code{font-family:ui-monospace,Consolas,monospace;background:#edf1ec;padding:1px 4px;border-radius:3px}#statusLive{min-height:1px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<script>
const data=[{"id":"common-1","group":"common","title":"1분 자기소개를 해주세요.","keywords":["Python 서비스","입력→실행→결과","두 가지 증거"],"answer":"Python으로 데이터를 검증하고 처리 결과를 제공하는 서비스를 만들어 왔습니다. ServIQ에서는 파일 입력부터 조사 상태와 결과 조회까지 연결했습니다. 햇들농산에서는 판매 후보 앞에 재무 정보가 들어가도록 실행 순서를 개선했습니다.","deep":"지원 직무에 따라 두 번째 사례를 바꿔도 됩니다. Backend라면 금융안심이의 결과 저장과 Docker 경량화를 써 보세요.","follow":["한 프로젝트만 골라 본인 역할을 설명해 주세요."],"follow_answers":["문제와 본인이 맡은 기능을 한 문장씩 말하고, 검증한 조건을 붙이세요."],"quick":true,"number":1},{"id":"common-2","group":"common","title":"왜 이 직무를 선택했나요?","keywords":["반복해 맡은 역할","개선 경험","다음 목표"],"answer":"프로젝트에서 입력 검증, 작업 실행, 결과 확인을 연결하는 역할을 반복해서 맡았습니다. 누락된 데이터나 중단된 작업의 원인을 찾고 흐름을 개선하는 데 재미를 느꼈습니다. 이 경험을 바탕으로 담당 영역을 더 깊게 파고들고 싶습니다.","deep":"Agent·RAG는 근거 검색과 실행 통제, AX는 업무 순서와 예외, Backend는 API와 데이터 정합성을 강조하세요.","follow":["이 직무에서 더 배우고 싶은 부분은 무엇인가요?"],"follow_answers":["본인이 프로젝트에서 만난 한계를 하나 고르고, 다음에 어떤 실험이나 검증을 할지 연결하세요."],"quick":true,"number":2},{"id":"common-3","group":"common","title":"프로젝트에서 직접 맡은 범위는 어디까지인가요?","keywords":["내 변경","팀 범위","확인한 조건"],"answer":"햇들농산은 팀 프로젝트였고, 저는 재무 Agent와 실행 통제, 초기 물류 실행 흐름에 참여했습니다. 판매 쪽에서는 후보 생성과 검증 흐름을 다뤘습니다. 제가 바꾼 입력 순서와 그 변경을 확인한 테스트를 중심으로 설명하겠습니다.","deep":"면접 전에 직접 바꾼 파일이나 함수 하나를 골라 변경 전후를 말로 설명해 보세요.","follow":["팀원의 결과물과 어떻게 연결했나요?"],"follow_answers":["기억나는 입력·출력 계약과 연결 과정에서 확인한 문제를 실제 사례로 답하세요."],"quick":true,"number":3},{"id":"common-4","group":"common","title":"문제를 처음 발견하고 원인을 좁힌 경험이 있나요?","keywords":["실행 기록","원인 좁히기","수정 검증"],"answer":"판매 실행 기록 9,937건을 살펴봤을 때 후보 생성 전에 재무 정보가 확인된 건이 0건이었습니다. 입력 전달 순서를 원인으로 좁혀 재무 정보를 후보 생성 앞에 연결했습니다. 이후 입력 순서와 품목 범위를 각각 테스트했습니다.","deep":"9,937건과 0건은 변경 전 진단 범위입니다. 이후 테스트는 추천 정확도나 매출 성과 측정과 구분하세요.","follow":["수정의 효과를 더 검증하려면?"],"follow_answers":["같은 입력에서 재무 정보가 올바르게 반영되고 부적합 후보가 줄었는지 별도 기준으로 비교하겠습니다."],"quick":true,"number":4},{"id":"common-5","group":"common","title":"기술을 선택할 때 어떤 기준으로 비교하나요?","keywords":["요구사항","단순한 대안","유지 비용"],"answer":"먼저 어떤 문제와 실패 조건을 다루는지 확인합니다. 순서가 고정되면 함수 조합으로 시작하고, 상태와 분기가 복잡해지면 실행 흐름을 명시하는 구조를 검토합니다. 구현 시간과 장애를 추적하는 비용도 함께 비교합니다.","deep":"햇들농산의 판매 후보 생성과 검증 흐름을 실제 사례로 사용할 수 있습니다.","follow":["처음부터 복잡한 도구를 도입해야 하나요?"],"follow_answers":["작은 흐름으로 시작하고 상태·분기·재개 요구가 명확해질 때 복잡도를 추가하겠습니다."],"quick":true,"number":5},{"id":"common-6","group":"common","title":"프로젝트에서 실패했거나 다시 한다면 바꾸고 싶은 점은?","keywords":["부분 저장","실제 영향","개선 테스트"],"answer":"WITH ESG에서 원천 수치와 생성 문장을 별도로 저장했습니다. 출처를 대조하기 쉬웠지만 한쪽만 저장될 여지가 있었습니다. 다시 한다면 함께 저장해야 하는 경계를 정하고, 한쪽 실패 시 나머지 결과가 남는지부터 테스트하겠습니다.","deep":"설계에서 확인한 한계입니다. 실제 장애 경험을 묻는다면 직접 겪은 상황과 복구 결과를 골라 답하세요.","follow":["개선 후 무엇을 확인할 건가요?"],"follow_answers":["실패를 주입해 반쪽 저장이 남는지, 응답이 실패를 제대로 알리는지 확인하겠습니다."],"quick":true,"number":6},{"id":"common-7","group":"common","title":"팀에서 의견이 달랐을 때 어떻게 조율하나요?","keywords":["공통 기준","작은 실험","결정 기록"],"answer":"각 의견이 풀려는 문제를 확인하고 일정·정확성·운영 부담처럼 함께 판단할 기준을 정하겠습니다. 판단이 어려우면 같은 조건의 작은 예제로 비교합니다. 선택 이유와 남은 위험을 팀에 남기겠습니다.","deep":"경험을 요구하면 실제 대안·내 행동·합의 결과를 한 건 골라 말하세요. 이 예시는 대응 원칙입니다.","follow":["합의가 끝까지 안 되면?"],"follow_answers":["선택지와 위험, 일정 영향을 정리해 의사결정 담당자가 판단할 수 있게 공유하겠습니다."],"quick":true,"number":7},{"id":"common-8","group":"common","title":"모르는 기술 질문이나 장애 상황을 만나면 어떻게 답하나요?","keywords":["확인된 사실","가설","다음 검사"],"answer":"지금 확인된 사실부터 말하고, 나머지는 가설로 나누겠습니다. 예를 들어 접속 장애라면 이름 해석, 연결, HTTP 응답 중 어디까지 성공했는지 확인합니다. 관측 결과로 다음 검사 대상을 좁히겠습니다.","deep":"낯선 도구 사용 경험을 요구하면 관련 원리와 확인 방법을 설명하세요.","follow":["첫 가설이 틀렸다면?"],"follow_answers":["어떤 관측이 가설과 맞지 않았는지 말하고, 다음 후보를 구분할 확인 방법을 제시하겠습니다."],"quick":true,"number":8},{"id":"agent-1","number":9,"group":"agent","title":"ServIQ(서브아이큐)는 어떤 문제를 해결하는 서비스인가요?","keywords":["운영 자료","조사 근거","검증 범위"],"answer":"ServIQ는 매장 운영 자료와 고객 의견에서 근거를 찾아 개선안 조사를 돕는 개인 프로젝트입니다. 파일 입력부터 검색·분석·승인·결과 확인까지 연결하고, 도구 실행 직전 접근 범위를 확인했습니다. 검증은 로컬 Docker와 샘플 데이터로 진행했습니다.","quick":false,"deep":"검색은 PostgreSQL FTS와 pgvector, 실행 흐름은 LangGraph와 MCP로 연결했습니다. 로컬 샘플 검증 범위에서 설명하고, 실제 POS·ERP 연동이나 운영 성과는 별도로 구분합니다.","follow":["왜 한 번의 LLM(엘엘엠) 호출 대신 상태 기반 흐름이 필요했나요?","모델이 도구에 다른 매장 ID(아이디)를 넣으면 어떻게 제어하나요?"],"follow_answers":["조사 결과와 승인 여부를 단계 사이에 유지하고 중단된 작업을 이어가야 하기 때문입니다. 상태와 분기를 명시하면 어느 단계에서 실패했는지도 추적하기 쉽습니다.","Harness(하네스)에서 입력과 tenant(테넌트)·store 범위, 정책을 검사하는 경로가 있습니다. 모델이 만든 인자를 신뢰하지 않고 허용된 범위와 대조해야 합니다."]},{"id":"agent-2","number":10,"group":"agent","title":"ServIQ(서브아이큐)의 승인·중단·재개는 어떻게 동작하나요?","keywords":["체크포인트","승인 검사","결과 재사용"],"answer":"그래프가 승인 지점에서 멈추면 체크포인트에 상태를 남깁니다. 재개 요청은 승인 정보가 맞는지 확인한 뒤 진행합니다. 도구 실행 결과는 별도 기록에 남겨 완료 결과를 재사용하고, 완료 여부를 모르는 실행은 상태를 확인합니다.","quick":false,"deep":"체크포인트는 그래프 상태를 저장하고, 실행 기록은 작업의 완료 여부를 추적합니다. 재개할 때 해당 노드가 처음부터 실행될 수 있습니다. 프로세스가 종료된 뒤에도 상태를 복구할 수 있는지는 체크포인트 저장소에 달려 있습니다.","follow":["체크포인트가 있으면 외부 도구가 정확히 한 번 실행되나요?","권한을 재검증하면 역할 회수도 즉시 반영되나요?"],"follow_answers":["그렇지 않습니다. 외부 작업 완료와 체크포인트 저장이 원자적으로 묶이지 않으면 중복·결과 불명 상태가 생깁니다. 완료 영수증 재사용과 멱등성 등의 처리가 필요합니다.","확인된 Harness(하네스)는 저장된 delegated_roles와 범위를 사용합니다. 최신 정책 검사와 현재 사용자 역할 재조회는 다르므로 즉시 회수까지 구현됐다고 단정할 수 없습니다."]},{"id":"agent-3","number":11,"group":"agent","title":"RAG(래그)는 무엇이고 왜 사용하나요?","keywords":["관련 자료 검색","모델 문맥","근거 보류"],"answer":"RAG는 질문과 관련된 자료를 검색해 모델의 입력에 근거로 제공하는 방식입니다. 내부 문서나 갱신되는 정보를 활용할 수 있습니다. 필요한 근거가 검색되지 않으면 답변을 보류하도록 기준을 정합니다.","quick":false,"deep":"RAG(래그)는 외부 자료를 검색해 생성 모델의 입력 문맥에 넣는 방식입니다. 모델을 재학습하지 않아도 최신·내부 자료를 근거로 활용할 수 있지만 원문 품질과 검색 실패에 영향을 받습니다. 검색한 내용이 답변을 뒷받침하는지 검증해야 합니다. 출처와 답변 보류 기준이 없으면 근거를 주어도 환각이 발생할 수 있습니다.","follow":["RAG(래그)와 fine-tuning의 역할은 어떻게 다른가요?","검색 결과가 존재하면 무조건 답변해도 되나요?"],"follow_answers":["RAG(래그)는 질의 시 참고 자료를 제공하고 fine-tuning은 모델 가중치를 조정합니다. 지식 갱신·출처 제공과 행동·형식 학습 등 요구에 따라 함께 사용할 수도 있습니다.","관련성이나 신뢰도가 부족할 수 있습니다. 질문에 필요한 근거가 있는지 확인하고 없으면 모른다고 답하거나 추가 자료를 요청해야 합니다."]},{"id":"agent-4","number":12,"group":"agent","title":"키워드 검색과 벡터 검색을 왜 함께 쓰나요?","keywords":["정확한 표현","의미 유사도","순위 결합"],"answer":"키워드 검색은 코드나 제품명처럼 정확한 표현에 강하고, 벡터 검색은 표현이 달라도 의미가 비슷한 문서를 찾을 수 있습니다. 두 결과의 순위를 결합하고 실제 질문에서 필요한 근거가 더 자주 나오는지 비교합니다.","quick":false,"deep":"키워드 검색은 제품 코드·고유명처럼 정확한 표현을 찾는 데 유리하고 벡터 검색은 표현이 달라도 의미가 비슷한 문서를 찾는 데 도움이 됩니다. 두 결과의 점수 범위가 다르면 원점수를 그대로 더하기보다 RRF(알알에프) 같은 순위 결합을 사용할 수 있습니다. 기본 RRF는 각 목록에서 1/(k+순위)를 합산합니다. ServIQ(서브아이큐)의 검색 모듈에는 이 결합이 있지만 ESG(이에스지)의 확인된 검색 경로는 이슈 필터와 벡터 유사도이므로 구별해야 합니다.","follow":["임베딩 모델을 교체하면 기존 벡터를 그대로 써도 되나요?","하이브리드 검색이 벡터 검색보다 항상 좋나요?"],"follow_answers":["차원이 같아도 모델의 벡터 공간이 달라 직접 비교가 부적절할 수 있습니다. 원문을 새 모델로 재임베딩하고 모델·색인 버전을 함께 관리합니다.","아닙니다. 후보 수·필터·질의 특성에 따라 불필요한 문서가 늘 수 있습니다. 정답 근거가 포함되는지와 순위를 같은 질의셋으로 비교해야 합니다."]},{"id":"agent-5","number":13,"group":"agent","title":"MCP(엠씨피)와 Function(펑션) Calling(콜링)은 어떤 차이가 있나요?","keywords":["모델의 호출 제안","연결 프로토콜","실행 검증"],"answer":"Function Calling은 모델이 도구 이름과 인자를 제안하는 방식입니다. MCP는 앱이 외부 도구와 데이터를 연결하는 프로토콜입니다. 실제 실행은 애플리케이션 쪽에서 허용된 도구인지, 인자와 권한이 맞는지 확인한 뒤 진행합니다.","quick":false,"deep":"Function(펑션) Calling(콜링)은 모델이 도구 이름과 구조화된 인자를 제안하도록 하는 인터페이스입니다. 앱은 그 요청을 검증하고 실제 함수를 실행한 후 결과를 모델에 전달합니다. MCP(엠씨피)는 AI(에이아이) 앱과 외부 도구·리소스 등을 연결하는 프로토콜이며 Function Calling을 대체하는 모델 자체 기능과는 역할이 다릅니다. 어느 방식을 사용하든 업무 권한·인자 검증·실행 제한은 서버가 보장해야 합니다.","follow":["모델이 도구 호출을 반환하면 바로 실행하나요?","RAG(래그)와 Agent(에이전트)는 어떻게 다른가요?"],"follow_answers":["허용된 도구인지, 인자 schema(스키마)와 사용자·리소스 권한이 맞는지 먼저 검사합니다. 쓰기 작업이면 승인·멱등성·감사 기록까지 고려합니다.","RAG(래그)는 검색한 근거로 답변을 만드는 방식이고 Agent(에이전트)는 상황에 따라 도구 선택과 여러 단계의 실행을 제어합니다. Agent가 RAG를 도구로 사용할 수도 있습니다."]},{"id":"agent-6","number":14,"group":"agent","title":"RAG(래그)·LLM(엘엘엠) 서비스가 좋아졌는지는 어떻게 평가하나요?","keywords":["같은 평가셋","검색·생성 분리","비용과 지연"],"answer":"같은 질문과 기준으로 변경 전후를 비교하겠습니다. 검색은 필요한 근거가 포함됐는지, 생성은 답변이 근거와 맞고 근거 부족 시 보류하는지 확인합니다. 실패 사례와 지연·비용도 함께 기록하겠습니다.","quick":false,"deep":"LLM(엘엘엠) 서비스는 정확성뿐 아니라 근거 충실도·인용 일치·답변 보류·비용·지연을 평가합니다. RAG(래그)에서는 관련 근거가 top-k에 들어오는지와 생성 문장이 근거에 충실한지를 나눠 측정합니다. 업무 유형과 실패 사례를 포함한 고정 평가셋으로 모델·프롬프트·검색 변경 전후를 비교합니다. 자동 평가의 오류도 있으므로 중요한 사례는 사람 검토를 포함합니다.","follow":["LLM(엘엘엠)이 다른 LLM의 답변을 채점하면 객관적인가요?","검색 문서에 도구 실행을 유도하는 악성 지시가 있다면요?"],"follow_answers":["채점 모델도 편향과 오류가 있으므로 단독 정답 판정으로 보지 않습니다. 명시적인 rubric, 사람 평가와 일치도, 반복성과 비용을 확인해야 합니다.","검색 문서는 데이터로 취급하고 시스템 지시나 실행 권한으로 승격하지 않습니다. 도구 allowlist·인자·사용자 권한을 서버에서 검사하고 쓰기 작업은 필요한 승인을 거칩니다."]},{"id":"agent-7","number":15,"group":"agent","title":"WITH(위드) ESG(이에스지)에서 어떤 일을 맡았나요?","keywords":["입력 자료","내 기여","보고서 생성"],"answer":"WITH ESG에서는 보고서 OCR과 데이터 처리를 공동으로 맡고, 기사 벡터화·설문 수집·RAG 문단 생성과 저장에 참여했습니다. 보고서에서는 원천 수치와 생성 문장을 분리해 결과를 추적할 수 있게 했습니다.","quick":false,"deep":"OCR과 데이터 처리는 공동 작업이었습니다. 기사 임베딩, 설문 수집, 문단 생성·저장, 보고서 화면에서 본인이 맡은 부분을 골라 설명하세요. 최대 3개 PDF 동시 추출은 동시성 설정입니다.","follow":["ESG(이에스지) 전체를 PostgreSQL(포스트그레스큐엘) 기반이라고 설명해도 되나요?","여러 업무 중 하나를 기술적으로 깊게 설명한다면 무엇을 선택하나요?"],"follow_answers":["업무 초안 저장과 벡터 검색이 서로 다른 DB(디비) 경로이므로 정확하지 않습니다. MariaDB의 metric·narrative 저장과 PostgreSQL(포스트그레스큐엘)의 SR(에스알) 검색을 나눠 설명해야 합니다.","근거가 있는 초안 저장 흐름을 설명할 수 있습니다. 요청은 draft router에서 service와 repository를 거쳐 수치·문장 저장으로 이어지며, 두 저장의 원자성은 별도 문제입니다."]},{"id":"agent-8","number":16,"group":"agent","title":"ESG(이에스지) 보고서에서 숫자와 AI(에이아이) 문장을 왜 분리했나요?","keywords":["원천값","근거 확인","저장 실패"],"answer":"원천 수치와 생성 문장을 분리하면 문장에서 인용한 숫자를 원본과 대조할 수 있습니다. 저장은 각각 커밋되므로 한쪽만 남을 가능성이 있습니다. 두 결과가 함께 저장돼야 한다면 단일 트랜잭션과 실패 반환을 검토하겠습니다.","quick":false,"deep":"수치와 생성 문장이 각각 커밋되고 저장 실패 반환이 상위 흐름에서 누락될 수 있습니다. 단일 트랜잭션, 실패 전달, 문장과 원천 수치의 자동 대조는 개선 항목입니다.","follow":["수치 저장만 성공하면 사용자에게 성공이라고 응답해도 되나요?","PDF(피디에프) 동시 처리 3개는 성능 3배 향상인가요?"],"follow_answers":["완성된 초안 저장이 계약이라면 부분 성공을 완료로 알려서는 안 됩니다. 같은 DB(디비)의 원자적 저장이나 명시적 부분 실패 상태와 복구 절차가 필요합니다.","MAX_WORKERS=3이라는 동시 작업자 설정입니다. 파일 크기·외부 API(에이피아이)·I/O·제한에 따라 효과가 달라 처리시간 향상은 같은 입력의 전후 측정이 있어야 합니다."]},{"title":"검색 결과는 맞는데 생성된 답변이 틀리면 어떻게 개선하나요?","keywords":["실제 모델 문맥","근거 대조","회귀 질문"],"answer":"검색 결과가 최종 모델 문맥에 들어갔는지부터 확인하겠습니다. 근거가 충분하다면 답변의 주장과 출처를 대조하고, 근거가 부족하면 보류하도록 개선합니다. 같은 질문으로 개선 전후를 비교하겠습니다.","deep":"WITH ESG처럼 수치와 문장을 구분하면 숫자의 출처를 추적하기 쉽습니다. 숫자 대조 자동화는 개선 제안으로 설명하세요.","follow":["검색과 생성에는 각각 어떤 평가 기준을 쓰나요?"],"follow_answers":["검색은 필요한 문서가 후보에 있는지, 생성은 주장이 근거와 일치하는지 확인합니다."],"id":"agent-9","number":17,"group":"agent","quick":false},{"title":"ServIQ(서브아이큐) 도구 호출을 모델에 그대로 맡기지 않은 이유는?","keywords":["모델 제안","서버 권한","범위 제한"],"answer":"모델이 제안한 호출을 서버가 검증한 뒤 실행하도록 했습니다. ServIQ에서는 읽기 도구의 실행 직전에 권한과 요청 범위를 확인하는 경로를 두었습니다. 승인 상태와 실제 실행 권한은 따로 봅니다.","deep":"포트폴리오의 로컬 샘플 검증과 실제 POS·ERP 연동은 범위가 다릅니다.","follow":["승인을 받으면 이후 권한 검사는 끝나나요?"],"follow_answers":["승인 이후 역할이나 문서 권한이 바뀔 수 있습니다. 저장된 권한을 쓴다면 최신 권한을 재조회하거나 만료·무효화를 설계해야 합니다."],"id":"agent-10","number":18,"group":"agent","quick":false},{"id":"ax-1","number":19,"group":"ax","title":"햇들농산에서 재무와 판매를 각각 어떻게 다뤘나요?","keywords":["선행 재무 정보","판매 그래프","코드 검증"],"answer":"햇들농산에서 재무와 판매 Agent 흐름을 다뤘습니다. 판매 후보를 만들기 전에 현금·미수금·여신 정보를 넣고, LangGraph로 후보 생성과 검증·피드백을 연결했습니다. 전략 판단에는 모델을 활용하고 금액 계산과 제약 확인은 코드로 처리했습니다.","quick":false,"deep":"물류 조건 → 선행 재무 정보 → 판매 후보·검증·순위 → 재무 판정 → 재정렬 순서입니다. 판매 그래프에는 분기와 제한된 반복이 있습니다. 영속 체크포인트를 사용하는 ServIQ의 승인·재개와 구별해 설명하세요.","follow":["Sales(세일즈)에서 LangGraph(랭그래프)를 사용한 이유는 무엇인가요?","판매와 재무 사이에서 LLM(엘엘엠)과 코드의 역할을 어떻게 나눴나요?"],"follow_answers":["후보 생성 한 번으로 끝나지 않고 검증 결과에 따라 피드백과 재평가로 이동하므로 상태와 분기를 명시하기에 적합했습니다. 다만 단순한 고정 절차라면 일반 함수 조합이 더 간단할 수 있습니다. Sales(세일즈)의 그래프 사용 자체가 영속 체크포인트 구현을 의미하지는 않습니다.","모델은 전략·설명과 후보 판단을 돕고, 가격·수량·금액 같은 계산과 재무 제약 검사는 코드가 맡도록 나눴습니다. 계산을 코드로 옮겨도 입력이 틀리면 결과가 틀리므로 선행 재무 정보의 누락·범위와 결과 검증을 함께 봐야 합니다."]},{"id":"ax-2","number":20,"group":"ax","title":"판매 후보 생성 전에 재무 정보를 전달한 이유는?","keywords":["후보 전 제약","입력 순서","진단 기록"],"answer":"판매안을 만들기 전에 재무 제약을 알면 실행하기 어려운 후보를 줄일 수 있습니다. 당시 판매 실행 기록 9,937건에서 선행 재무 입력이 확인된 경우가 0건이라, 필요한 정보를 후보 생성 앞에 전달하도록 흐름을 수정했습니다.","quick":false,"deep":"9,937건 중 0건은 변경 전 실행 기록의 진단입니다. 변경 후에는 입력 순서와 품목 범위를 서로 다른 테스트로 확인했습니다. 매출이나 추천 품질 효과를 판단하려면 별도 데이터와 기준이 필요합니다.","follow":["재무 정보를 먼저 주는 것이 왜 필요한가요?","전달 순서를 바꾼 효과는 무엇으로 확인하나요?"],"follow_answers":["자금이나 재무 제약을 모르고 만든 후보는 이후에 부적합 판정을 받을 수 있습니다. 필요한 제약을 후보 생성 전에 제공해야 실행 가능한 전략을 만들기 쉽습니다.","동일 입력에서 후보 생성 전에 finance_context가 도착하는지와 필수 필드·실패 경로를 테스트합니다. 추천 품질이나 사업 효과는 별도의 평가 지표와 비교 데이터가 필요합니다."]},{"id":"ax-3","number":21,"group":"ax","title":"Finance(파이낸스) Planner(플래너) 호출은 어떻게 줄였나요?","keywords":["결정 가능한 단계","9회→3회","결과 비교"],"answer":"다음 도구가 확정되는 단계에서는 코드가 바로 선택하고, 판단이 필요한 단계에서만 Planner를 호출했습니다. 포트폴리오에 기록된 세 모드의 합계는 9회에서 3회로 줄었습니다. 같은 입력 조건에서 도구 실행 결과도 비교했습니다.","quick":false,"deep":"동일한 환경·입력·모델 제공자로 모드별 10회 반복하고 워밍업을 적용한 비교입니다. 세 모드의 Planner 호출 합계를 셌으며, 도구 호출과 FinanceCap·판정·근거 결과도 대조했습니다. 지연·비용은 별도 측정 지표입니다.","follow":["호출을 줄였는데 결과가 달라지지 않았다는 근거는 무엇인가요?","Planner(플래너)를 항상 생략해도 되나요?"],"follow_answers":["포트폴리오에는 같은 조건의 모드별 반복 비교에서 도구 호출 수·결과와 FinanceCap(파이낸스 캡)·Verdict(버딕트)·Evidence(에비던스)를 대조했고 25개 집중 테스트를 수행한 것으로 기록돼 있습니다. 실제 면접에서는 당시 비교 산출물 범위로 설명하고, 모든 입력이나 최신 코드에서 동일성을 보장한 것으로 넓히지 않겠습니다.","아닙니다. 정책과 상태로 다음 동작이 결정되는 구간은 코드가 적합하지만 실제로 여러 선택지를 판단해야 하는 구간까지 없애면 기능이 달라질 수 있습니다. 생략 조건과 예외 분기를 테스트하고 호출 횟수 외에 결과 품질도 확인해야 합니다."]},{"id":"ax-4","number":22,"group":"ax","title":"ServIQ(서브아이큐)의 승인·중단·재개는 어떻게 동작하나요?","keywords":["체크포인트","승인 검사","결과 재사용"],"answer":"그래프가 승인 지점에서 멈추면 체크포인트에 상태를 남깁니다. 재개 요청은 승인 정보가 맞는지 확인한 뒤 진행합니다. 도구 실행 결과는 별도 기록에 남겨 완료 결과를 재사용하고, 완료 여부를 모르는 실행은 상태를 확인합니다.","quick":false,"deep":"체크포인트는 그래프 상태를 저장하고, 실행 기록은 작업의 완료 여부를 추적합니다. 재개할 때 해당 노드가 처음부터 실행될 수 있습니다. 프로세스가 종료된 뒤에도 상태를 복구할 수 있는지는 체크포인트 저장소에 달려 있습니다.","follow":["체크포인트가 있으면 외부 도구가 정확히 한 번 실행되나요?","권한을 재검증하면 역할 회수도 즉시 반영되나요?"],"follow_answers":["그렇지 않습니다. 외부 작업 완료와 체크포인트 저장이 원자적으로 묶이지 않으면 중복·결과 불명 상태가 생깁니다. 완료 영수증 재사용과 멱등성 등의 처리가 필요합니다.","확인된 Harness(하네스)는 저장된 delegated_roles와 범위를 사용합니다. 최신 정책 검사와 현재 사용자 역할 재조회는 다르므로 즉시 회수까지 구현됐다고 단정할 수 없습니다."]},{"id":"ax-5","number":23,"group":"ax","title":"WITH(위드) ESG(이에스지)에서 어떤 일을 맡았나요?","keywords":["입력 자료","내 기여","보고서 생성"],"answer":"WITH ESG에서는 보고서 OCR과 데이터 처리를 공동으로 맡고, 기사 벡터화·설문 수집·RAG 문단 생성과 저장에 참여했습니다. 보고서에서는 원천 수치와 생성 문장을 분리해 결과를 추적할 수 있게 했습니다.","quick":false,"deep":"OCR과 데이터 처리는 공동 작업이었습니다. 기사 임베딩, 설문 수집, 문단 생성·저장, 보고서 화면에서 본인이 맡은 부분을 골라 설명하세요. 최대 3개 PDF 동시 추출은 동시성 설정입니다.","follow":["ESG(이에스지) 전체를 PostgreSQL(포스트그레스큐엘) 기반이라고 설명해도 되나요?","여러 업무 중 하나를 기술적으로 깊게 설명한다면 무엇을 선택하나요?"],"follow_answers":["업무 초안 저장과 벡터 검색이 서로 다른 DB(디비) 경로이므로 정확하지 않습니다. MariaDB의 metric·narrative 저장과 PostgreSQL(포스트그레스큐엘)의 SR(에스알) 검색을 나눠 설명해야 합니다.","근거가 있는 초안 저장 흐름을 설명할 수 있습니다. 요청은 draft router에서 service와 repository를 거쳐 수치·문장 저장으로 이어지며, 두 저장의 원자성은 별도 문제입니다."]},{"id":"ax-6","number":24,"group":"ax","title":"ESG(이에스지) 보고서에서 숫자와 AI(에이아이) 문장을 왜 분리했나요?","keywords":["원천값","근거 확인","저장 실패"],"answer":"원천 수치와 생성 문장을 분리하면 문장에서 인용한 숫자를 원본과 대조할 수 있습니다. 저장은 각각 커밋되므로 한쪽만 남을 가능성이 있습니다. 두 결과가 함께 저장돼야 한다면 단일 트랜잭션과 실패 반환을 검토하겠습니다.","quick":false,"deep":"수치와 생성 문장이 각각 커밋되고 저장 실패 반환이 상위 흐름에서 누락될 수 있습니다. 단일 트랜잭션, 실패 전달, 문장과 원천 수치의 자동 대조는 개선 항목입니다.","follow":["수치 저장만 성공하면 사용자에게 성공이라고 응답해도 되나요?","PDF(피디에프) 동시 처리 3개는 성능 3배 향상인가요?"],"follow_answers":["완성된 초안 저장이 계약이라면 부분 성공을 완료로 알려서는 안 됩니다. 같은 DB(디비)의 원자적 저장이나 명시적 부분 실패 상태와 복구 절차가 필요합니다.","MAX_WORKERS=3이라는 동시 작업자 설정입니다. 파일 크기·외부 API(에이피아이)·I/O·제한에 따라 효과가 달라 처리시간 향상은 같은 입력의 전후 측정이 있어야 합니다."]},{"id":"ax-7","number":25,"group":"ax","title":"AI(에이아이) 서비스 요청이 10배 늘면 어떻게 대응하나요?","keywords":["병목 측정","요청 제한","확장 검증"],"answer":"요청 지연과 오류율, 큐 길이, DB 연결과 모델 호출 한도를 먼저 보겠습니다. 병목에 맞춰 워커 동시성이나 캐시를 조정하고, 필요하면 요청량을 제한하겠습니다. 바꾼 뒤 같은 부하에서 처리량과 비용을 비교합니다.","quick":false,"deep":"요청이 10배 늘었다고 모든 서버를 10배로 늘리지는 않습니다. p95 지연·오류율·대기열·CPU(씨피유)·메모리·DB(디비) 연결·모델 quota를 보고 병목을 찾습니다. API(에이피아이)는 수평 확장하되 DB와 모델 호출이 감당할 수 있도록 동시성 상한을 둡니다. 긴 작업의 큐잉, 캐시·중복 제거, rate(레이트) limit(리밋)과 비용 예산을 함께 조정합니다.","follow":["DB(디비)가 병목인데 API(에이피아이) 인스턴스만 늘리면요?","큐를 두면 처리량 문제는 모두 해결되나요?"],"follow_answers":["DB(디비) 연결과 동시 쿼리가 늘어 상황이 악화될 수 있습니다. 쿼리·인덱스·풀 크기·잠금부터 확인하고 전체 연결 예산을 관리해야 합니다.","큐는 순간 부하를 완충하지만 worker(워커) 처리량이 유입보다 낮으면 대기만 계속 늘어납니다. 적체 시간·용량을 관측하고 확장 또는 요청 제한을 적용합니다."]},{"id":"ax-8","number":26,"group":"ax","title":"팀원과 기술 선택에서 의견이 다르면 어떻게 하나요?","keywords":["공통 목표","비교 기준","결정 기록"],"answer":"먼저 두 제안이 각각 어떤 문제를 푸는지 확인하겠습니다. 일정·정확성·운영 부담을 같은 기준으로 비교하고, 판단이 어려우면 작은 실험을 해 보겠습니다. 선택 이유와 남은 위험은 팀에 공유하겠습니다.","quick":false,"deep":"협업 갈등의 답변은 실제 과거 사례가 제공되지 않았으므로 대응 방식을 설명하는 예시입니다. 먼저 서로의 목표와 제약을 정리하고 의견 차이가 요구사항인지 구현 취향인지 나눕니다. 성능·개발 시간·운영 난이도 같은 기준을 합의한 뒤 작은 실험이나 코드 비교로 판단합니다. 결정 이유와 보류한 위험을 기록하고, 일정에 영향을 주면 담당자에게 빨리 공유합니다.","follow":["상대가 끝까지 자신의 기술을 주장하면 어떻게 하나요?","실제로 그런 갈등을 해결한 경험이 있나요?"],"follow_answers":["다수결 전에 공통 평가 기준과 제한된 검증 시간을 합의하겠습니다. 합의가 어려우면 근거와 일정 영향을 정리해 기술 책임자의 결정을 구하고 결과를 따르겠습니다.","현재 준비 자료에는 구체적인 갈등 사례가 없어 해결 경험으로 단정할 수 없습니다. 실제 경험이 없다면 없다고 답하고 방금 말한 내용은 상황에 대한 대응 방식이라고 설명해야 합니다."]},{"title":"햇들농산에서 어떤 판단을 모델에 맡기고 어떤 판단을 코드로 처리했나요?","keywords":["모델의 전략 제안","계산 코드","실행 조건"],"answer":"모델은 판매 전략과 후보를 제안하고, 금액 계산과 재무 제약 판정은 코드가 담당하도록 했습니다. 실제 실행 단계에서는 Harness로 권한·의존성·예산을 확인했습니다.","deep":"판매 후보·검증과 Finance Harness 역할을 나눠 설명하세요.","follow":["판매 후보를 다시 평가하는 조건은?"],"follow_answers":["검증에서 확인된 제약이나 피드백을 반영할 필요가 있을 때 다시 평가하도록 흐름을 구성할 수 있습니다."],"id":"ax-9","number":27,"group":"ax","quick":false},{"title":"자동화 흐름에서 실패를 재시도할지 어떻게 판단하나요?","keywords":["일시 오류","멱등성","완료 여부"],"answer":"일시적인 통신 오류와 권한 거부를 먼저 구분하겠습니다. 외부 요청이 시간 초과됐으면 실제 작업이 끝났는지 확인합니다. 같은 요청을 반복해도 안전할 때만 횟수를 제한해 재시도하겠습니다.","deep":"개선 설계 질문입니다. 프로젝트의 완료 결과 재사용과 외부 쓰기 중복 방지를 별개로 설명하세요.","follow":["모든 실패를 자동 재시도하면 어떤 문제가 있나요?"],"follow_answers":["부하가 커지거나 외부 작업이 중복될 수 있습니다. 오류 종류와 작업 특성으로 정책을 나눠야 합니다."],"id":"ax-10","number":28,"group":"ax","quick":false},{"id":"backend-1","number":29,"group":"backend","title":"금융안심이의 Docker(도커) 이미지는 어떻게 줄였나요?","keywords":["CPU 전용 의존성","빌드 캐시","이미지 크기"],"answer":"CPU 배포에 맞춰 PyTorch를 CPU 전용으로 바꾸고, GPU 관련 의존성을 제거하고, 빌드 캐시를 분리했습니다. 포트폴리오에 기록된 Docker 이미지 크기는 약 22.5GB에서 2.87GB로 줄었습니다.","quick":false,"deep":"22.5GB → 2.87GB는 이미지 크기입니다. API·DB·모델 로드와 CPU 초기화는 포트폴리오에 확인 기록이 있습니다. 실제 음성 입력부터 결과까지의 전체 검증은 별도 항목입니다.","follow":["캐시를 분리하는 것과 패키지를 삭제하는 것은 어떤 차이인가요?","경량화 후 무엇을 검증해야 하나요?"],"follow_answers":["빌드 캐시는 다운로드·빌드 결과 재사용을 위한 것이고 실행 의존성은 앱 동작에 필요합니다. 캐시 마운트는 최종 이미지에 캐시를 포함하지 않으면서 빌드를 돕는 방식입니다.","필수 라이브러리 import(임포트), 모델 로딩과 대표 추론, API(에이피아이) 실행을 확인해야 합니다. 같은 모델·입력에서 결과와 latency(레이턴시)를 별도로 비교하면 기능 손상과 성능 변화를 구분할 수 있습니다."]},{"id":"backend-2","number":30,"group":"backend","title":"Compose(컴포즈)에서 앱이 DB(디비)에 localhost(로컬호스트)로 연결하면 왜 실패하나요?","keywords":["컨테이너 주소","서비스 이름","내부 포트"],"answer":"앱 컨테이너의 localhost는 앱 컨테이너 자신입니다. DB가 같은 Compose 네트워크에 있고 서비스 이름이 postgres라면 postgres:5432로 연결합니다. 서비스 간 통신에는 DB의 내부 포트를 사용합니다.","quick":false,"deep":"같은 Compose(컴포즈) 네트워크의 서비스는 서비스 이름을 DNS(디엔에스) 이름으로 사용할 수 있습니다. 앱에서 DB(디비) 서비스가 postgres(포스트그레스)라면 postgres:5432로 연결합니다. localhost(로컬호스트)는 접속을 시도하는 앱 컨테이너 자신을 가리킵니다. 호스트에 게시한 DB 포트는 컨테이너 간 내부 접속에 보통 필요하지 않습니다.","follow":["DB(디비)를 15432:5432로 게시했다면 앱 컨테이너는 어떤 포트를 쓰나요?","서비스 이름이 맞는데 시작 직후 DB(디비) 연결이 실패하면요?"],"follow_answers":["같은 네트워크에서는 postgres:5432를 사용합니다. 개발자 PC(피씨)의 호스트 주소로 연결할 때 게시된 15432를 사용합니다.","DB(디비) 프로세스의 준비가 아직 끝나지 않았을 수 있습니다. health(헬스) check와 준비 조건을 확인하고 앱 연결에는 제한된 재시도와 오류 처리를 둡니다."]},{"id":"backend-3","number":31,"group":"backend","title":"트랜잭션과 COMMIT(커밋)·ROLLBACK(롤백)을 설명해 주세요.","keywords":["작업 묶음","커밋","롤백"],"answer":"트랜잭션은 관련 DB 변경을 함께 성공시키거나 되돌리는 단위입니다. 송금이라면 차감과 입금이 모두 성공할 때 커밋합니다. 한 단계라도 실패하면 롤백해 한쪽 계좌만 바뀌는 일을 막습니다.","quick":false,"deep":"트랜잭션은 여러 DB(디비) 작업을 하나의 논리적 성공·실패 단위로 묶습니다. 예를 들어 송금의 차감과 입금이 모두 성공하면 commit(커밋)하고, 한쪽이 실패하면 rollback(롤백)해 부분 반영을 막습니다. 업무 규칙과 제약조건은 별도로 정확히 작성해야 합니다. 트랜잭션을 쓴다고 모든 동시성 경쟁이 자동으로 해결되는 것은 아닙니다. ACID(애시드)는 원자성·일관성·격리성·지속성으로, 전체 변경의 성공·취소, 제약 유지, 동시 실행 제어, 확정 결과 보존을 뜻합니다.","follow":["commit(커밋) 이후의 변경을 rollback(롤백)으로 취소할 수 있나요?","트랜잭션 안에서 LLM(엘엘엠) 응답을 오래 기다리면요?"],"follow_answers":["이미 확정된 트랜잭션은 일반 rollback(롤백)으로 되돌리지 못합니다. 반대 변경을 수행하는 보상 작업이나 백업 복원 등 상황에 맞는 처리가 필요합니다.","잠금과 DB(디비) 연결을 오래 점유해 다른 요청을 지연시킬 수 있습니다. 외부 작업과 DB 저장을 짧은 상태 전이로 분리하는 설계를 검토합니다."]},{"id":"backend-4","number":32,"group":"backend","title":"잔액 10만 원에서 두 명이 동시에 8만 원을 출금하면?","keywords":["잔액 조건","변경 행 수","거래 이력"],"answer":"잔액을 읽고 나중에 차감하면 두 요청이 같은 초기 잔액을 기준으로 판단할 수 있습니다. 차감 SQL에 잔액이 충분하다는 조건을 넣고, 변경된 행 수로 성공 여부를 확인하겠습니다. 거래 이력은 같은 트랜잭션에서 저장합니다.","quick":false,"deep":"잔액 조회 후 Python(파이썬)에서 차감값을 계산하면 두 요청이 같은 잔액으로 판단할 수 있습니다. 단일 계좌는 UPDATE(업데이트) accounts SET(에스이티) balance=balance-80000 WHERE(웨어) id(아이디)=1 AND(에이엔디) balance>=80000처럼 조건과 갱신을 한 문장에 넣고 변경 행 수를 확인할 수 있습니다. 관련 거래 이력도 같은 트랜잭션에 저장합니다. 더 복잡한 규칙에는 행 잠금이나 더 강한 격리 수준을 검토합니다.","follow":["영향 행 수가 0이면 어떻게 처리하나요?","SELECT(셀렉트) FOR(에프오알) UPDATE(업데이트)는 어떤 대안인가요?"],"follow_answers":["잔액 부족이나 대상 계좌 없음 등 갱신 조건 불충족을 의미합니다. API(에이피아이) 계약에 맞게 구분하고 성공 거래로 기록하거나 commit(커밋)하지 않도록 업무 흐름을 정합니다.","트랜잭션 안에서 대상 행을 잠근 뒤 잔액 검사와 갱신을 수행하는 방법입니다. 잠금 시간과 여러 행의 획득 순서를 관리해 대기·교착을 줄여야 합니다."]},{"id":"backend-5","number":33,"group":"backend","title":"FastAPI(패스트에이피아이)에서 async(에이싱크) def(데프)를 쓰면 항상 빨라지나요?","keywords":["I/O 대기","이벤트 루프","CPU 작업"],"answer":"비동기는 I/O를 기다리는 동안 다른 요청을 처리하는 데 유리합니다. async 함수에서 동기 DB 호출이나 긴 계산을 수행하면 이벤트 루프가 막힐 수 있습니다. 의존성이 비동기를 지원하는지 확인하고 CPU 작업은 별도 워커를 검토하겠습니다.","quick":false,"deep":"비동기는 I/O 대기 동안 실행을 양보해 다른 요청을 처리하도록 하는 방식입니다. async(에이싱크) def(데프) 안에서 동기 DB(디비) 호출이나 긴 Python(파이썬) 계산을 직접 수행하면 event(이벤트) loop를 막을 수 있습니다. FastAPI(패스트에이피아이)가 직접 실행하는 일반 def endpoint(엔드포인트)는 thread(스레드) pool에서 처리하지만, async 함수가 직접 부르는 보통 함수까지 자동으로 분리되지는 않습니다. CPU(씨피유) 연산에는 작업 프로세스나 별도 추론 서비스가 더 적합할 수 있습니다.","follow":["await(어웨이트)를 붙이면 동기 함수가 비동기로 바뀌나요?","Python(파이썬) thread(스레드)를 늘리면 CPU(씨피유) 추론이 항상 빨라지나요?"],"follow_answers":["아닙니다. await(어웨이트) 가능한 비동기 API(에이피아이)를 사용하거나 동기 I/O를 적절히 thread(스레드) pool로 옮겨야 합니다. CPU(씨피유) 작업은 thread를 늘리는 것만으로 해결되지 않을 수 있습니다.","GIL(지아이엘)을 사용하는 일반 CPython의 Python(파이썬) 연산은 제한이 있지만 native(네이티브) 라이브러리가 GIL을 풀기도 합니다. 선택적 free-threaded(프리 스레디드) 빌드도 있으므로 런타임과 라이브러리를 확인하고 실제 작업을 측정해야 합니다."]},{"id":"backend-6","number":34,"group":"backend","title":"DB(디비) 인덱스를 만들면 모든 쿼리가 빨라지나요?","keywords":["실행 계획","읽기 범위","쓰기 비용"],"answer":"인덱스는 좁은 범위를 조회하거나 정렬하는 데 유리합니다. 많은 행을 읽을 때는 전체 스캔이 더 나을 수 있고, 인덱스를 유지하는 쓰기 비용도 듭니다. 실제 데이터와 실행 계획을 보고 결정하겠습니다.","quick":false,"deep":"인덱스는 추가 자료구조를 유지해 조건에 맞는 행이나 정렬 결과를 더 효율적으로 찾도록 돕습니다. 모든 조회가 빨라지는 것은 아니며 데이터 분포·선택도·조건 형태에 따라 순차 스캔이 나을 수도 있습니다. 인덱스는 저장 공간과 INSERT(아이엔에스이알티)·UPDATE(업데이트)·DELETE(딜리트) 유지 비용이 있습니다. 실제 쿼리와 실행 계획을 기준으로 설계합니다.","follow":["WHERE(웨어) user_id=? ORDER(오더) BY(바이) created_at에 어떤 인덱스를 검토하나요?","인덱스가 있어도 사용되지 않는 이유는?"],"follow_answers":["user_id와 created_at 순서의 복합 B-tree(비트리) 등을 검토할 수 있습니다. 정렬 방향, 조회 범위와 실제 실행 계획을 확인해 적합성을 판단합니다.","많은 행을 읽거나 통계·형변환·함수 적용 때문에 사용 이점이 작을 수 있습니다. 실제 조건과 비용 추정, 통계를 확인합니다."]},{"id":"backend-7","number":35,"group":"backend","title":"Python(파이썬)의 list(리스트)와 dict(딕트)는 언제 선택하나요?","keywords":["순서","키 조회","비용"],"answer":"순서가 있거나 위치로 접근해야 하면 list를 쓰고, 식별자나 이름으로 값을 반복 조회하면 dict를 씁니다. list의 값 검색은 보통 O(n), dict의 키 조회는 평균 O(1)입니다. dict의 메모리와 키 조건도 고려합니다.","quick":false,"deep":"list(리스트)는 순서대로 요소를 저장하는 가변 시퀀스이고 dict(딕트)는 hash(해시) 가능한 키에 값을 연결하는 매핑입니다. list의 인덱스 접근은 O(1), 값 포함 여부를 순차로 찾는 것은 O(n)입니다. dict 키 조회는 평균 O(1)이지만 최악의 비용과 메모리 부담이 있습니다. dict도 삽입 순서를 보존하지만 그 사실과 키 기반 조회 방식은 구분합니다.","follow":["중복 ID(아이디)의 존재를 자주 확인하려면 무엇을 쓰나요?","함수 기본값을 items=[]로 두면 왜 문제가 되나요?"],"follow_answers":["값과 연결할 필요가 없으면 set(세트), ID(아이디)별 결과도 필요하면 dict(딕트)를 검토합니다. list(리스트)를 매번 순회하는 것보다 조회 비용을 줄일 수 있지만 메모리 사용도 고려합니다.","기본값은 함수 정의 시 한 번 만들어져 호출 사이에 같은 list(리스트)가 공유됩니다. None(논)을 기본값으로 두고 함수 안에서 새 list를 생성하면 의도치 않은 누적을 피할 수 있습니다."]},{"id":"backend-8","number":36,"group":"backend","title":"서비스에 갑자기 500 오류가 늘면 어떻게 하겠습니까?","keywords":["영향 범위","최근 변경","로그와 복구"],"answer":"먼저 오류가 늘어난 시각과 영향을 받은 요청을 확인하겠습니다. 최근 배포·설정 변경과 요청 ID 로그를 대조해 애플리케이션·DB·외부 호출 중 어디서 실패했는지 좁힙니다. 영향이 크면 복구를 우선하고 조치 후 오류율을 확인합니다.","quick":false,"deep":"500 증가를 보면 오류율·영향 endpoint(엔드포인트)·시작 시각부터 확인합니다. 배포·설정 변경과 요청 ID(아이디)의 로그를 대조하고 DB(디비) 연결·외부 API(에이피아이)·리소스 지표를 확인합니다. 원인 확정 전에도 새 버전과 연관이 분명하고 호환성이 보장되면 롤백 등 복구를 검토합니다. 정상화 후 실패 입력·예외 처리·회귀 검증과 알람을 보완합니다.","follow":["모든 500을 재시도하면 복구가 빨라지나요?","로그에 민감한 문서 내용이 필요한 것 같다면요?"],"follow_answers":["지속적인 코드 오류나 DB(디비) 과부하에서는 재시도가 부하를 키울 수 있습니다. 일시 오류인지 구분하고 횟수·지연·동시성 제한과 멱등성을 적용해야 합니다.","원문 전체 대신 요청 ID(아이디)·단계·오류 유형과 비식별 메타데이터를 우선 기록합니다. 필요한 진단 자료도 최소화하고 접근 권한·보존 정책을 적용합니다."]},{"title":"ServIQ(서브아이큐)의 파일 입력부터 조사 상태 조회까지 어떻게 설명하나요?","keywords":["입력 검증","작업 식별","상태·결과 조회"],"answer":"ServIQ에서 파일을 받는 API가 입력을 검증하고 조사 실행과 상태 조회를 연결하도록 구현했습니다. 요청을 설명할 때는 잘못된 파일을 받았을 때와 정상 입력이 처리 중일 때, 완료 후 결과를 읽을 때를 구분하겠습니다.","deep":"이력서에 명시된 파일 Import와 상태 API를 중심으로 설명하세요. 실제 응답 필드나 상태 코드는 확인한 범위에서 말합니다.","follow":["오래 걸리는 요청을 개선한다면?"],"follow_answers":["접수와 처리 수명을 분리해 작업 ID를 반환하고 상태 조회와 재시도 정책을 두겠습니다."],"id":"backend-9","number":37,"group":"backend","quick":false},{"title":"금융안심이의 분석 결과를 저장할 때 무엇을 고려하나요?","keywords":["위험 결과·근거","사용자 권한","중복 처리"],"answer":"금융안심이에서는 FastAPI로 분석 결과와 근거를 저장하고 조회하는 흐름을 연결했습니다. 확장한다면 요청 식별자와 결과 조회 권한을 정하고, 저장은 됐지만 응답이 끊겼을 때 같은 결과를 돌려주는 기준을 마련하겠습니다.","deep":"분석 모델 평가와 결과 API 검증은 별개의 검증입니다.","follow":["저장은 성공했는데 응답이 끊기면?"],"follow_answers":["재요청에서 기존 결과를 찾을 수 있게 요청 식별자와 중복 처리 정책을 설계하겠습니다."],"id":"backend-10","number":38,"group":"backend","quick":false}];

try{marks=JSON.parse(localStorage.getItem(STORE)||'{}');if(!marks||typeof marks!=='object'||Array.isArray(marks))marks={}}catch{marks={}}
const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){const rows=[{id:'all',icon:'↗',name:'전체 복습',sub:'38문항 · 권장 순서'},...groups.map((g,i)=>({id:g.id,icon:String(i+1).padStart(2,'0'),name:g.name,sub:`${data.filter(x=>x.group===g.id).length}문항 · ${g.time}`})),{id:'quick',icon:'8',name:'공통 질문 8문항',sub:'자기소개부터 문제 해결까지'}];$('studyNav').innerHTML=rows.map(r=>`<button class="nav-btn ${view===r.id?'active':''} ${r.id==='quick'?'quick':''}" data-view="${r.id}" ${view===r.id?'aria-current="true"':''}><span class="nav-icon">${r.icon}</span><span><span class="nav-text">${r.name}</span><span class="nav-sub">${r.sub}</span></span></button>`).join('')}
function selected(){const query=$('search').value.trim().toLocaleLowerCase(),status=$('statusFilter').value;return data.filter(x=>(view==='all'||(view==='quick'?x.quick:x.group===view))&&(!query||[x.title,...x.keywords,x.answer,x.deep,...x.follow,...x.follow_answers].join(' ').toLocaleLowerCase().includes(query))&&(status==='all'||(status==='new'?!marks[x.id]:marks[x.id]===status)))}
function card(x){const g=groups.find(g=>g.id===x.group),status=marks[x.id],hide=masked&&!printing;return `<article class="card" id="${x.id}"><div class="question-top"><span class="qid">${String(x.number).padStart(2,'0')}</span><span class="group-tag">${esc(g.name)}</span><span class="mark">${status==='done'?'설명 가능':status==='review'?'한 번 더':''}</span></div><h3>${esc(x.title)}</h3><p class="keyword-list">${x.keywords.map(esc).join(" · ")}</p><div class="answer-content" ${hide?'hidden':''}><div class="answer-label">이렇게 말해보기 · 30–60초</div><p class="spoken">${esc(x.answer)}</p><details class="extra" ${printing?'open':''}><summary>원리와 꼬리질문 살펴보기</summary><p class="why">${esc(x.deep)}</p><div class="sub-label">이어서 물을 수 있는 질문</div>${x.follow.map((q,j)=>`<section class="follow"><h4>${esc(q)}</h4><p>${esc(x.follow_answers[j])}</p></section>`).join('')}</details></div>${hide?'<button class="reveal" data-reveal>답변 확인하기</button>':''}<div class="self-check"><button class="review ${status==='review'?'selected':''}" data-mark="review" data-id="${x.id}" aria-pressed="${status==='review'}">한 번 더</button><button class="${status==='done'?'selected':''}" data-mark="done" data-id="${x.id}" aria-pressed="${status==='done'}">설명 가능</button></div></article>`}
function draw(){const list=selected(),totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));page=Math.min(Math.max(1,page),totalPages);const g=groups.find(g=>g.id===view);$('viewTitle').textContent=g?g.name:view==='quick'?'공통 질문 8문항':'전체 복습';$('viewDescription').textContent=g?g.desc:view==='quick'?'자기소개·직무 선택·기여·문제 해결을 연습하세요.':'지원 직무를 선택하면 해당 질문만 볼 수 있습니다.';const visible=printing?list:list.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);$('cards').innerHTML=visible.length?visible.map(card).join(''):'<div class="empty"><strong>해당하는 질문이 없습니다.</strong><p>검색어나 복습 상태를 바꿔보세요.</p><button data-clear>필터 초기화</button></div>';$('resultCount').textContent=list.length?`${list.length}문항 중 ${(page-1)*PAGE_SIZE+1}–${Math.min(page*PAGE_SIZE,list.length)} · ${page}/${totalPages}페이지`:'검색 결과 0문항';$('pager').innerHTML=list.length?`<button data-page="${page-1}" ${page===1?'disabled':''} aria-label="이전 페이지">← 이전</button>${phone.matches?`<span class="page-position">${page} / ${totalPages}</span>`:Array.from({length:totalPages},(_,i)=>`<button data-page="${i+1}" ${page===i+1?'aria-current="page"':''} aria-label="${i+1}페이지">${i+1}</button>`).join('')}<button data-page="${page+1}" ${page===totalPages?'disabled':''} aria-label="다음 페이지">다음 →</button>`:'';const done=data.filter(x=>marks[x.id]==='done').length;$('progressText').textContent=`${done} / 38`;$('progressFill').style.width=`${done/38*100}%`;$('maskToggle').textContent=masked?'답변 보이기':'답변 가리기';$('maskToggle').setAttribute('aria-pressed',String(masked));nav()}
function goTop(){$('mainTop').scrollIntoView({behavior:'smooth',block:'start'})}
$('studyNav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;page=1;draw();if(phone.matches){setRail(false);goTop()}});
$('pager').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b||b.disabled)return;page=Number(b.dataset.page);draw();goTop()});
$('search').addEventListener('input',()=>{page=1;draw()});$('statusFilter').addEventListener('change',()=>{page=1;draw()});
$('maskToggle').addEventListener('click',()=>{masked=!masked;draw()});
$('cards').addEventListener('click',e=>{const mark=e.target.closest('[data-mark]'),reveal=e.target.closest('[data-reveal]');if(mark){const id=mark.dataset.id;marks[id]=marks[id]===mark.dataset.mark?undefined:mark.dataset.mark;try{localStorage.setItem(STORE,JSON.stringify(marks))}catch{}draw();$('statusLive').textContent=`${id} 복습 표시 변경`}else if(reveal){reveal.closest('.card').querySelector('.answer-content').hidden=false;reveal.remove()}else if(e.target.closest('[data-clear]')){$('search').value='';$('statusFilter').value='all';page=1;draw()}});
$('reviewOnly').addEventListener('click',()=>{view='all';$('statusFilter').value='review';$('search').value='';page=1;draw();goTop()});
$('resetProgress').addEventListener('click',()=>{if(!confirm('38문항의 복습 표시를 모두 초기화할까요?'))return;marks={};try{localStorage.removeItem(STORE)}catch{}draw()});
$('printButton').addEventListener('click',()=>window.print());window.addEventListener('beforeprint',()=>{printing=true;draw()});window.addEventListener('afterprint',()=>{printing=false;draw()});
function setRail(open){
  const toggle=$('railToggle');
  toggle.closest('.rail').classList.toggle('expanded',open);
  toggle.setAttribute('aria-expanded',String(open));
  toggle.textContent=open?'복습 묶음 닫기':'복습 묶음 열기';
}
$('railToggle').addEventListener('click',()=>setRail($('railToggle').getAttribute('aria-expanded')!=='true'));
phone.addEventListener('change',()=>{
  const first=(page-1)*PAGE_SIZE;
  PAGE_SIZE=phone.matches?1:5;
  page=Math.floor(first/PAGE_SIZE)+1;
  draw();
});
draw();
</script>
</body>
</html>
