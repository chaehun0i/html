:root{--ink:#193348;--muted:#526b79;--line:#d9e5ea;--blue:#136e85;--pale:#eaf5f6;--paper:#fff;--bg:#f4f7f7}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;word-break:keep-all}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:8px 12px}button:hover,.active{background:var(--pale)}a{color:var(--blue);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #edb852;outline-offset:3px}.shell{max-width:1350px;margin:auto;padding:22px 22px 90px}.hero{background:#102b3f;color:#fff;border-radius:18px;padding:26px 32px;margin-bottom:20px}.hero h1{font-size:clamp(25px,4vw,38px);letter-spacing:-.04em;line-height:1.3;margin:4px 0 10px}.hero p{color:#d3e6ea;max-width:850px;margin:0}.eyebrow{font-size:12px;letter-spacing:.12em;color:#77cad4;font-weight:700}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}.side{align-self:start;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.side h2{font-size:14px;margin:0 0 9px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:6px;font-size:13px;line-height:1.4}.side button.active{background:var(--pale);color:var(--blue);font-weight:750}.side .phase{font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin:14px 0 3px;padding-top:10px}.side .counter{font-size:12px;color:var(--muted);margin:0 0 12px}.main{min-width:0}.toolbar{display:flex;gap:7px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:16px;flex-wrap:wrap}.toolbar input{min-width:160px;flex:1;border:1px solid var(--line);border-radius:7px;padding:7px 10px}.toolbar button{font-size:13px}.sheet{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:clamp(18px,3.8vw,38px);margin-bottom:15px}.sheet h2{font-size:clamp(24px,3vw,32px);line-height:1.4;margin:0 0 10px;letter-spacing:-.04em}.sheet h3{font-size:19px;margin:27px 0 8px;line-height:1.5}.sheet p{margin:8px 0 17px;max-width:79ch}.overline{font-size:12px;color:var(--blue);font-weight:750;letter-spacing:.07em}.lead{font-size:17px;line-height:1.9}.muted{color:var(--muted);font-size:14px}.bridge{border-left:3px solid var(--blue);background:#f2f8f9;padding:14px 17px;margin:18px 0}.bridge p{margin:5px 0}.toc{display:flex;gap:7px;flex-wrap:wrap;margin:19px 0}.toc a{font-size:13px;padding:3px 9px;border-radius:7px;background:#edf5f6;text-decoration:none}.worked{background:#f2f8f9;border-radius:12px;padding:17px 20px;margin:24px 0}.worked ol{margin:8px 0;padding-left:22px}.worked li{padding:3px 0}.tablewrap{overflow-x:auto}.compare{border-collapse:collapse;width:100%;font-size:14px}.compare th,.compare td{border-bottom:1px solid var(--line);text-align:left;vertical-align:top;padding:9px 12px;min-width:110px}.compare th{background:#ecf5f7}.lesson{padding:26px 0;border-top:1px solid var(--line);scroll-margin-top:16px}.lesson h3{margin:0 0 14px}.lesson .number{font-size:12px;color:var(--blue);font-weight:750}.lesson h4{font-size:13px;color:var(--blue);margin:15px 0 4px}.lesson p{margin:4px 0 10px}.example{white-space:pre-wrap;overflow-x:auto;background:#f4f6f8;border-left:3px solid #7babb6;border-radius:5px;padding:12px 15px;font:14px/1.8 ui-monospace,Consolas,"Malgun Gothic",monospace;word-break:normal}.misread{background:#fff6ea;border-radius:7px;padding:11px 13px}.quiz{margin-top:16px;background:#f3f7f8;border-radius:9px;padding:11px 14px;font-size:14px}.quiz summary{cursor:pointer;font-weight:750}.quiz p{margin:8px 0 0}.donebtn{margin-top:11px;font-size:12px}.donebtn.active{border-color:#70aebb;color:#11647a}.sources{border-top:1px solid var(--line <select id="lens"><option value="core">첫 학습 · 36단원</option><option value="next">실무 확장 · 17단원</option><option value="backend">Python Backend 심화</option><option value="agent">Agent·RAG 심화</option><option value="ax">Automation·AX 심화</option><option value="reference">참고 단원</option><option value="all">전체 144단원</option></select></label><p class="counter" id="counter"></p><div id="chapterNav"></div></aside><main class="main" id="main"><div class="toolbar"><input id="search" type="search" aria-label="개념 검색" placeholder="용어·증상 검색 (예: 포트, 트랜잭션)"><button id="home">시작</button><button id="terms">용어 사전</button><button id="print">현재 장 인쇄</button></div><div id="content"></div><div class="pager" id="pager"></div><div class="footer">공식 문서 링크는 각 장 끝에 있습니다. 학습 표시는 현재 브라우저에 저장됩니다.</div></main></div></div><div class="sr" aria-live="polite" id="live"></div><script>
const book=[{"number":1,"title":"컴퓨터가 정보를 다루는 방법","prerequisite":"시작하는 데 필요한 사전 지식이 없습니다. 숫자·글자·프로그램이 결국 컴퓨터 안에서 어떻게 표현되는지부터 시작합니다.","intro":"업로드가 잘리거나 한글이 깨질 때는 파일 크기, 문자 인코딩, 실행 메모리를 구분해서 확인합니다.","practice":"로컬 Python에서 len(\"가\")와 len(\"가\".encode(\"utf-8\"))를 비교하세요. 업로드 제한을 글자 수로 검사하면 틀리는 사례를 적어 보세요.","done_when":"문자 수는 1이고 UTF-8 크기는 3바이트임을 설명하고, 바이트 제한은 인코딩 뒤의 크기로 판단합니다.","example_title":"사진 파일 하나 열어 보기","trace":["디스크의 사진 파일은 압축된 byte(바이트)들의 묶음입니다. 파일 확장자는 형식을 짐작하게 하지만 내용 자체를 보장하지는 않습니다.","프로그램이 파일을 읽어 메모리에 가져오고 CPU(씨피유)가 형식을 해석합니다. 화면 표시에는 GPU(지피유)가 관여할 수도 있습니다.","다른 이름으로 저장하면 새 데이터가 저장소에 기록됩니다. 화면에 보이는 상태, 메모리에 있는 상태, 디스크에 저장된 상태를 구분합니다."],"table":[["대상","역할","전원이 꺼지면"],["CPU","명령을 실행","진행 중 실행 상태를 잃음"],["RAM","작업 중 값을 보관","일반적으로 내용이 사라짐"],["SSD·HDD","파일을 영속 저장","정상 장치라면 데이터 유지"]],"lessons":[{"title":"비트·바이트와 용량 단위","definition":"컴퓨터는 정보를 두 상태로 구별합니다. 이 한 칸을 bit(비트), 8개 bit를 묶은 단위를 byte(바이트)라고 합니다.","mechanism":"n개 bit(비트)로 2의 n제곱 가지 패턴을 표현할 수 있습니다. MB(엠비)는 보통 10의 6제곱 byte(바이트), MiB(메비바이트)는 2의 20제곱 byte입니다. 전송 속도의 Mbps(엠비피에스)와 파일 크기의 MB도 구별합니다.","example":"8bit에는 256가지 패턴이 있다. 80Mbps는 이론상 10MB/s이며 실제 파일 전송은 부가 정보와 환경 때문에 더 느릴 수 있다.","mistake":"1byte를 글자 한 개와 동일시하면 안 됩니다. 인코딩마다 문자에 필요한 byte(바이트) 수가 다릅니다.","question":"16bit로 몇 가지 패턴을 표현할 수 있나요?","answer":"2^16=65,536가지입니다. 부호·소수 표현에 어떻게 배분하느냐에 따라 실제 수 범위가 달라집니다.","id":"c01-s1","number":1,"chapter":1},{"title":"문자 인코딩과 Unicode(유니코드)","definition":"문자를 저장하려면 문자와 숫자를 대응시키는 규칙이 필요합니다. Unicode(유니코드)는 문자 코드 체계이고 UTF-8(유티에프-8)은 이를 byte(바이트)로 표현하는 방식 중 하나입니다.","mechanism":"UTF-8(유티에프-8)은 가변 길이입니다. 같은 문장을 다른 인코딩으로 해석하면 글자가 깨질 수 있습니다. 읽기·쓰기·HTTP(에이치티티피) 전달 단계에서 인코딩을 맞춰야 합니다.","example":"Python(파이썬)에서 len('가')는 1, len('가'.encode('utf-8'))는 3이다. 화면상 한 글자라도 결합 문자나 이모지는 여러 코드 포인트일 수 있다.","mistake":"업로드 원본의 인코딩을 확인한 뒤 디코딩합니다. 잘못 디코딩해 대체 문자로 저장했다면 이후 UTF-8(유티에프-8)로 다시 인코딩해도 원문을 복구하기 어렵습니다.","question":"한글 파일만 깨진다면 무엇부터 확인하나요?","answer":"파일을 쓸 때와 읽을 때의 인코딩을 확인합니다. 원본이 다른 인코딩인데 UTF-8(유티에프-8)이라고 표시만 바꾸어서는 복구되지 않습니다.","id":"c01-s2","number":2,"chapter":1},{"title":"이진수·논리 연산·부동소수점","definition":"숫자도 bit(비트) 패턴으로 표현합니다. AND(에이엔디)는 둘 다 참일 때, OR(오알)는 하나 이상 참일 때, NOT(엔오티)은 참과 거짓을 뒤집는 논리 연산입니다.","mechanism":"일반적인 부동소수점은 제한된 bit(비트)로 매우 넓은 수 범위를 근사합니다. 10진 소수 일부가 정확히 표현되지 않아 계산 오차가 생깁니다. 금액은 최소 화폐 단위 정수나 명시적인 decimal(데시멀) 정책을 사용합니다.","example":"Python(파이썬)에서 0.1+0.2==0.3은 False(폴스)일 수 있다. 금액 100원은 정수 100으로 저장하고 반올림 시점도 업무 규칙으로 정한다.","mistake":"float가 고장 난 것이 아니라 표현 방식에 한계가 있습니다. 비교에 항상 정확한 등호를 쓰면 안 됩니다.","question":"금액을 소수 둘째 자리로 반올림하면 모든 문제가 해결되나요?","answer":"반올림을 언제 어떤 규칙으로 할지까지 일치해야 합니다. 내부 계산과 저장·출력 정책이 다르면 합계가 어긋날 수 있습니다.","id":"c01-s3","number":3,"chapter":1},{"title":"CPU(씨피유)와 명령 실행","definition":"CPU(씨피유)는 명령을 읽어 계산하고 다음 명령으로 진행하는 장치입니다. 코어는 명령 실행을 담당하는 처리 단위입니다.","mechanism":"명령은 메모리에서 가져오고 레지스터와 캐시 같은 빠른 저장 공간을 활용합니다. 코어 수가 많아도 순서 의존적인 작업은 모두 병렬화할 수 없습니다. 클럭만으로 전체 프로그램 속도를 비교할 수도 없습니다.","example":"10개 파일을 독립 처리하는 일과 이전 계산 결과가 필요한 10단계 계산은 병렬화 가능성이 다르다.","mistake":"CPU(씨피유) 사용률이 낮다고 서버가 한가한 것은 아닙니다. 디스크·DB(디비)·네트워크를 기다릴 수 있습니다.","question":"CPU(씨피유) 10%인데 API(에이피아이)가 느린 이유는 무엇일 수 있나요?","answer":"외부 API(에이피아이) 지연, DB(디비) 잠금, 연결 풀 대기 등 CPU(씨피유) 밖의 대기 시간을 확인해야 합니다.","id":"c01-s4","number":4,"chapter":1},{"title":"메모리·캐시·디스크","definition":"RAM(램)은 실행 중 데이터를 두는 작업 공간, 디스크는 장기 보관 공간입니다. 캐시는 자주 쓸 데이터를 더 빠른 위치에 보관합니다.","mechanism":"보통 레지스터·CPU(씨피유) 캐시·RAM(램)·디스크 순으로 접근 지연과 용량 특성이 달라집니다. RAM의 데이터는 전원이 꺼지면 일반적으로 사라집니다. 디스크에 기록했다고 해도 응용프로그램의 쓰기 완료와 실제 내구성 시점은 구분해야 합니다.","example":"책상 위 자료는 RAM(램), 서랍의 자료는 디스크라는 비유가 가능하다. 실제로는 OS(오에스) 캐시 때문에 디스크 읽기도 일부는 메모리에서 처리된다.","mistake":"RAM(램)을 늘리는 것과 디스크 용량을 늘리는 것은 다른 병목을 해결합니다.","question":"메모리가 부족하면 왜 갑자기 느려질 수 있나요?","answer":"OS(오에스)가 데이터를 디스크로 내보내는 swapping이나 잦은 page(페이지) fault(폴트)가 발생할 수 있습니다. 경우에 따라 OOM(오오엠)으로 프로세스가 종료됩니다.","id":"c01-s5","number":5,"chapter":1},{"title":"프로그램에서 서비스까지","definition":"프로그램은 명령과 데이터를 담은 파일이고 실행된 프로그램은 프로세스가 됩니다. 사용자의 요청을 기다리는 프로세스가 서버 역할을 할 수 있습니다.","mechanism":"운영체제는 프로세스에 CPU(씨피유)·메모리·파일·네트워크 기능을 제공합니다. 서비스 하나가 여러 프로세스로 구성될 수 있고 한 컴퓨터에 여러 서비스도 존재할 수 있습니다.","example":"브라우저가 요청을 보낸다 → 서버 프로세스가 DB(디비)에서 읽는다 → 응답을 보낸다. 서버는 특정 제품명보다 역할을 가리킨다.","mistake":"서버를 반드시 거대한 물리 장비라고 생각하면 로컬 개발·VM(브이엠)·컨테이너 개념을 혼동하기 쉽습니다.","question":"내 PC(피씨)에서 FastAPI(패스트에이피아이)를 실행하면 서버인가요?","answer":"요청을 받아 응답하는 역할을 하면 서버입니다. 인터넷 공개 여부와 서비스 역할은 별개입니다.","id":"c01-s6","number":6,"chapter":1}],"sources":[["Python: 부동소수점의 한계","https://docs.python.org/3/tutorial/floatingpoint.html"],["Unicode 표준 소개","https://www.unicode.org/standard/standard.html"]]},{"number":2,"title":"프로그래밍을 읽는 첫걸음","prerequisite":"1장: 값이 메모리에 놓인다는 관점.","intro":"기능을 고치기 전에 입력·출력과 실패 조건을 적으면 수정 범위를 좁힐 수 있습니다.","practice":"가격과 수량을 받아 합계를 반환하는 함수를 작성하세요. 정상 수량 3, 경계값 0, 문자열 입력을 각각 실행합니다.","done_when":"정상 입력은 계산 결과를 반환하고, 잘못된 입력은 정한 계약대로 거절합니다. 출력과 반환값의 차이를 설명할 수 있습니다.","example_title":"주문 합계를 계산하는 함수","trace":["가격 1,000과 수량 3을 입력으로 받습니다. 입력·처리·출력을 먼저 문장으로 정합니다.","수량이 0 이하라면 잘못된 입력으로 처리하고, 정상이라면 가격×수량을 계산합니다.","계산값 3,000을 return(리턴)하면 호출자가 받습니다. print(프린트)로 화면에 표시하는 것과 return으로 값을 돌려주는 것은 다릅니다."],"table":[["문법","역할","흔한 오해"],["=","이름을 값에 연결","동등성 비교가 아님"],["if","조건에 따라 분기","모든 분기를 실행하지 않음"],["return","함수 결과 반환","print와 다름"]],"lessons":[{"title":"변수·값·자료형","definition":"변수는 값이나 객체를 가리키는 이름입니다. 자료형은 그 값에 가능한 연산과 표현 규칙을 정합니다.","mechanism":"Python(파이썬)에서는 이름이 객체에 연결되고 객체가 타입을 갖습니다. 숫자 3과 문자열 '3'은 표현이 비슷해도 더하기와 비교 의미가 다릅니다. 외부 입력을 그대로 계산에 넣지 않고 형식과 범위를 검증합니다.","example":"age='20'을 문자열로 받았다면 숫자 계산 전 변환·검증이 필요하다. int(인트)('abc')는 변환에 실패한다.","mistake":"사용자 입력이 숫자처럼 보인다고 항상 유효한 숫자라는 보장은 없습니다.","question":"'2'+'3'과 2+3의 차이는?","answer":"앞은 문자열 연결로 '23', 뒤는 산술 덧셈으로 5입니다. 타입에 따라 같은 연산자의 의미가 달라집니다.","id":"c02-s1","number":1,"chapter":2},{"title":"가변 객체·참조·복사","definition":"가변 객체는 만들어진 뒤 내용을 바꿀 수 있는 객체입니다. Python(파이썬) list(리스트)와 dict(딕트)가 대표적이고 int(인트)·str(스트링)·tuple(튜플)은 불변입니다.","mechanism":"두 이름이 같은 객체를 가리킬 수 있습니다. 대입은 일반적으로 객체의 독립 복사를 만들지 않습니다. 얕은 복사는 바깥 컨테이너만 새로 만들고 내부 가변 객체는 공유할 수 있습니다.","example":"a=[1]; b=a; b.append(2) → a도 [1,2]. b=a.copy()라면 바깥 list(리스트)는 분리되지만 중첩 list까지 모두 독립적이지는 않다.","mistake":"tuple(튜플) 안에 list(리스트)가 있으면 tuple이 불변이어도 그 list 내용은 바뀔 수 있습니다.","question":"함수에 list(리스트)를 넘기고 append(어펜드)하면 호출한 쪽에도 보이나요?","answer":"같은 list(리스트) 객체를 전달했다면 보입니다. 새 객체를 만들지, 원본을 수정할지 함수 계약에 분명히 해야 합니다.","id":"c02-s2","number":2,"chapter":2},{"title":"조건문과 반복문","definition":"조건문은 값에 따라 실행 경로를 선택하고 반복문은 같은 처리 규칙을 여러 대상에 적용합니다. 알고리즘의 기본 재료입니다.","mechanism":"if(이프) 조건은 참·거짓으로 평가됩니다. for는 순회할 대상을, while(와일)은 계속 실행할 조건을 사용합니다. 반복 종료 조건과 빈 입력·오류 입력의 결과까지 생각해야 합니다.","example":"재고가 충분하면 출고한다. 다만 '확인 후 차감' 사이에 다른 요청이 들어올 수 있으므로 반복·조건 코드만으로 DB(디비) 동시성을 보장하지는 못한다.","mistake":"반복문이 있다는 이유만으로 느리다고 단정하지 않고 반복 횟수와 내부 작업 비용을 봅니다.","question":"while(와일) True(트루)가 반드시 잘못된 코드인가요?","answer":"아닙니다. 서버 루프처럼 필요한 경우도 있지만 종료·취소·대기 조건이 없으면 CPU(씨피유) 소모나 무한 대기가 생길 수 있습니다.","id":"c02-s3","number":3,"chapter":2},{"title":"함수·입력·반환·범위","definition":"함수는 이름 붙인 작업 단위이며 입력을 받아 결과를 돌려줄 수 있습니다. 작은 책임으로 나누면 이해·재사용·검증이 쉬워집니다.","mechanism":"return(리턴) 값과 출력(print(프린트))은 다릅니다. 지역 변수는 함수 실행 범위에 속하고 전역 상태는 여러 호출에 영향을 줍니다. 숨은 전역 변경이 많으면 호출 순서에 따라 결과가 달라질 수 있습니다.","example":"def add(a,b): return a+b 는 결과를 다른 계산에 쓸 수 있다. print(a+b)만 하면 화면 출력과 반환값을 혼동할 수 있다.","mistake":"함수를 많이 나누는 것 자체가 좋은 설계는 아닙니다. 의미 있는 책임과 입력·출력 계약이 중요합니다.","question":"테스트하기 쉬운 함수의 특징은?","answer":"입력과 출력이 분명하고 외부 상태 변경이 적습니다. 시간·DB(디비)·네트워크 의존성을 분리하면 결과를 통제하기 쉽습니다.","id":"c02-s4","number":4,"chapter":2},{"title":"예외와 자원 정리","definition":"예외는 정상 경로로 처리할 수 없는 상황을 알리는 메커니즘입니다. try/except는 오류를 처리하고 finally나 context(컨텍스트) manager는 정리를 돕습니다.","mechanism":"예외 종류를 좁혀 잡고 복구 가능한지 판단합니다. 오류를 무시하면 실패를 성공으로 오인할 수 있습니다. 파일·DB(디비) 연결은 성공과 실패 모두에서 닫아야 하며 로그에는 민감정보를 제외합니다.","example":"with(위드) open(path,encoding='utf-8') as f: ... 는 블록 종료 시 파일 정리를 돕는다. 존재하지 않는 파일은 적절한 예외로 처리한다.","mistake":"오류를 처리해 정상 응답을 보내는 경로와 실패를 호출자에게 알리는 경로를 구분합니다. 파일이나 DB(디비) 연결 정리도 두 경로에서 확인합니다.","question":"파일 읽기 오류와 사용자 입력 오류를 같은 500으로 처리해도 되나요?","answer":"실패 원인과 API(에이피아이) 계약에 따라 구분해야 합니다. 잘못된 요청은 4xx, 서버 내부 실패는 안전한 5xx 응답으로 처리할 수 있습니다.","id":"c02-s5","number":5,"chapter":2},{"title":"모듈·패키지·가상환경","definition":"모듈은 코드를 나눈 단위이고 패키지는 관련 모듈을 묶는 구조입니다. 가상환경은 프로젝트별 Python(파이썬) 의존성을 분리합니다.","mechanism":"같은 라이브러리도 버전에 따라 API(에이피아이)가 다릅니다. 의존성 목록과 잠금 정보로 재현성을 높이고, 패키지를 설치한 Python(파이썬)과 실행한 Python이 같은지 확인합니다. 가상환경은 OS(오에스) 전체를 가상화하는 VM(브이엠)이 아닙니다.","example":"프로젝트 A는 라이브러리 1.x, B는 2.x가 필요하면 별도 venv를 사용한다. python -m pip는 해당 Python의 pip를 쓰는 데 도움이 된다.","mistake":"내 PC(피씨)에서 import(임포트)된다는 사실만으로 다른 환경에서도 같은 버전·동작이 보장되지는 않습니다.","question":"ModuleNotFoundError가 설치 후에도 생기면?","answer":"실행 인터프리터 경로와 가상환경, 설치 대상, 모듈 이름과 import(임포트) 경로를 먼저 확인합니다.","id":"c02-s6","number":6,"chapter":2}],"sources":[["Python Tutorial","https://docs.python.org/3/tutorial/"],["Python: 예외 처리","https://docs.python.org/3/tutorial/errors.html"]]},{"number":3,"title":"Python(파이썬) 자료형과 객체지향","prerequisite":"2장: 변수·함수·반복.","intro":"정렬이 필요한 응답과 ID(아이디) 조회가 많은 로직은 필요한 연산이 다릅니다. 작업에 맞는 자료형을 고릅니다.","practice":"사용자별 주문 금액을 합산하고 최초 등장 순서대로 반환하세요. 빈 목록, 같은 사용자의 주문 두 건, 다른 사용자 한 건으로 확인합니다.","done_when":"사용자별 합계는 dict로 조회하고, 결과 순서가 어떤 규칙을 따르는지 예시로 보여줍니다.","example_title":"사용자별 주문 금액을 모으기","trace":["주문 순서는 list(리스트)에 저장하고 한 주문은 user_id와 amount를 가진 dict(딕트)로 표현할 수 있습니다.","사용자별 합계를 찾으려면 user_id를 key(키)로 하는 dict(딕트)에 누적하면 됩니다. 매번 전체 주문을 다시 찾을 필요를 줄입니다.","규칙이 복잡해지면 Order 객체나 서비스로 책임을 묶을 수 있습니다. 단순한 dict(딕트) 처리로 충분한 범위도 있습니다."],"table":[["자료형","주요 목적","주의"],["list","순서·중복을 유지","값 검색은 보통 선형"],["dict","키로 값 조회","키는 hashable이어야 함"],["set","중복 제거·포함 검사","순서를 계약으로 삼지 않음"],["tuple","고정된 순서의 묶음","내부 객체까지 불변은 아님"]],"lessons":[{"title":"Python(파이썬) list(리스트)·dict(딕트)·set(세트)·tuple(튜플)","definition":"list(리스트)는 순서가 있는 가변 시퀀스, dict(딕트)는 키와 값의 매핑, set(세트)은 중복 없는 원소 집합, tuple(튜플)은 불변 시퀀스입니다.","mechanism":"목적에 맞는 연산을 기준으로 고릅니다. list(리스트) 인덱스 접근은 빠르지만 값 탐색은 순회가 필요합니다. dict(딕트)와 set(세트)은 hash(해시)를 이용해 평균적으로 빠른 조회를 제공하며 추가 메모리를 사용합니다.","example":"사용자 ID(아이디)별 이름은 dict(딕트), 이미 처리한 ID는 set(세트), 순서대로 처리할 항목은 list(리스트)로 표현할 수 있다.","mistake":"JSON(제이슨) 응답에 정해진 순서가 필요하면 정렬 기준을 계약에 적습니다. set(세트)은 포함 여부를 찾는 데 쓰고 응답 순서는 명시적으로 구성합니다.","question":"중복 여부만 확인하는데 dict(딕트)가 꼭 필요한가요?","answer":"값을 연결할 필요가 없으면 set(세트)이 더 직접적인 표현입니다. 요구 연산과 데이터 의미를 기준으로 선택합니다.","id":"c03-s1","number":1,"chapter":3},{"title":"인자·기본값·가변 인자","definition":"인자는 함수에 전달하는 값이고 기본값은 생략했을 때 사용합니다. *args는 추가 위치 인자, **kwargs는 추가 이름 인자를 모읍니다.","mechanism":"Python(파이썬)의 기본 인자는 함수 정의 시 평가됩니다. list(리스트) 같은 가변 객체를 기본값으로 두면 여러 호출이 같은 객체를 공유할 수 있습니다. None(논)을 기본값으로 받고 함수 안에서 새 객체를 만들면 이를 피할 수 있습니다.","example":"def f(items=None):\\n    if items is None: items=[]\\n    return items","mistake":"기본값을 list(리스트)로 두면 여러 호출이 같은 객체를 쓸 수 있습니다. 연속 두 번 호출하는 테스트에서 첫 요청의 값이 두 번째 응답에 섞이는지 확인합니다.","question":"def(데프) f(x=[]): x.append(1)을 두 번 호출하면?","answer":"같은 기본 list(리스트)에 누적될 수 있습니다. '호출마다 초기화될 것'이라는 예상과 달라지는 대표적인 함정입니다.","id":"c03-s2","number":2,"chapter":3},{"title":"순회·컴프리헨션·제너레이터","definition":"컴프리헨션은 값을 간결하게 모으는 표현이고 제너레이터는 필요할 때 다음 값을 만들어 내는 객체입니다.","mechanism":"list(리스트) comprehension은 결과를 메모리에 만듭니다. generator는 지연 계산하므로 대량 데이터 처리의 메모리를 줄일 수 있지만 이미 소비한 값은 보통 다시 순회할 수 없습니다. 계산 자체의 총량이 자동으로 줄어드는 것은 아닙니다.","example":"[x*x for x in range(3)] → [0,1,4]. (x*x for x in range(3))는 값을 필요할 때 산출한다.","mistake":"generator를 만든 것과 전부 소비한 것은 다릅니다. 성능 측정 시 실제 작업이 실행됐는지 확인합니다.","question":"백만 줄 파일을 한 번에 list(리스트)로 읽지 않는 이유는?","answer":"메모리 부담을 줄이기 위해 줄 단위로 순회할 수 있습니다. 다만 뒤에서 임의 접근이 필요하면 별도 저장 구조가 필요합니다.","id":"c03-s3","number":3,"chapter":3},{"title":"클래스·객체·캡슐화","definition":"클래스는 상태와 동작을 정의하고 객체는 그 정의로 만든 개별 값입니다. 캡슐화는 관련 규칙을 한 경계 안에서 관리하는 설계입니다.","mechanism":"계좌 객체가 잔액 변경 메서드에서 규칙을 지키게 하면 여기저기서 잔액을 임의 변경하는 일을 줄일 수 있습니다. Python(파이썬)의 밑줄 이름은 주로 관례이며 보안 장벽은 아닙니다. 클래스가 있다고 자동으로 좋은 객체지향 설계가 되는 것은 아닙니다.","example":"Account.withdraw(amount)에서 양수 금액 검사와 잔액 규칙을 모은다. DB(디비) 동시 접근은 객체 메서드만으로 해결되지 않아 DB 제어도 필요하다.","mistake":"모든 함수를 클래스로 감싼다고 응집도가 좋아지지는 않습니다.","question":"객체 상태를 외부에서 직접 수정하면 어떤 문제가 있나요?","answer":"불변식을 우회하거나 변경 원인을 추적하기 어려워집니다. 상태 변경의 책임과 검증 지점을 명확히 해야 합니다.","id":"c03-s4","number":4,"chapter":3},{"title":"상속·구성·다형성","definition":"상속은 기존 타입의 관계와 동작을 확장하고 구성은 다른 객체를 내부에 넣어 기능을 조합합니다. 다형성은 같은 인터페이스로 여러 구현을 다루는 성질입니다.","mechanism":"DB(디비) 저장소와 메모리 저장소가 save라는 동일 계약을 제공하면 서비스가 구체 구현을 덜 알게 할 수 있습니다. Python(파이썬)에서는 duck(덕) typing이나 Protocol로 기대 계약을 표현할 수 있습니다. 상속이 깊어지면 부모 변경의 영향이 커집니다.","example":"ReportService가 Storage를 전달받으면 테스트에는 가짜 저장소를 넣을 수 있다. 서비스가 매번 특정 DB(디비) 연결을 직접 만들 필요가 줄어든다.","mistake":"코드 재사용만을 위해 의미가 맞지 않는 상속 관계를 만드는 것은 피합니다.","question":"구성을 선택할 만한 이유는?","answer":"기능을 독립적으로 교체하고 테스트하기 쉬울 수 있습니다. 대신 조합과 의존성 관리 코드가 생기는 비용을 고려합니다.","id":"c03-s5","number":5,"chapter":3},{"title":"메모리 관리와 GC(지씨)","definition":"Python(파이썬)은 객체 메모리를 자동으로 관리하지만 사용하지 않는다고 생각한 객체가 참조 때문에 남아 있을 수 있습니다. 일반 CPython은 참조 계수와 순환 참조 수집 등을 사용합니다.","mechanism":"전역 list(리스트)에 계속 추가하거나 캐시에 만료 없이 저장하면 살아 있는 참조가 남습니다. 파일·소켓 같은 외부 자원은 메모리 회수 시점에만 의존하지 않고 명시적으로 정리합니다. 메모리 사용 증가는 객체 수와 크기·수명을 나눠 조사합니다.","example":"요청 원문을 전역 로그 list(리스트)에 무한 append(어펜드)하면 GC(지씨)가 있어도 메모리가 증가한다. 객체가 여전히 사용 가능한 것으로 참조되기 때문이다.","mistake":"자동 GC(지씨)가 메모리 누수를 전부 방지한다는 생각은 잘못입니다.","question":"del(델) 이름을 실행하면 파일도 바로 닫히나요?","answer":"이름 제거와 외부 자원 정리를 동일시하지 않습니다. with(위드)나 close(클로즈) 등 명시적인 생명주기 관리가 필요합니다.","id":"c03-s6","number":6,"chapter":3}],"sources":[["Python: 자료구조","https://docs.python.org/3/tutorial/datastructures.html"],["Python: 클래스","https://docs.python.org/3/tutorial/classes.html"]]},{"number":4,"title":"Python(파이썬) 원리와 설계 심화","prerequisite":"2–3장: 참조·함수·클래스. async(에이싱크)는 7장과 13장을 읽고 다시 봐도 좋습니다.","intro":"리뷰에서 타입 검사와 런타임 검증을 구분합니다. 비동기 호출은 시작·완료·취소 시점을 함께 봅니다.","practice":"독립적인 두 비동기 작업에 각각 0.1초 대기를 두고, 순차 await와 동시 실행의 걸린 시간을 비교하세요.","done_when":"실행 시간이 다른 이유와 한 작업 실패 시 나머지 작업의 취소·결과 처리 방식을 설명합니다.","example_title":"await(어웨이트) 두 줄의 실행 순서","trace":["await(어웨이트) fetch_a()는 A의 완료를 기다립니다. 기다리는 동안 이벤트 루프가 다른 작업을 진행할 수 있다는 뜻입니다.","그 다음 await(어웨이트) fetch_b()가 있으면 현재 함수에서는 A 완료 후 B를 시작합니다. 두 줄이라는 이유로 A·B가 동시에 시작되지는 않습니다.","독립 작업을 Task(태스크)로 예약하면 함께 진행할 수 있습니다. 어느 하나 실패할 때 나머지를 취소할지, 결과를 일부 유지할지 정해야 합니다."],"table":[["구별","첫 번째","두 번째"],["== / is","값의 동등성","객체의 동일성"],["타입 힌트 / 검증","의도 표시·도구 분석","실제 입력 확인"],["코루틴 / Task","중단·재개 가능한 작업 객체","루프가 실행을 관리하는 단위"]],"lessons":[{"title":"동등성·동일성·해시 가능성","definition":"==는 값이 같은지, is(이즈)는 같은 객체인지 비교합니다. hashable(해시 가능한)은 객체 수명 동안 해시값이 안정적이고 동등성 비교와 일관되는 성질입니다.","mechanism":"dict(딕트)와 set(세트)은 해시를 이용해 찾을 위치를 좁힌 뒤 동등성을 확인합니다. 동등한 두 키는 같은 해시값을 가져야 하지만 해시값이 같다고 같은 키인 것은 아닙니다. 가변 list(리스트)는 키로 쓸 수 없고 tuple(튜플)도 내부 원소가 hashable(해시 가능한)이어야 키로 쓸 수 있습니다.","example":"a=[1]; b=[1]이면 a==b는 True(트루), a is(이즈) b는 False(폴스)다. None(논) 여부는 x is None으로 검사한다.","mistake":"문자열이나 작은 정수에서 우연히 is(이즈)가 True(트루)였던 결과를 값 비교 규칙으로 사용하지 않습니다.","question":"tuple(튜플) 안에 list(리스트)가 있으면 dict(딕트) 키로 쓸 수 있나요?","answer":"아니요. 해당 tuple(튜플)을 hash(해시)할 수 없습니다. tuple의 바깥 구조가 불변이라는 사실만으로 모든 내부 값이 hashable(해시 가능한)이 되지는 않습니다.","id":"c04-s1","number":1,"chapter":4},{"title":"클로저·데코레이터·함수 객체","definition":"Python(파이썬)에서는 함수를 변수에 담거나 다른 함수의 인자로 넘길 수 있습니다. 클로저는 함수가 바깥 범위의 변수를 참조하는 구조이고, 데코레이터는 함수를 받아 감싸거나 바꾸는 방식입니다.","mechanism":"@decorator(데코레이터)는 함수 정의 후 decorator(original_function)의 결과를 같은 이름에 연결하는 문법입니다. 로깅·권한 확인 같은 공통 동작을 감쌀 수 있지만 인자·반환값·예외를 제대로 전달해야 합니다. functools.wraps는 원래 이름·문서 등 메타데이터 보존을 돕습니다.","example":"def make_adder(n):\\n    def add(x):\\n        return x + n\\n    return add\\nadd3 = make_adder(3)\\nprint(add3(4))  # 7","mistake":"클로저가 모든 변수의 값을 생성 시점에 복사해 고정하는 것은 아닙니다. 반복문 변수 참조는 나중 값으로 평가되는 함정을 만들 수 있습니다.","question":"데코레이터가 원래 함수의 반환값을 return(리턴)하지 않으면?","answer":"호출자는 원래 결과 대신 None(논)을 받게 될 수 있습니다. 공통 기능을 추가하면서 함수 계약을 바꾸지 않았는지 확인해야 합니다.","id":"c04-s2","number":2,"chapter":4},{"title":"컨텍스트 매니저·with(위드)·자원 수명","definition":"파일·DB(디비) 연결·락처럼 사용 뒤 정리가 필요한 자원을 진입과 종료 규칙으로 감싸는 것이 컨텍스트 매니저입니다. with(위드)는 그 규칙을 실행하는 문법입니다.","mechanism":"__enter__가 자원 진입을, __exit__가 종료를 담당합니다. 블록 안에서 예외가 발생해도 일반적인 스택 해제 과정에서 종료 처리가 호출됩니다. __exit__의 반환값에 따라 예외를 억제할 수도 있으므로 모든 with(위드)가 자동 rollback(롤백)이나 예외 전파를 보장하는 것은 아닙니다.","example":"with open('sample.txt', encoding='utf-8') as f:\\n    text = f.read()\\n# 블록을 벗어나면 파일이 닫힘","mistake":"강제 프로세스 종료·전원 차단에서도 finally나 __exit__가 반드시 실행된다고 가정하면 안 됩니다.","question":"DB(디비)의 with(위드) 블록이면 항상 commit(커밋)되나요?","answer":"라이브러리와 객체의 컨텍스트 계약을 확인해야 합니다. 어떤 것은 트랜잭션을, 어떤 것은 연결 수명만 관리하며 동작이 다릅니다.","id":"c04-s3","number":3,"chapter":4},{"title":"타입 힌트·정적 검사·런타임 검증","definition":"타입 힌트는 개발자와 검사 도구에 의도한 값의 형태를 알려주는 표기입니다. 일반적인 Python(파이썬) 실행은 힌트만으로 잘못된 인자를 자동 차단하지 않습니다.","mechanism":"정적 검사는 실행 전에 코드의 타입 관계를 분석합니다. 런타임 검증은 실제 입력을 검사하며 Pydantic(파이단틱) 같은 도구가 담당할 수 있습니다. Any는 유연하지만 검사 범위를 줄이고 Optional(옵셔널)[T]는 T 또는 None(논)을 뜻하며 인자가 자동으로 생략 가능해진다는 뜻은 아닙니다.","example":"def double(x: int) -> int:\\n    return x * 2\\n# 검증 없이 double('a')를 실행하면 'aa'가 나올 수 있음","mistake":"API(에이피아이) 문서에 int(인트)라고 적혀 있다는 사실과 실제 요청을 검증했다는 사실을 구별합니다.","question":"타입 힌트가 있는데 입력 검증이 왜 필요하죠?","answer":"네트워크 입력은 신뢰할 수 없고 실행 시 실제 값이 들어오기 때문입니다. 형태·범위·업무 규칙 검증이 별도로 필요합니다.","id":"c04-s4","number":4,"chapter":4},{"title":"SOLID(솔리드)와 변경하기 쉬운 설계","definition":"SOLID(솔리드)는 변경 이유와 의존성을 관리하는 다섯 설계 원칙의 묶음입니다. SRP(에스알피)는 책임, OCP(오씨피)는 확장, LSP(엘에스피)는 대체 가능성, ISP(아이에스피)는 인터페이스 분리, DIP(디아이피)는 추상화에 대한 의존을 다룹니다.","mechanism":"예를 들어 보고서 서비스가 특정 클라우드 SDK(에스디케이)를 곳곳에서 호출하면 저장소 변경 영향이 커집니다. 필요한 put/get 계약을 정하고 구현을 주입하면 변경 범위를 줄일 수 있습니다. 그러나 구현이 하나이고 변경 가능성이 낮은 작은 코드에 추상화 계층을 많이 만들면 오히려 읽기 어려워집니다.","example":"저장소 실패를 재현할 때 실제 S3(에스쓰리) 대신 같은 계약의 테스트 대역을 넣는다. 이때 대역이 실제 실패 조건을 지나치게 단순화하지 않는지 본다.","mistake":"클래스를 많이 쪼개는 것 자체가 좋은 설계는 아닙니다. 한 변경이 어디까지 퍼지는지와 이해 비용을 봅니다.","question":"상속한 구현이 부모와 달리 평범한 입력에서 예외를 던지면?","answer":"호출자가 기대한 계약을 깨뜨릴 수 있습니다. LSP(엘에스피) 관점에서 대체 가능성을 재검토하고 인터페이스를 분리하거나 구성을 고려합니다.","id":"c04-s5","number":5,"chapter":4},{"title":"asyncio(에이싱키오) Task(태스크)·취소·구조화된 동시성","definition":"코루틴 함수 호출은 코루틴 객체를 만들며 그 자체로 끝까지 실행되는 것은 아닙니다. await(어웨이트)는 완료를 기다리고 Task(태스크)는 이벤트 루프가 코루틴 실행을 관리하도록 예약합니다.","mechanism":"await(어웨이트) a(); await b()는 보통 순차 대기입니다. 서로 독립인 비동기 작업은 TaskGroup(태스크그룹) 같은 구조로 함께 실행할 수 있습니다. 실패 시 남은 작업의 취소·정리와 timeout(타임아웃)을 설계해야 합니다. 취소는 협력적이므로 블로킹 함수가 오래 실행되면 즉시 반응하지 못할 수 있습니다.","example":"두 비동기 HTTP(에이치티티피) 요청을 동시에 기다리는 것과 CPU(씨피유) 계산 두 개를 코루틴으로 감싸는 것은 다르다. 후자는 이벤트 루프에서 CPU 병렬 실행이 되지 않는다.","mistake":"create_task만 해 놓고 결과·예외·수명을 관리하지 않으면 백그라운드 실패를 놓칠 수 있습니다.","question":"한 요청이 취소되었는데 외부 결제는 완료될 수 있나요?","answer":"가능합니다. 요청 취소가 이미 전달된 외부 부작용을 되돌리지는 않습니다. 실행 상태 확인과 멱등 키·보상 정책이 별도로 필요합니다.","id":"c04-s6","number":6,"chapter":4}],"sources":[["Python: 데이터 모델","https://docs.python.org/3/reference/datamodel.html"],["Python: asyncio Task","https://docs.python.org/3/library/asyncio-task.html"],["Python: typing","https://docs.python.org/3/library/typing.html"]]},{"number":5,"title":"자료구조와 복잡도","prerequisite":"3장: list(리스트)·dict(딕트)와 반복문.","intro":"느린 코드가 같은 데이터를 반복해서 찾는지 확인합니다. 처리량과 추가 메모리를 함께 비교합니다.","practice":"ID 목록에서 100개 항목의 포함 여부를 반복 확인하세요. list 조회와 set 생성 후 조회의 시간 및 준비 비용을 기록합니다.","done_when":"입력 크기와 조회 횟수를 함께 적고, 한 번만 조회할 때와 여러 번 조회할 때의 선택 기준을 말합니다.","example_title":"백만 개 ID(아이디)에서 하나 찾기","trace":["정렬되지 않은 list(리스트)는 앞에서부터 비교하므로 최악에는 거의 전부 확인합니다.","정렬돼 있으면 중간과 비교해 절반씩 버리는 이진 탐색을 할 수 있습니다. 대신 정렬·변경 관리 비용이 있습니다.","포함 여부를 반복해서 확인한다면 set(세트)이 유리할 수 있습니다. 준비 시간·메모리와 평균 조회 비용을 함께 판단합니다."],"table":[["복잡도","입력이 커질 때","예"],["O(1)","주된 작업 수가 일정","배열 위치 접근"],["O(log n)","절반씩 범위를 줄임","이진 탐색"],["O(n)","입력 전체를 한 번 봄","선형 탐색"],["O(n log n)","정렬에서 자주 등장","병합 정렬"],["O(n²)","모든 쌍을 비교","중첩 전체 순회"]],"lessons":[{"title":"시간·공간 복잡도","definition":"복잡도는 입력 크기가 늘 때 필요한 연산 수와 메모리가 어떻게 증가하는지 설명합니다. Big-O는 증가 양상의 상한을 표현하는 표기입니다.","mechanism":"O(1), O(log(로그) n), O(n), O(n log n), O(n²)을 비교하되 실제 속도는 상수·I/O·데이터 분포에도 달려 있습니다. 시간 절약을 위해 추가 메모리를 사용하는 선택도 있습니다. 입력이 작으면 단순한 구현이 더 나을 수 있습니다.","example":"모든 사용자 쌍을 비교하면 대략 n², 한 번 순회하면 n번이다. n이 10배가 되면 전자는 약 100배의 작업으로 커질 수 있다.","mistake":"정렬·인덱스 구축·set(세트) 생성 비용까지 포함해 비교합니다. 조회를 한 번 할 때와 같은 자료를 반복 조회할 때 유리한 선택이 다를 수 있습니다.","question":"이중 반복문이면 반드시 O(n²)인가요?","answer":"각 반복 횟수의 관계를 봐야 합니다. 안쪽 반복이 고정 길이인지, 전체에 걸쳐 합계 n번인지에 따라 달라집니다.","id":"c05-s1","number":1,"chapter":5},{"title":"선형 탐색과 이진 탐색","definition":"선형 탐색은 후보를 차례로 확인하고 이진 탐색은 정렬된 범위를 절반씩 줄입니다.","mechanism":"정렬된 배열에서는 중간값과 비교해 한쪽 절반을 제외할 수 있어 O(log(로그) n)에 탐색합니다. 하지만 정렬을 유지하는 비용과 접근 자료구조를 고려해야 합니다. 아무 순서 데이터에 이진 탐색을 적용하면 논리가 성립하지 않습니다.","example":"[2,5,8,11,17]에서 11을 찾을 때 중간 8보다 크므로 오른쪽 범위로 좁힌다.","mistake":"DB(디비)의 모든 인덱스가 단순한 이진 탐색 배열은 아닙니다. 저장·갱신 요구에 맞는 구조를 씁니다.","question":"한 번만 검색할 데이터도 먼저 정렬하는 게 유리한가요?","answer":"정렬 비용이 더 클 수 있습니다. 검색 횟수와 데이터 재사용 여부를 포함해 총비용을 비교합니다.","id":"c05-s2","number":2,"chapter":5},{"title":"정렬과 안정성","definition":"정렬은 비교 기준에 따라 항목 순서를 바꾸는 작업입니다. 안정 정렬은 같은 key(키)를 가진 항목의 기존 상대 순서를 유지합니다.","mechanism":"대표 비교 정렬의 시간복잡도와 추가 메모리 특성이 다릅니다. Python(파이썬) sorted는 새 list(리스트)를 만들고 list.sort는 원본 list를 변경합니다. key(키) 함수로 업무 기준을 분명히 정하며 동점 규칙도 필요할 수 있습니다.","example":"이름순으로 정렬한 뒤 점수순 안정 정렬을 하면 같은 점수 안에서 이름순이 유지된다.","mistake":"sort(소트) 반환값을 새 list(리스트)로 생각하면 안 됩니다. Python(파이썬) list.sort는 원본을 바꾸고 None(논)을 반환합니다.","question":"추천 순위에서 동점 기준을 정하는 이유는?","answer":"실행마다 결과 순서가 흔들리는 것을 줄이고 재현 가능한 검증을 하기 위해서입니다.","id":"c05-s3","number":3,"chapter":5},{"title":"스택·큐·힙","definition":"스택은 마지막 항목부터 꺼내는 LIFO(엘아이에프오), 큐는 먼저 들어온 항목부터 꺼내는 FIFO(에프아이에프오)입니다. 힙은 우선순위가 높은 원소를 효율적으로 꺼내는 구조입니다.","mechanism":"되돌리기와 DFS(디에프에스)에는 스택, 순서 처리와 BFS(비에프에스)에는 큐를 쓸 수 있습니다. Python(파이썬) list(리스트) 앞에서 pop하면 원소 이동 비용이 있으므로 큐에는 deque(데크)를 검토합니다. heap(힙) 전체가 완전히 정렬돼 있는 것은 아닙니다.","example":"우선순위 작업은 최소 힙에서 가장 작은 우선순위 값을 꺼내 처리할 수 있다. 일반 대기열과 처리 순서가 다르다.","mistake":"자료구조 큐와 서버 간 메시지 큐는 관련 개념이지만 내구성·분산 보장은 별도로 봐야 합니다.","question":"BFS(비에프에스)에서 스택을 쓰면 같은 탐색 순서인가요?","answer":"아닙니다. FIFO(에프아이에프오) 큐가 가까운 단계부터 확장하게 하며 스택은 한 경로를 먼저 깊게 탐색하게 합니다.","id":"c05-s4","number":4,"chapter":5},{"title":"해시 테이블과 충돌","definition":"해시는 입력을 정해진 규칙으로 숫자 등에 대응시키는 함수입니다. 해시 테이블은 그 결과를 이용해 저장 위치를 찾습니다.","mechanism":"서로 다른 키가 같은 해시 위치에 대응할 수 있어 충돌 처리가 필요합니다. 평균 조회가 빠르더라도 최악 조건과 재해싱 비용이 있습니다. Python(파이썬) dict(딕트)의 키는 hash(해시) 가능해야 하며 같은 것으로 비교되는 키는 hash 계약도 지켜야 합니다.","example":"사용자 ID(아이디)로 정보를 찾을 때 전체 사용자 list(리스트)를 순회하는 대신 dict(딕트)를 사용할 수 있다.","mistake":"일반 해시 테이블의 hash(해시)와 비밀번호 저장용 암호학적 해시는 목적과 요구 특성이 다릅니다.","question":"list(리스트)를 dict(딕트) key(키)로 쓸 수 있나요?","answer":"일반 list(리스트)는 가변이고 hash(해시) 불가능하므로 사용할 수 없습니다. 요구에 따라 불변 값의 tuple(튜플) 등 적합한 키를 만듭니다.","id":"c05-s5","number":5,"chapter":5},{"title":"트리·그래프·BFS(비에프에스)·DFS(디에프에스)","definition":"그래프는 정점과 연결 관계를 표현하고 트리는 순환 없이 연결된 특별한 그래프입니다. 조직·폴더·의존성·네트워크를 모델링할 수 있습니다.","mechanism":"BFS(비에프에스)는 가까운 단계부터, DFS(디에프에스)는 한 경로를 깊게 탐색합니다. 일반 그래프는 방문 집합이 없으면 순환을 계속 따라갈 수 있습니다. 가중치 없는 그래프에서 BFS는 최소 간선 수 경로를 찾는 데 쓰입니다.","example":"서비스 A→B→C→A 의존성이 있으면 방문 기록으로 재방문을 제어해야 한다.","mistake":"BFS(비에프에스)가 모든 가중치 그래프의 최단 거리를 찾는 것은 아닙니다. 비용이 다르면 Dijkstra(다익스트라) 등 조건에 맞는 알고리즘을 사용합니다.","question":"트리처럼 보이는 의존성에서 순환이 생기면?","answer":"방문 상태로 순환을 탐지하고 실행 순서를 정의할 수 있는지 확인합니다. 무조건 재귀 호출하면 종료되지 않을 수 있습니다.","id":"c05-s6","number":6,"chapter":5}],"sources":[["Python: collections","https://docs.python.org/3/library/collections.html"],["MIT 6.006: 알고리즘 강의","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-fall-2011/"]]},{"number":6,"title":"알고리즘을 선택하는 방법","prerequisite":"5장: 탐색·정렬·그래프·빅오.","intro":"알고리즘의 성능은 입력 조건에 따라 달라집니다. 정상 데이터와 경계값으로 전제를 확인합니다.","practice":"정렬된 이벤트 시각 목록에서 지정한 시간 구간을 찾으세요. 구간 경계와 같은 값, 빈 목록, 중복 시각을 추가해 비교합니다.","done_when":"반환 범위가 시작과 끝을 포함하는지 명시하고, 정렬되지 않은 입력을 어떻게 다룰지 결정합니다.","example_title":"중복된 ID(아이디)를 제거하는 두 방법","trace":["새 list(리스트)를 만들며 매번 기존 list에 있는지 찾으면 이미 쌓인 항목을 반복 탐색합니다. 크기가 커지면 비교가 많이 늘어납니다.","별도 set(세트)에 본 ID(아이디)를 기록하면 평균적인 포함 검사를 줄일 수 있습니다. 처음 나온 순서도 유지해야 한다면 결과 list(리스트)를 함께 씁니다.","중복 판단의 key(키)가 무엇인지 정해야 합니다. 대소문자·공백·복합 키 처리에 따라 결과가 달라집니다."],"table":[["기법","살펴볼 조건","대표 실패"],["이진 탐색","정렬·단조성","정렬 안 된 입력"],["슬라이딩 윈도","구간 상태 갱신 가능","음수 조건을 무시"],["그리디","국소 선택의 정당성","반례를 확인하지 않음"],["DP","상태·점화·중복 부분문제","상태 누락·상태 폭증"]],"lessons":[{"title":"배열·연결 리스트·동적 배열","definition":"배열은 위치로 원소를 찾기 좋은 구조이고 연결 리스트는 각 노드가 다음 노드의 위치를 가집니다. Python(파이썬) list(리스트)는 일반적으로 객체 참조를 담는 동적 배열로 구현됩니다.","mechanism":"배열의 중간 삽입은 뒤 원소를 옮겨야 해 O(n)일 수 있습니다. 연결 리스트는 삽입 위치의 노드를 이미 알면 연결 변경이 O(1)이지만 그 노드를 찾는 데 O(n)이 걸릴 수 있습니다. 동적 배열은 여유 공간이 부족할 때 더 큰 저장 공간을 확보하고 복사합니다.","example":"Python(파이썬) list(리스트)의 append(어펜드)는 평균적인 누적 비용을 기준으로 분할 상환 O(1)이다. 매번 반드시 같은 시간으로 끝난다는 뜻은 아니다.","mistake":"연결 리스트의 삽입이 항상 배열보다 빠르다는 주장은 탐색과 메모리 지역성 비용을 빼먹습니다.","question":"list(리스트)에서 맨 앞 요소를 계속 제거하면 왜 비효율적인가요?","answer":"남은 원소를 이동하는 비용이 반복됩니다. 양 끝 삽입·삭제가 목적이면 deque(데크)가 적합할 수 있습니다.","id":"c06-s1","number":1,"chapter":6},{"title":"재귀·호출 스택·기저 조건","definition":"재귀는 함수가 자기 자신을 호출해 더 작은 문제를 푸는 방식입니다. 멈추는 조건을 기저 조건이라고 하며 호출마다 실행 중 정보가 스택에 쌓입니다.","mechanism":"문제 크기가 줄어들고 기저 조건에 도달해야 종료됩니다. 피보나치를 단순 재귀로 계산하면 같은 부분문제를 반복해 호출 수가 급증합니다. Python(파이썬)은 재귀 깊이 제한이 있고 일반적인 꼬리 재귀 최적화를 기대하면 안 됩니다.","example":"factorial(3)은 3×factorial(2), 다시 2×factorial(1)로 내려간 후 값을 돌려준다. 큰 깊이는 반복문이나 명시적 스택을 고려한다.","mistake":"코드가 짧다는 이유로 재귀의 시간·메모리 비용이 작다고 판단하지 않습니다.","question":"그래프 DFS(디에프에스)에서 방문 표시가 없으면?","answer":"순환 경로를 다시 따라가 무한 반복하거나 불필요한 중복 탐색이 생길 수 있습니다. 방문 시점을 설계해야 합니다.","id":"c06-s2","number":2,"chapter":6},{"title":"투 포인터·슬라이딩 윈도","definition":"투 포인터는 두 위치를 움직여 탐색 범위를 관리하고 슬라이딩 윈도는 연속 구간의 상태를 갱신하는 기법입니다.","mechanism":"길이 k인 구간 합을 매번 k개 더하면 O(nk)이지만 한 칸 이동할 때 빠진 값은 빼고 들어온 값은 더하면 O(n)으로 계산할 수 있습니다. 가변 길이 윈도는 조건이 포인터 이동에 따라 어떻게 변하는지 알아야 하며 음수가 섞이면 단순한 합 증가·감소 가정이 깨질 수 있습니다.","example":"[2,1,3,4]에서 길이 2 합은 3에서 2를 빼고 3을 더해 4, 다시 1을 빼고 4를 더해 7이 된다.","mistake":"두 포인터를 쓴다는 형태만 외우면 정렬·단조성 같은 적용 조건을 놓칩니다.","question":"부분합 제한 문제에서 양수 조건이 왜 중요한가요?","answer":"오른쪽을 늘리면 합이 커지고 왼쪽을 줄이면 작아지는 성질을 이용하기 때문입니다. 음수가 있으면 다른 접근이 필요할 수 있습니다.","id":"c06-s3","number":3,"chapter":6},{"title":"그리디·동적 계획법·메모이제이션","definition":"그리디는 당장 좋은 선택을 하고, 동적 계획법은 작은 문제의 결과를 저장해 큰 문제를 구성합니다. 메모이제이션은 이미 구한 결과를 기억하는 방식입니다.","mechanism":"그리디는 지역 선택이 최적해로 이어지는 근거가 필요합니다. DP(디피)는 상태가 무엇인지, 이전 상태에서 어떻게 계산하는지, 초기값과 계산 순서를 정의합니다. 저장 공간을 줄일 때는 이후 계산이 어떤 이전 상태를 필요로 하는지 확인합니다.","example":"동전 [1,3,4]로 6을 만들 때 큰 동전부터 고르면 4+1+1 세 개지만 3+3 두 개가 최적이다. 모든 동전 체계에 그리디가 맞지는 않는다.","mistake":"캐시를 붙였다는 이유만으로 상태 정의나 알고리즘이 올바르게 되지는 않습니다.","question":"DP(디피)에서 상태를 너무 자세히 만들면?","answer":"상태 수가 폭증해 시간·메모리가 부족해질 수 있습니다. 미래 판단에 필요한 최소 정보로 상태를 정의해야 합니다.","id":"c06-s4","number":4,"chapter":6},{"title":"최단 경로·가중치·위상 정렬","definition":"가중치는 간선 이동 비용입니다. 위상 정렬은 순환이 없는 방향 그래프에서 선행 작업이 먼저 오도록 노드를 정렬합니다.","mechanism":"모든 간선 비용이 같으면 BFS(비에프에스)로 최소 간선 수를 찾습니다. 음수 가중치가 없는 일반적인 최단 경로에는 Dijkstra(다익스트라)를 사용할 수 있습니다. 위상 정렬에서 선행 조건이 없는 노드를 계속 제거할 수 없고 노드가 남으면 순환 의존이 있을 수 있습니다.","example":"문서 업로드→추출→임베딩→색인의 의존성은 DAG(디에이지)로 표현할 수 있다. Agent(에이전트)의 재검토 루프는 의도적으로 순환하므로 DAG라고 부르면 안 된다.","mistake":"BFS(비에프에스)가 모든 가중 그래프에서 최소 비용 경로를 구하는 것은 아닙니다.","question":"작업 A가 B를 기다리고 B가 A를 기다리면?","answer":"선행 관계에 순환이 있어 작업 순서를 만들 수 없습니다. 의존성을 바꾸거나 반복 작업의 종료 조건을 별도 모델링해야 합니다.","id":"c06-s5","number":5,"chapter":6},{"title":"복잡도를 실제 성능으로 연결하기","definition":"빅오는 입력이 커질 때 비용이 늘어나는 양상을 나타냅니다. 실제 응답 시간에는 상수·메모리 접근·직렬화·네트워크·디스크 비용도 들어갑니다.","mechanism":"n이 작으면 단순 O(n) 코드가 준비 비용이 큰 구조보다 빠를 수 있습니다. DB(디비) 호출을 반복하는 O(n) 루프는 매번 네트워크 왕복이 있어 느립니다. 먼저 대표 입력으로 병목을 측정하고, 변경 전후 같은 조건에서 시간·메모리와 결과 동일성을 비교합니다.","example":"10만 건의 ID(아이디) 포함 여부를 매번 list(리스트)에서 찾으면 중첩 탐색이 된다. set(세트)을 한 번 만들고 조회하면 평균 탐색 비용을 줄일 수 있지만 메모리가 추가로 필요하다.","mistake":"입력 크기, 반복 횟수, 준비 단계, 실제 처리 단계의 시간을 따로 기록합니다. 네트워크 왕복이 병목이면 함수의 복잡도를 줄여도 전체 지연이 그대로일 수 있습니다.","question":"성능 비교에서 한 번만 실행하면 무엇이 문제인가요?","answer":"캐시·초기화·환경 잡음에 좌우될 수 있습니다. 반복, warm-up(웜업), 입력 분포와 분산을 함께 기록해야 합니다.","id":"c06-s6","number":6,"chapter":6}],"sources":[["MIT 6.006: 알고리즘 강의","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-fall-2011/"],["Python: bisect","https://docs.python.org/3/library/bisect.html"]]},{"number":7,"title":"운영체제: 실행과 자원 관리","prerequisite":"1장: CPU(씨피유)·메모리, 2장: 프로그램.","intro":"워커를 늘리면 요청이 여러 프로세스에 분산됩니다. 메모리에만 저장한 상태가 어떤 요청에서 보이는지 확인합니다.","practice":"서로 다른 두 Python 프로세스에 메모리 카운터를 둔다고 가정하세요. 같은 사용자의 요청이 번갈아 도착할 때 두 카운터 값을 표로 추적합니다.","done_when":"프로세스마다 값이 따로 증가함을 설명하고, 공통 상태가 필요한 경우 저장할 위치와 원자적 갱신 방법을 제안합니다.","example_title":"요청 두 개를 처리하는 서버","trace":["요청 A가 DB(디비) 응답을 기다리는 동안 CPU(씨피유)가 할 일이 없다면 요청 B의 처리를 진행할 수 있습니다. 이것이 I/O 동시성의 이점입니다.","두 요청이 같은 변수를 읽고 바꾸면 경쟁이 생깁니다. 병렬 실행이 아니어도 중간에 실행 순서가 바뀌면 문제가 생길 수 있습니다.","프로세스를 두 개로 늘리면 일반적인 메모리 변수는 공유되지 않습니다. 공통 상태는 DB(디비) 등 별도 수단으로 조정해야 합니다."],"table":[["개념","뜻","구별할 점"],["프로세스","실행 중인 프로그램의 자원 경계","별도 주소 공간"],["스레드","프로세스 안의 실행 흐름","같은 자원을 공유"],["동시성","여러 일이 겹쳐 진행","코어 하나도 가능"],["병렬성","같은 순간에 실행","여러 실행 자원 필요"]],"lessons":[{"title":"커널·사용자 모드·시스템 콜","definition":"운영체제의 핵심인 커널은 하드웨어와 자원을 관리합니다. 일반 프로그램은 제한된 사용자 모드에서 실행되며 시스템 콜로 커널 기능을 요청합니다.","mechanism":"파일 읽기, 소켓 통신, 프로세스 생성은 OS(오에스)의 도움이 필요합니다. 권한 경계를 두면 앱 하나가 다른 앱이나 하드웨어를 마음대로 제어하기 어렵습니다. 실패 코드는 권한·자원 부족·경로 문제 등을 알립니다.","example":"Python(파이썬) open()을 통해 파일을 읽는 동작은 런타임을 거쳐 OS(오에스)의 파일 기능과 연결된다.","mistake":"Python(파이썬) 함수 한 번과 시스템 콜 한 번이 항상 일대일은 아닙니다. 버퍼링과 런타임 처리가 개입할 수 있습니다.","question":"파일이 존재하는데 Permission(퍼미션) denied라면?","answer":"프로세스 사용자와 경로의 권한, 상위 디렉터리 탐색 권한 등을 확인합니다. 존재 여부와 접근 권한은 다릅니다.","id":"c07-s1","number":1,"chapter":7},{"title":"프로세스와 스레드","definition":"프로세스는 독립된 실행·자원 관리 단위이고 스레드는 프로세스 안의 실행 흐름입니다. 같은 프로세스의 스레드는 메모리 일부를 공유합니다.","mechanism":"공유 메모리는 데이터 전달을 쉽게 하지만 경쟁 조건을 만듭니다. 프로세스는 더 강한 주소 공간 분리를 제공하나 통신·생성 비용이 있습니다. 스레드도 자신의 실행 상태와 스택이 필요합니다.","example":"웹 서버가 worker(워커) 프로세스 4개를 쓰면 전역 Python(파이썬) dict(딕트)가 자동으로 네 worker에 공유되지는 않는다.","mistake":"여러 프로세스가 같은 서버에서 돌아가도 메모리 변수는 각각 따로 유지됩니다. 요청 상태나 세션이 공통으로 보여야 하면 저장 위치를 확인합니다.","question":"전역 변수로 로그인 세션을 저장하면 다중 worker(워커)에서 문제인가요?","answer":"요청이 다른 worker(워커)로 가면 그 값을 못 볼 수 있습니다. 필요하면 공유 저장소나 다른 세션 설계를 사용합니다.","id":"c07-s2","number":2,"chapter":7},{"title":"스케줄링·동시성·병렬성","definition":"동시성은 여러 작업을 진행 중인 상태로 관리하는 능력이고 병렬성은 같은 시점에 실제로 여러 작업을 수행하는 것입니다.","mechanism":"한 코어도 작업을 번갈아 실행해 동시성을 만들 수 있습니다. OS(오에스)는 실행할 스레드를 선택하고 문맥을 바꾸며 이 전환에도 비용이 있습니다. 실행 가능한 작업이 너무 많으면 전환·경합 비용이 커질 수 있습니다.","example":"식당 직원 한 명이 물 끓는 동안 주문을 받는 것은 동시성, 직원 두 명이 동시에 요리하는 것은 병렬성의 비유다.","mistake":"동시 요청 수를 늘리면 처리량이 무한히 오르는 것은 아닙니다.","question":"thread(스레드)를 1,000개 만들면 왜 느려질 수 있나요?","answer":"스케줄링·메모리·락 경합과 외부 서비스 과부하가 증가할 수 있습니다. 병목에 맞춘 상한이 필요합니다.","id":"c07-s3","number":3,"chapter":7},{"title":"가상 메모리·페이지·page(페이지) fault(폴트)","definition":"프로세스는 자신의 가상 주소 공간을 사용하고 OS(오에스)와 하드웨어가 이를 물리 메모리에 매핑합니다. 고정 크기 단위를 페이지라고 합니다.","mechanism":"필요한 매핑이나 페이지가 준비되지 않으면 page(페이지) fault(폴트)가 발생해 OS(오에스)가 처리합니다. 항상 디스크 읽기나 오류를 뜻하는 것은 아닙니다. 주소 공간 격리는 프로세스가 서로의 메모리를 직접 훼손하지 않도록 돕습니다.","example":"큰 파일을 매핑해도 실제 사용한 부분 위주로 물리 메모리를 준비할 수 있다. 가상 크기와 실제 상주 메모리는 다를 수 있다.","mistake":"프로세스의 가상 메모리 수치를 실제 RAM(램) 사용과 동일하게 보면 안 됩니다.","question":"page(페이지) fault(폴트)가 많으면 모두 장애인가요?","answer":"정상적인 demand(디맨드) paging에서도 생깁니다. 디스크 I/O가 필요한 fault(폴트)와 지연·메모리 압박을 함께 봐야 합니다.","id":"c07-s4","number":4,"chapter":7},{"title":"경쟁 조건·락·교착","definition":"경쟁 조건은 실행 순서에 따라 결과가 달라지는 상황입니다. 락은 공유 자원의 접근을 조정하지만 잘못 사용하면 서로 기다리는 교착이 생깁니다.","mechanism":"읽기→검사→쓰기는 중간에 다른 작업이 개입할 수 있습니다. 임계 구역을 좁히고 여러 락의 획득 순서를 통일하면 위험을 줄일 수 있습니다. DB(디비) 잠금과 프로세스 내부 락은 적용 범위가 다릅니다.","example":"A는 자원1을 잡고 2를 기다리며 B는 2를 잡고 1을 기다리면 진행하지 못한다.","mistake":"Python(파이썬) GIL(지아이엘)이 업무의 여러 단계 연산을 원자적으로 만들어 주는 것은 아닙니다.","question":"여러 서버의 중복 출금을 Python(파이썬) Lock으로 막을 수 있나요?","answer":"한 프로세스 안의 락만으로 다른 서버를 제어하지 못합니다. DB(디비)의 원자적 갱신·제약·트랜잭션 등을 사용해야 합니다.","id":"c07-s5","number":5,"chapter":7},{"title":"I/O 대기·async(에이싱크)·GIL(지아이엘)","definition":"I/O는 파일·네트워크·장치와 데이터를 주고받는 일입니다. async(에이싱크)는 이런 대기 중 다른 작업에 실행 기회를 주도록 구성하는 방식입니다.","mechanism":"비동기 함수 안에서 오래 걸리는 동기 호출을 하면 event(이벤트) loop가 멈출 수 있습니다. 일반적인 GIL(지아이엘) 활성 CPython은 Python(파이썬) bytecode의 스레드 병렬 실행을 제한하지만 I/O나 native(네이티브) 연산은 다릅니다. 선택적 free-threaded(프리 스레디드) 빌드도 있어 실제 런타임을 확인합니다.","example":"외부 API(에이피아이) 응답 대기를 비동기 클라이언트로 await(어웨이트)하면 그동안 다른 coroutine이 진행할 수 있다.","mistake":"async(에이싱크)가 CPU(씨피유) 계산을 자동으로 다른 코어에서 실행하는 것은 아닙니다.","question":"CPU(씨피유) 중심 Python(파이썬) 작업에는 무엇을 검토하나요?","answer":"멀티프로세스·native(네이티브) 연산·별도 worker(워커)를 검토하고 데이터 전달 비용까지 측정합니다. 작업 특성에 따라 선택이 달라집니다.","id":"c07-s6","number":6,"chapter":7}],"sources":[["OSTEP: 저자 공개 교재","https://pages.cs.wisc.edu/~remzi/OSTEP/"],["Python: free-threading","https://docs.python.org/3/howto/free-threading-python.html"]]},{"number":8,"title":"운영체제 심화: 메모리·락·파일","prerequisite":"7장: 프로세스·가상 메모리·경쟁 조건.","intro":"CPU(씨피유) 수치만으로 장애를 설명하기 어려울 때는 메모리 한도, 락 대기, 열린 파일 수를 따로 확인합니다.","practice":"두 요청이 카운터 0을 동시에 읽고 각각 1을 쓰는 순서를 그리세요. 읽기와 쓰기 사이에 다른 요청이 끼는 경우를 표시합니다.","done_when":"결과가 2 대신 1이 되는 이유와 프로세스 내부 락, DB 원자적 UPDATE의 적용 범위를 구분합니다.","example_title":"데이터가 깨지는 카운터","trace":["값이 0일 때 A와 B가 각각 0을 읽습니다. 둘 다 1을 계산해 저장하면 두 번 증가했지만 결과는 1일 수 있습니다.","읽기·계산·저장을 하나의 보호 범위로 묶어야 합니다. 마지막 저장 한 줄만 잠그면 둘이 이미 같은 값을 읽은 문제를 막지 못할 수 있습니다.","여러 프로세스나 서버에서는 같은 메모리 락이 공유되지 않습니다. 실제 데이터가 있는 공통 경계에서 원자성을 제공해야 합니다."],"table":[["증상","확인할 자원","가능한 원인"],["OOM 종료","메모리·컨테이너 한도","모델·캐시·동시 요청 증가"],["Too many open files","파일 디스크립터","파일·소켓 정리 누락"],["락 대기","보유자·대기 순서","긴 트랜잭션·교착"],["디스크 공간 유지","열린 삭제 파일","로그 프로세스가 계속 참조"]],"lessons":[{"title":"문맥 교환·인터럽트·스케줄러","definition":"문맥 교환은 실행하던 작업의 레지스터 등 상태를 저장하고 다른 작업의 상태를 복원하는 과정입니다. 인터럽트는 장치나 타이머 등이 CPU(씨피유)에 처리가 필요함을 알리는 방식입니다.","mechanism":"OS(오에스)는 실행 가능한 작업 중 하나를 선택합니다. I/O 대기 작업을 계속 CPU(씨피유)에서 기다리게 하기보다 다른 작업을 실행합니다. 전환 자체에도 비용이 있고 캐시·주소 변환 정보의 효율이 나빠질 수 있습니다. 스레드를 과도하게 늘리면 처리보다 전환 비용이 커질 수 있습니다.","example":"코어 하나에서도 브라우저·편집기·서버가 번갈아 실행되며 동시에 진행되는 것처럼 보일 수 있다.","mistake":"동시성이 있다는 사실이 같은 순간 여러 코어에서 실행되는 병렬성을 뜻하지 않습니다.","question":"CPU(씨피유) 사용률이 높은데 스레드를 더 늘려도 빨라지지 않는다면?","answer":"CPU(씨피유) 병목, GIL(지아이엘) 여부, 락 경합, 문맥 교환과 작업 크기를 확인합니다. 스레드 수가 처리량과 비례한다는 가정을 버립니다.","id":"c08-s1","number":1,"chapter":8},{"title":"페이지 테이블·TLB(티엘비)·메모리 부족","definition":"페이지 테이블은 가상 주소를 물리 메모리 위치와 연결합니다. TLB(티엘비)는 최근 주소 변환 결과를 저장하는 CPU(씨피유) 측 캐시입니다.","mechanism":"주소 변환 정보가 TLB(티엘비)에 없으면 페이지 테이블을 확인할 수 있습니다. page(페이지) fault(폴트)는 필요한 페이지가 현재 접근 가능하지 않을 때 OS(오에스) 개입이 필요한 사건이며 모두 디스크 읽기를 뜻하지는 않습니다. 실제 메모리보다 작업 집합이 너무 크면 잦은 페이지 이동으로 처리량이 떨어지는 thrashing이 생길 수 있습니다.","example":"프로세스가 큰 주소 공간을 가졌다는 사실과 그만큼 실제 RAM(램)을 사용하는 것은 다르다. 가상 크기·상주 메모리·컨테이너 한도를 구분한다.","mistake":"메모리 부족을 디스크 여유 공간 부족과 혼동하면 안 됩니다.","question":"컨테이너가 갑자기 종료되고 OOMKilled라면?","answer":"메모리 한도와 사용 추이, 모델 로드·동시 요청·캐시 증가를 봅니다. 단순 재시작 외에 동시성 제한과 메모리 사용을 줄여야 합니다.","id":"c08-s2","number":2,"chapter":8},{"title":"뮤텍스·세마포어·조건 변수","definition":"뮤텍스는 임계 구역에 한 작업만 들어오게 하고, 세마포어는 제한된 수의 이용권처럼 동시 진입 수를 관리합니다. 조건 변수는 어떤 상태가 될 때까지 기다리는 수단입니다.","mechanism":"공유 상태를 읽고 바꾸는 복합 연산을 보호합니다. 조건 변수에서 깨어났다고 조건이 항상 참은 아니므로 보통 락을 잡은 상태에서 조건을 반복 확인합니다. 락 범위를 너무 넓히면 병렬성이 낮아지고 너무 좁히면 불일치가 생깁니다.","example":"외부 API(에이피아이)에 동시에 5건까지만 요청하려면 세마포어를 사용할 수 있다. 같은 계좌 잔액의 읽기·차감에는 데이터 경계에 맞는 원자성 제어가 필요하다.","mistake":"프로세스의 락으로는 다른 프로세스나 서버의 요청을 제어할 수 없습니다. 여러 인스턴스가 같은 재고를 바꾼다면 DB(디비) 제약과 조건부 갱신을 확인합니다.","question":"DB(디비) 행 잠금 대신 앱의 threading.Lock만 써도 될까요?","answer":"단일 프로세스 안의 작업만 조정합니다. 여러 worker(워커)·서버가 접근하면 DB(디비) 조건부 갱신·행 잠금 등 공유 경계의 제어가 필요합니다.","id":"c08-s3","number":3,"chapter":8},{"title":"교착·기아·livelock(라이브락)","definition":"교착은 서로 가진 자원을 기다려 진행하지 못하는 상태, 기아는 특정 작업이 계속 기회를 못 받는 상태입니다. livelock(라이브락)은 반응은 계속하지만 유효한 진전이 없는 상태입니다.","mechanism":"교착에는 상호 배제·점유 대기·비선점·순환 대기 조건이 관련됩니다. 모든 작업이 자원을 같은 순서로 획득하도록 하면 순환 대기를 줄일 수 있습니다. DB(디비)가 교착을 탐지해 한 트랜잭션을 취소하더라도 앱은 재시도 범위와 횟수를 관리해야 합니다.","example":"A가 계좌1을 잠그고 계좌2를, B가 계좌2를 잠그고 계좌1을 기다리면 교착할 수 있다. 계좌 ID(아이디) 오름차순으로 잠금을 잡는 규칙을 고려한다.","mistake":"timeout(타임아웃)을 넣었다고 근본 원인이 사라지는 것은 아닙니다. 실패는 줄일 수 있어도 반복될 수 있습니다.","question":"재시도 두 작업이 계속 동시에 충돌하면?","answer":"무작위 지연과 backoff(백오프), 잠금 순서, 작업 분할과 재시도 한도를 검토합니다.","id":"c08-s4","number":4,"chapter":8},{"title":"파일 시스템·inode(아이노드)·파일 디스크립터","definition":"파일 시스템은 디스크의 데이터를 이름·디렉터리·메타데이터로 관리합니다. Linux(리눅스)의 inode(아이노드)는 파일 메타데이터와 데이터 위치 정보를, 파일 디스크립터는 프로세스가 연 열린 자원의 번호를 나타냅니다.","mechanism":"파일 이름은 디렉터리에서 inode(아이노드)로 연결됩니다. 같은 inode를 가리키는 hard(하드) link가 있을 수 있고 심볼릭 링크는 경로를 가리킵니다. 프로세스가 연 파일을 삭제해도 열린 참조가 남아 있으면 공간이 바로 반환되지 않을 수 있습니다. 소켓도 파일 디스크립터를 사용합니다.","example":"로그를 삭제했는데 디스크 사용량이 그대로라면 프로세스가 그 파일을 계속 열고 쓰는지 확인할 필요가 있다.","mistake":"파일 디스크립터 누수는 RAM(램)이 충분해도 Too(투) many(매니) open files(파일스) 오류를 만들 수 있습니다.","question":"API(에이피아이) 요청마다 연결을 열고 닫지 않으면?","answer":"파일 디스크립터와 연결 자원이 누적될 수 있습니다. 자원 수명을 명확히 하고 연결 풀·정상 종료·예외 정리를 확인합니다.","id":"c08-s5","number":5,"chapter":8},{"title":"버퍼·페이지 캐시·fsync(에프싱크)·내구성","definition":"버퍼는 데이터를 잠시 모으는 공간이고 페이지 캐시는 OS(오에스)가 파일 데이터를 메모리에 보관해 반복 접근을 줄이는 구조입니다. 쓰기 호출 성공이 곧 모든 물리 저장 장치에 영구 반영되었다는 뜻은 아닙니다.","mechanism":"프로그램 버퍼→OS(오에스) 캐시→장치로 데이터가 이동할 수 있습니다. fsync(에프싱크) 등은 영속 반영을 요청하지만 실제 보장은 파일 시스템·장치·설정의 영향을 받습니다. DB(디비)는 WAL(더블유에이엘)과 동기화 규칙으로 crash(크래시) 후 복구를 설계합니다.","example":"파일에 쓴 뒤 read가 성공해도 같은 캐시에서 읽었을 수 있다. 전원 장애 후 복구 보장을 확인하려면 별도 내구성 계약이 필요하다.","mistake":"flush와 fsync(에프싱크)를 항상 같은 의미로 사용하지 않습니다. 사용자 공간 버퍼 정리와 장치 반영은 다른 단계입니다.","question":"왜 DB(디비) commit(커밋)과 단순 파일 write(라이트)를 같게 보면 안 되나요?","answer":"DB(디비)는 트랜잭션 로그·복구·격리 등 추가 계약을 제공합니다. 파일 쓰기 몇 번만으로 여러 변경의 원자성과 복구가 자동 보장되지 않습니다.","id":"c08-s6","number":6,"chapter":8}],"sources":[["Linux man-pages: 개요","https://man7.org/linux/man-pages/man7/intro.7.html"],["Linux: fsync","https://man7.org/linux/man-pages/man2/fsync.2.html"],["OSTEP: 동시성·영속성","https://pages.cs.wisc.edu/~remzi/OSTEP/"]]},{"number":9,"title":"Linux(리눅스)를 읽고 진단하기","prerequisite":"7장: 프로세스·파일. 명령어는 Linux(리눅스) 기준이며 Windows PowerShell과 다를 수 있습니다.","intro":"서비스가 시작되지 않으면 작업 경로, 실행 계정, 첫 오류 로그부터 확인합니다.","practice":"로컬 실습에서 설정 파일 경로를 일부러 잘못 지정하고 실행하세요. 작업 경로와 오류 로그에서 어떤 파일을 찾았는지 확인합니다.","done_when":"명령을 실행한 디렉터리와 앱이 기대한 경로를 비교하고, 설정 비밀값을 남기지 않고 문제를 재현합니다.","example_title":"앱이 시작하자마자 종료될 때","trace":["현재 작업 경로와 설정 파일 위치를 확인합니다. IDE(아이디이)에서 사용한 상대 경로가 서비스 실행 위치에서는 다를 수 있습니다.","프로세스의 종료 코드와 오류 로그를 읽습니다. 권한 부족, 모듈 누락, 포트 충돌 등 첫 실패 원인을 구분합니다.","환경변수가 주입됐는지는 비밀값을 출력하지 않는 방식으로 확인합니다. 재시작만 반복하면 최초 오류 단서를 놓칠 수 있습니다."],"table":[["명령","알 수 있는 것","해석"],["pwd / ls","현재 위치·파일 목록","실행 위치 확인"],["ps / top","프로세스·자원 사용","CPU·메모리 관찰"],["ss -lnt","TCP 수신 포트","어디에서 듣는지"],["df / du","파일 시스템 여유·경로 크기","둘의 대상 차이"],["rg","텍스트 검색","로그·코드에서 근거 찾기"]],"lessons":[{"title":"경로·파일·디렉터리","definition":"절대 경로는 시작 위치와 무관한 전체 위치, 상대 경로는 현재 작업 위치 기준의 위치입니다. Linux(리눅스)의 파일 트리는 /에서 시작합니다.","mechanism":"프로그램이 실행되는 작업 디렉터리와 코드 파일 위치는 다를 수 있습니다. 컨테이너·서비스 실행 환경에서 상대 경로가 달라 파일을 못 찾기도 합니다. 심볼릭 링크는 다른 경로를 가리킬 수 있습니다.","example":"pwd로 현재 위치, ls로 항목을 확인한다. ./data는 현재 디렉터리 아래의 data를 뜻한다.","mistake":"상대 경로는 실행 작업 디렉터리를 기준으로 해석합니다. 앱을 IDE(아이디이)와 서비스 환경에서 각각 실행해 실제로 열린 파일의 경로를 비교합니다.","question":"파일이 있는데 FileNotFoundError가 나면?","answer":"실제 실행 위치와 해석된 절대 경로, 파일명 대소문자·마운트 여부를 확인합니다.","id":"c09-s1","number":1,"chapter":9},{"title":"사용자·권한·rwx","definition":"Linux(리눅스) 파일 권한은 소유자·그룹·기타 사용자에 대해 읽기 r, 쓰기 w, 실행 x를 구분합니다. 디렉터리의 x는 경로를 통과하는 탐색 의미를 갖습니다.","mechanism":"서비스 프로세스는 특정 사용자로 실행되며 그 권한으로 파일에 접근합니다. chmod 777로 모두 열기보다 필요한 사용자와 경로 권한을 정합니다. 실행 파일 권한과 파일 내용의 유효성도 별개입니다.","example":"640은 소유자 읽기·쓰기, 그룹 읽기, 기타 권한 없음이다. 실제 서비스 계정이 어느 그룹인지 확인한다.","mistake":"권한 오류를 해결하려고 모든 서비스를 root로 실행하는 습관은 피합니다.","question":"파일은 읽을 수 있는데 상위 폴더를 못 지나가면?","answer":"경로 탐색 권한 때문에 접근이 실패할 수 있습니다. 대상 파일뿐 아니라 상위 디렉터리 권한도 확인합니다.","id":"c09-s2","number":2,"chapter":9},{"title":"프로세스·PID(피아이디)·종료 신호","definition":"PID(피아이디)는 실행 중 프로세스를 식별하는 번호입니다. 종료 신호는 프로세스에 종료나 다른 동작을 요청하는 OS(오에스) 메커니즘입니다.","mechanism":"SIGTERM(에스아이지티이알엠)은 정상 종료 처리를 할 기회를 줄 수 있고 SIGKILL(에스아이지케이아이엘엘)은 강제 종료합니다. 서버는 요청 정리·DB(디비) 연결 닫기·작업 상태 저장 시간을 고려해야 합니다. 무조건 강제 종료하면 처리 결과가 불명확해질 수 있습니다.","example":"ps로 프로세스를 확인하고 로그를 본다. 종료가 필요하면 대상과 영향부터 확인한다. 여기의 명령 예시는 진단 개념이며 자동 실행하지 않는다.","mistake":"프로세스 재시작은 원인 해결과 같지 않습니다. 반복 재시작은 로그 증거를 잃게 할 수도 있습니다.","question":"배포 중 요청이 끊기지 않게 하려면?","answer":"새 요청 유입을 줄이고 진행 중 요청을 마친 뒤 종료하는 graceful shutdown과 적절한 유예 시간을 설정합니다.","id":"c09-s3","number":3,"chapter":9},{"title":"표준 입출력·파이프·검색","definition":"프로그램의 표준 입력·출력·오류는 데이터를 주고받는 공통 통로입니다. 파이프는 한 명령의 출력을 다음 명령의 입력으로 연결합니다.","mechanism":"출력과 오류를 구분하면 로그 수집·자동화가 쉬워집니다. rg는 파일의 텍스트를 검색하는 도구입니다. 비밀이 담긴 파일이나 로그를 통째로 출력하지 않고 필요한 범위만 봅니다.","example":"rg -n 'ERROR(이알알오알)' app.log 는 일치 행과 줄 번호를 찾는다. 로그에는 토큰·개인정보가 있을 수 있어 공유 전에 범위를 제한한다.","mistake":"명령 출력이 없다는 것만으로 성공이라 판단하지 말고 종료 코드와 예상 결과를 확인합니다.","question":"stdout과 stderr를 구분하는 이유는?","answer":"데이터 결과와 진단 메시지를 별도로 전달하고 자동화에서 파싱·알림을 안정적으로 처리하기 위해서입니다.","id":"c09-s4","number":4,"chapter":9},{"title":"서버 진단 명령 읽기","definition":"진단은 CPU(씨피유)·메모리·디스크·프로세스·포트를 나눠 확인하는 작업입니다. 한 가지 지표만으로 원인을 확정하지 않습니다.","mechanism":"top은 실행·자원 상태, free는 메모리, df는 파일시스템 여유, ss는 소켓, curl은 HTTP(에이치티티피) 응답 확인에 활용합니다. 도구가 설치돼 있는지와 권한·OS(오에스) 차이를 고려합니다. 변경보다 관찰을 먼저 합니다.","example":"ss -lntp: TCP listen 상태 확인. curl -I https://example.com: HTTP 응답 헤더 확인. Linux 기준 예시다.","mistake":"df 여유가 충분해도 inode(아이노드) 부족이나 사용자 quota 때문에 쓰기가 실패할 수 있습니다.","question":"CPU(씨피유) 정상인데 요청이 멈추면 다음 확인은?","answer":"DB(디비)·외부 호출 지연, 연결 풀·잠금·디스크 I/O·네트워크 상태를 확인하고 요청 단계별 시간을 봅니다.","id":"c09-s5","number":5,"chapter":9},{"title":"환경변수·설정·로그","definition":"설정은 배포 환경별로 달라지는 값이며 코드와 분리하면 같은 코드를 여러 환경에 배포하기 쉽습니다. 환경변수는 설정 전달 방식 중 하나입니다.","mechanism":"설정을 프로세스가 언제 읽는지, 변경 후 재시작이 필요한지 확인합니다. 환경변수도 로그·프로세스 노출 등 위험이 있어 비밀 관리의 완전한 해결책은 아닙니다. 로그에는 요청 ID(아이디)와 안전한 진단 정보를 남깁니다.","example":"개발과 운영 DB(디비) 주소를 설정으로 나누되 실제 자격증명은 문서·소스·이미지에 넣지 않는다.","mistake":"환경변수가 있는지는 비밀값 자체를 출력하지 않고 확인합니다. 빌드 산출물, 로그, 오류 응답에도 비밀값이 남는 경로를 점검합니다.","question":"운영에서만 잘못된 DB(디비)로 연결되면?","answer":"설정 우선순위와 실행 프로세스가 실제 읽은 환경을 비밀값을 노출하지 않는 방식으로 확인합니다.","id":"c09-s6","number":6,"chapter":9}],"sources":[["GNU Bash 매뉴얼","https://www.gnu.org/software/bash/manual/bash.html"],["Linux: signal","https://man7.org/linux/man-pages/man7/signal.7.html"]]},{"number":10,"title":"네트워크의 기초","prerequisite":"1장: 정보의 전송, 7장: 프로세스.","intro":"접속 주소는 호출하는 위치에서 해석합니다. 노트북에서 보이는 localhost(로컬호스트)와 컨테이너에서 보이는 localhost가 각각 무엇인지 확인합니다.","practice":"브라우저, API 컨테이너, DB 컨테이너를 그리세요. 브라우저→API와 API→DB에 넣을 주소와 포트를 따로 적습니다.","done_when":"호스트에 게시한 포트와 컨테이너 내부 포트, 수신 주소와 연결 대상 주소를 정확히 구분합니다.","example_title":"주소와 포트를 분리해서 읽기","trace":["http://localhost:8080에서 localhost(로컬호스트)는 현재 접속을 시도하는 환경 자신을 뜻하고 8080은 접속 대상 포트입니다.","컨테이너 안에서 localhost(로컬호스트)라고 하면 그 컨테이너 자신입니다. 노트북 호스트와 다른 컨테이너는 각각 다른 관점입니다.","0.0.0.0은 서버가 모든 IPv4(아이피브이포) 인터페이스에서 듣는 bind(바인드) 설정에 씁니다. 클라이언트의 실제 DB(디비) 목적지 주소로 대체하는 값이 아닙니다."],"table":[["표현","뜻","예"],["도메인","서비스의 이름","api.example.com"],["IP","네트워크 주소","127.0.0.1은 loopback"],["포트","통신 지점 구별","HTTP 서비스의 8080"],["bind","서버 수신 주소 설정","0.0.0.0:8000"]],"lessons":[{"title":"네트워크 계층과 패킷","definition":"네트워크는 데이터를 작은 단위로 나눠 여러 장치를 거쳐 전달합니다. 계층은 각 단계의 책임을 구분해 이해하는 방법입니다.","mechanism":"앱의 HTTP(에이치티티피) 메시지는 전송 계층·IP(아이피)·링크 계층 등의 정보를 붙여 이동합니다. 각 계층의 주소와 오류 의미가 다릅니다. DNS(디엔에스) 실패, TCP(티씨피) 실패, HTTP 500을 구분하면 진단 범위를 좁힐 수 있습니다.","example":"편지 내용은 앱 데이터, 봉투의 목적지와 배송 경로는 네트워크 정보라는 비유가 가능하다. 실제 패킷에는 각 단계의 헤더가 붙는다.","mistake":"OSI(오에스아이) 7계층 이름 암기만으로 장애를 해결하지 못합니다. 각 계층에서 무엇을 확인할지 연결해야 합니다.","question":"HTTP(에이치티티피) 403을 받았다면 서버에 전혀 도달하지 못한 것인가요?","answer":"적어도 HTTP(에이치티티피) 응답을 만든 서버·프록시까지 도달한 것입니다. 정책·인증·리소스 권한 등 응답을 만든 계층을 조사합니다.","id":"c10-s1","number":1,"chapter":10},{"title":"IP(아이피)·서브넷·CIDR(씨아이디알)·NAT(엔에이티)","definition":"IP(아이피)는 네트워크 인터페이스의 주소이고 서브넷은 주소 대역을 나누는 단위입니다. CIDR(씨아이디알)은 주소 뒤 /숫자로 네트워크 prefix 길이를 표시합니다.","mechanism":"IPv4(아이피브이포) /24는 주소 32bit 중 앞 24bit가 prefix여서 전체 주소 공간은 256개입니다. 사용 가능한 수는 네트워크·플랫폼의 예약 정책에 따라 다릅니다. NAT(엔에이티)는 통신 경계에서 주소나 포트를 변환합니다.","example":"192.168.1.10/24와 192.168.1.20/24는 같은 prefix에 속한다. 인터넷 경로와 실제 통신 허용 여부는 라우팅·방화벽을 추가 확인한다.","mistake":"사설 IP(아이피)는 외부 인터넷에서 그대로 직접 라우팅되는 공인 주소와 다릅니다.","question":"/24에서 항상 서버 254대를 쓸 수 있나요?","answer":"클라우드 등에서 추가 예약 주소가 있어 다를 수 있습니다. 주소 총수와 플랫폼의 실제 사용 가능 주소 수를 구분합니다.","id":"c10-s2","number":2,"chapter":10},{"title":"포트·소켓·bind(바인드)·localhost(로컬호스트)","definition":"포트는 한 통신 대상에서 서비스를 구분하는 번호입니다. 소켓은 앱이 네트워크 통신에 사용하는 끝점이며 bind(바인드)는 수신할 주소·포트를 지정합니다.","mechanism":"127.0.0.1은 현재 환경의 loopback(루프백)이고 0.0.0.0 bind(바인드)는 모든 IPv4(아이피브이포) 인터페이스에서 받겠다는 뜻입니다. 컨테이너별 localhost(로컬호스트)는 서로 다를 수 있습니다. 클라이언트 목적지는 실제 IP(아이피)나 DNS(디엔에스) 이름을 사용합니다.","example":"앱이 127.0.0.1:8000만 듣는다면 외부 인터페이스의 8000 요청을 받지 못할 수 있다.","mistake":"0.0.0.0은 서버가 어떤 주소에서 들을지 정하는 값입니다. 호출 쪽에는 호출 위치에서 접근 가능한 호스트 이름과 포트를 사용합니다.","question":"같은 서버 IP(아이피)에서 웹과 DB(디비)를 구분하는 방법은?","answer":"TCP/UDP 프로토콜과 포트 등을 사용합니다. 각 프로세스가 해당 주소·포트에 수신하고 보안 규칙도 허용해야 합니다.","id":"c10-s3","number":3,"chapter":10},{"title":"DNS(디엔에스)와 캐시","definition":"DNS(디엔에스)는 도메인에 대응하는 레코드를 조회하는 분산 시스템입니다. A는 IPv4(아이피브이포), AAAA(에이에이에이에이)는 IPv6(아이피브이식스), CNAME(씨엔에이엠이)은 다른 이름을 가리킵니다.","mechanism":"resolver가 캐시나 권한 서버에서 응답을 구합니다. TTL(티티엘) 동안 캐시가 남아 주소 변경 전후에 서로 다른 결과를 볼 수 있습니다. DNS(디엔에스)는 일반적으로 사용자를 다른 웹페이지로 이동시키는 HTTP(에이치티티피) 리다이렉트와 다릅니다.","example":"api.example.com → A 레코드 → 서버 주소 → 해당 포트 연결 순으로 진행한다. 이름 해석이 성공해도 서버 응답은 실패할 수 있다.","mistake":"DNS(디엔에스)를 도메인을 IP(아이피)로만 바꾸는 단일 서버라고 이해하면 다른 레코드와 캐시를 놓칩니다.","question":"도메인 변경 후 일부 사용자만 옛 서버에 접속하면?","answer":"DNS(디엔에스) 캐시·TTL(티티엘)·resolver 차이를 확인합니다. 브라우저·OS(오에스)·네트워크 장비의 캐시도 영향을 줄 수 있습니다.","id":"c10-s4","number":4,"chapter":10},{"title":"TCP(티씨피)·UDP(유디피)와 신뢰성","definition":"TCP(티씨피)는 연결과 순서 있는 바이트 스트림을 제공하고 재전송·흐름·혼잡 제어를 수행합니다. UDP(유디피)는 데이터그램을 보내며 자체적으로 전달·순서를 보장하지 않습니다.","mechanism":"TCP(티씨피)는 연결이 끝내 실패할 수 있어 업무 처리 성공까지 보장하지 않습니다. UDP(유디피) 위에서도 상위 프로토콜이 재전송과 암호화를 구현할 수 있습니다. HTTP/3의 QUIC(큐유아이씨)이 UDP를 사용한다는 점도 '웹은 항상 TCP'라는 설명의 예외입니다.","example":"영상·게임·웹 등에서 필요한 지연·손실 대응 특성을 비교한다. 프로토콜 하나만으로 사용자 경험이 결정되지는 않는다.","mistake":"TCP(티씨피)의 신뢰성과 결제·저장의 중복 방지 보장을 동일하게 보면 안 됩니다.","question":"TCP(티씨피) 요청 후 timeout(타임아웃)이면 서버 작업은 취소됐나요?","answer":"응답만 유실됐을 수 있으므로 알 수 없습니다. 요청 ID(아이디)·상태 조회·멱등성으로 결과 불명 상태를 다뤄야 합니다.","id":"c10-s5","number":5,"chapter":10},{"title":"라우팅·방화벽·로드밸런서","definition":"라우팅은 다음 전달 경로를 고르고 방화벽은 흐름을 허용·차단합니다. 로드밸런서는 요청을 여러 처리 대상으로 분배합니다.","mechanism":"주소가 맞아도 경로·방화벽·서버 상태 중 하나가 틀리면 접속이 실패합니다. L4(엘4)는 주로 전송 계층 정보, L7(엘7)은 HTTP(에이치티티피) 경로·host(호스트) 같은 앱 정보를 활용합니다. 대상 준비 상태와 종료 시 드레이닝도 중요합니다.","example":"DNS(디엔에스) → LB(엘비) → 앱 서버 → DB(디비)의 각 경계에서 연결과 응답을 확인한다. LB가 살아 있어도 대상이 모두 비정상이면 실패할 수 있다.","mistake":"로드밸런서와 서버 수 자동 확장은 같은 기능이 아닙니다.","question":"connection(커넥션) refused와 timeout(타임아웃)은 어떤 단서인가요?","answer":"refused는 수신 프로세스 부재·적극 거부 가능성, timeout(타임아웃)은 차단·응답 손실·과부하 등을 의심합니다. 단서이지 단일 원인 확정은 아닙니다.","id":"c10-s6","number":6,"chapter":10}],"sources":[["IETF: TCP 표준 RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["IETF: DNS RFC 1034","https://www.rfc-editor.org/rfc/rfc1034"]]},{"number":11,"title":"네트워크 심화와 장애 구분","prerequisite":"10장: DNS(디엔에스)·TCP(티씨피)·포트. HTTP(에이치티티피) 용어는 12장과 함께 봅니다.","intro":"같은 접속 실패라도 DNS(디엔에스), TCP(티씨피), TLS(티엘에스), HTTP(에이치티티피) 중 실패한 위치에 따라 첫 조사 대상이 달라집니다.","practice":"이름 해석 실패, connection refused, 인증서 오류, HTTP 502를 각각 받고 어디까지 도달했는지 표시하세요.","done_when":"오류마다 먼저 점검할 계층을 하나씩 제시합니다. 응답을 만든 서버와 최종 애플리케이션이 다를 수 있다는 점을 설명합니다.","example_title":"같은 접속 실패, 다른 원인","trace":["이름 조회 실패라면 DNS(디엔에스) 레코드와 리졸버를 봅니다. IP(아이피)로 접근하면 된다는 단서는 이름 계층을 좁히지만 HTTPS(에이치티티피에스) 이름 검증은 따로 고려합니다.","연결 거절이라면 서버 프로세스·수신 주소·포트를 확인합니다. timeout(타임아웃)은 네트워크 차단·경로·지연 등 후보가 더 넓습니다.","HTTP(에이치티티피) 500이 왔다면 HTTP 응답이 전달된 것입니다. 앱·프록시·upstream(업스트림) 로그를 요청 ID(아이디)와 시간으로 연결해 봅니다."],"table":[["단계","예시 증상","먼저 볼 것"],["DNS","이름 해석 실패","레코드·캐시·리졸버"],["TCP","거절·timeout","listener·라우팅·방화벽"],["TLS","인증서 오류","이름·유효기간·신뢰"],["HTTP","4xx·5xx","요청 계약·서버 로그"]],"lessons":[{"title":"TCP(티씨피) 연결·종료·TIME_WAIT","definition":"TCP(티씨피)는 통신 상대와 연결 상태를 유지합니다. 일반적인 연결 설정은 SYN(에스와이엔), SYN-ACK(에스와이엔-에이씨케이), ACK(에이씨케이) 단계로 양쪽의 시작 순서 번호와 통신 상태를 맞춥니다.","mechanism":"TCP(티씨피)는 순서 번호와 ACK(에이씨케이), 재전송으로 바이트 스트림의 신뢰성을 제공합니다. 정상 종료는 양방향 송신 종료가 별도로 진행될 수 있으며 TIME_WAIT은 이전 연결의 지연 패킷과 종료 처리를 다루기 위해 일정 시간 상태를 유지하는 과정입니다.","example":"HTTP(에이치티티피) 요청마다 새 TCP(티씨피) 연결을 만들면 연결 설정 비용과 포트·상태 부담이 생길 수 있다. 연결 재사용은 이를 줄인다.","mistake":"TCP(티씨피) 연결 성공이 HTTP(에이치티티피) 처리·DB(디비) 저장 성공을 의미하지는 않습니다.","question":"서버에 접속은 되는데 응답만 늦다면?","answer":"DNS(디엔에스)·연결 단계와 HTTP(에이치티티피) 처리 단계를 분리해 측정합니다. 이미 연결됐다면 앱·DB(디비)·외부 API(에이피아이) 대기 등을 확인해야 합니다.","id":"c11-s1","number":1,"chapter":11},{"title":"흐름 제어·혼잡 제어·재전송","definition":"흐름 제어는 수신자가 받아낼 수 있는 양을 넘지 않도록 하고 혼잡 제어는 네트워크 전체의 혼잡을 고려해 전송량을 조절합니다.","mechanism":"수신 윈도는 상대의 여유 버퍼와 관련되고 혼잡 윈도는 경로 상태에 대한 송신 측 판단과 관련됩니다. 손실이 생기면 재전송과 전송량 조절로 처리량이 낮아질 수 있습니다. 대역폭이 커도 왕복 지연과 손실 때문에 실제 속도가 낮을 수 있습니다.","example":"먼 서버로 작은 요청을 여러 번 순차 전송하면 각 왕복 지연이 누적된다. 데이터를 한 번에 묶거나 연결을 재사용하는 방식의 효과를 측정한다.","mistake":"네트워크 속도를 대역폭 숫자 하나로 설명하지 않습니다. latency(레이턴시)·loss·throughput(스루풋)을 나눠 봅니다.","question":"지연이 100ms인 API(에이피아이)를 10번 순차 호출하면?","answer":"서버 계산 시간 외에도 대략 10번의 대기 비용이 누적됩니다. 독립 호출 병렬화·배치·캐시를 검토하되 부하와 제한도 고려합니다.","id":"c11-s2","number":2,"chapter":11},{"title":"DNS(디엔에스) 재귀·권한 서버·레코드","definition":"재귀 리졸버는 클라이언트 대신 이름을 조회하고 권한 서버는 특정 도메인 영역의 공식 레코드를 제공합니다. A는 IPv4(아이피브이포), AAAA(에이에이에이에이)는 IPv6(아이피브이식스), CNAME(씨엔에이엠이)은 다른 이름을 가리키는 레코드입니다.","mechanism":"캐시에 없으면 루트·최상위 도메인·권한 서버를 따라 필요한 정보를 찾을 수 있습니다. TTL(티티엘) 동안 기존 값이 캐시에 남을 수 있고 실패 응답도 캐시될 수 있습니다. DNS(디엔에스)는 주로 UDP(유디피)를 쓰지만 응답 크기·전송 조건에 따라 TCP(티씨피) 등도 사용합니다.","example":"도메인을 새 서버로 옮겼는데 일부 사용자만 옛 서버에 가면 각 리졸버의 캐시와 TTL(티티엘), A·AAAA(에이에이에이에이) 설정을 확인한다.","mistake":"DNS(디엔에스)를 바꾸면 전 세계가 즉시 같은 새 주소를 사용한다는 가정은 잘못입니다.","question":"A는 맞는데 일부 접속이 실패한다면?","answer":"AAAA(에이에이에이에이)가 다른 경로를 가리키는지, 클라이언트의 IPv6(아이피브이식스) 연결·캐시·리졸버 차이가 있는지 확인할 수 있습니다.","id":"c11-s3","number":3,"chapter":11},{"title":"Origin(오리진)·Site(사이트)·프록시 신뢰 경계","definition":"Origin(오리진)은 scheme(스킴)·host(호스트)·port(포트) 조합입니다. Site(사이트)는 쿠키 정책에서 등록 가능한 도메인과 scheme 등을 기준으로 판단하며 origin과 같지 않습니다.","mechanism":"프런트와 API(에이피아이)의 포트만 달라도 cross-origin일 수 있습니다. 리버스 프록시는 클라이언트 요청을 앱에 전달하고 TLS(티엘에스)를 종료하기도 합니다. X-Forwarded-For 같은 헤더를 무조건 믿으면 사용자가 위조한 주소를 신뢰하게 되므로 신뢰할 프록시 경계를 설정해야 합니다.","example":"https://app.example.com과 https://api.example.com은 다른 origin이다. 같은 사이트로 취급될 수 있어도 CORS와 쿠키 정책은 각각 확인한다.","mistake":"same-site(세임사이트)라는 이유만으로 same-origin인 것은 아니며 CORS(코어스) 설정이 사용자 인가를 대신하지도 않습니다.","question":"로그의 사용자 IP(아이피)가 모두 프록시 주소라면?","answer":"프록시 전달 설정과 앱의 신뢰 프록시 설정을 함께 봅니다. 단순히 임의 헤더를 원래 IP(아이피)로 인정하지 않습니다.","id":"c11-s4","number":4,"chapter":11},{"title":"SSE(에스에스이)·WebSocket(웹소켓)·폴링","definition":"폴링은 클라이언트가 반복 조회하는 방식, SSE(에스에스이)는 서버에서 클라이언트로 이벤트를 연속 전달하는 HTTP(에이치티티피) 기반 방식, WebSocket(웹소켓)은 양방향 메시지 통신을 위한 프로토콜입니다.","mechanism":"작업 진행률·LLM(엘엘엠) 토큰 출력처럼 서버→클라이언트 전달이 주면 SSE(에스에스이)가 적합할 수 있습니다. 양방향 실시간 대화가 핵심이면 WebSocket(웹소켓)을 검토합니다. 연결 끊김·재연결·인증·메시지 중복·프록시 버퍼링·유휴 timeout(타임아웃)까지 설계해야 합니다.","example":"OCR(오씨알) 작업 생성 후 job_id를 받고 SSE(에스에스이)로 상태를 듣다가 끊기면 상태 조회 API(에이피아이)로 현재 결과를 확인한다.","mistake":"스트리밍 화면에 문자가 나타난다는 사실이 최종 작업 commit(커밋)이나 전체 성공을 뜻하지 않습니다.","question":"SSE(에스에스이) 연결이 끊기면 서버 작업도 반드시 멈추나요?","answer":"구현에 따라 다릅니다. 작업 수명을 연결과 분리했는지, 취소 신호를 전달하는지 확인해야 합니다.","id":"c11-s5","number":5,"chapter":11},{"title":"오류 위치를 구분하는 네트워크 진단","definition":"이름 조회·연결·TLS(티엘에스)·HTTP(에이치티티피)·애플리케이션은 서로 다른 실패 단계입니다. 오류 메시지를 단계와 연결하면 조사 범위를 줄일 수 있습니다.","mechanism":"이름 해석 실패는 DNS(디엔에스), connection(커넥션) refused는 해당 주소·포트의 listener나 명시적 거부, timeout(타임아웃)은 경로·방화벽·상대 지연 등 여러 가능성을 봅니다. TLS(티엘에스) 오류는 인증서·이름·시간·신뢰 체인을 봅니다. HTTP(에이치티티피) 500이 왔다면 어떤 HTTP 서버까지는 도달한 것입니다.","example":"브라우저에 CORS(코어스) 오류가 있으면 개발자 도구에서 실제 응답·preflight(프리플라이트)를 확인한다. curl도 연결되지 않는다면 CORS부터 바꾸는 접근은 근거가 약하다.","mistake":"같은 타임아웃이라도 연결 전인지 응답을 기다리던 중인지 확인합니다. 로드밸런서가 502를 반환했다면 최종 앱에 도달했는지도 로그로 확인합니다.","question":"502와 504는 무엇을 먼저 확인하나요?","answer":"프록시가 upstream(업스트림)에서 받은 응답 문제인지 기다리다 timeout(타임아웃)했는지 보고, 앱 생존·접속 주소·포트·응답 시간·프록시 로그를 대조합니다.","id":"c11-s6","number":6,"chapter":11}],"sources":[["IETF: TCP RFC 9293","https://www.rfc-editor.org/rfc/rfc9293"],["MDN: Server-sent events","https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events"],["MDN: Same-origin policy","https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy"]]},{"number":12,"title":"HTTP(에이치티티피)와 브라우저의 동작","prerequisite":"10장: 주소·포트·TCP.","intro":"프런트와 백엔드가 협업할 때는 요청 형태, 정상 응답, 실패 시 행동을 함께 합의합니다.","practice":"상품 상세 요청에 성공, 미로그인, 접근 불가, 없는 상품의 네 경우를 넣어 상태 코드와 응답 본문을 작성하세요.","done_when":"클라이언트가 오류에 맞춰 로그인 안내, 권한 안내, 없는 상품 표시를 각각 할 수 있습니다.","example_title":"상품 하나를 조회할 때","trace":["브라우저가 GET(겟) /products/7을 보냅니다. 서버는 메서드와 경로로 처리 함수를 찾습니다.","성공하면 200과 상품 JSON(제이슨)을 반환하고, 없으면 404 등 약속한 오류를 반환합니다. HTTP(에이치티티피) 상태와 JSON 안의 업무 상태를 일관되게 설계합니다.","캐시 정책이 있으면 같은 내용을 서버에서 매번 전부 가져오지 않을 수 있습니다. 개인화·민감 데이터는 공유 캐시에 잘못 들어가지 않도록 구분합니다."],"table":[["코드 범위","뜻","대표 예"],["2xx","성공","200 조회·201 생성"],["3xx","재지정·캐시 검증 등","304 조건부 조회"],["4xx","요청·권한 등 문제","400·401·403·404·409"],["5xx","서버 측 처리 문제","500·502·503·504"]],"lessons":[{"title":"URL(유알엘)·HTTP(에이치티티피) 요청과 응답","definition":"URL(유알엘)은 scheme(스킴)·host(호스트)·port(포트)·path·query 등으로 자원을 가리킵니다. HTTP(에이치티티피)는 클라이언트 요청과 서버 응답의 의미·형식을 정하는 프로토콜입니다.","mechanism":"요청에는 method(메서드)·대상·header(헤더)·필요한 body(바디)가 있고 응답에는 status·header·body가 있습니다. JSON(제이슨)은 body를 표현하는 방식 중 하나입니다. 서버는 입력 타입·길이·권한을 검증해야 합니다.","example":"GET(겟) /reports?year=2025는 reports 경로에 year 조건을 전달한다. Content-Type은 body(바디)의 형식을 설명한다.","mistake":"URL(유알엘) query나 header(헤더)에도 민감정보가 노출될 수 있습니다. 비밀번호를 URL에 넣지 않습니다.","question":"JSON(제이슨)을 보내면서 Content-Type이 다르면?","answer":"서버가 body(바디)를 잘못 해석하거나 거부할 수 있습니다. 실제 전송 형식과 header(헤더)·API(에이피아이) 계약을 맞춰야 합니다.","id":"c12-s1","number":1,"chapter":12},{"title":"HTTP(에이치티티피) 메서드·안전성·멱등성","definition":"GET(겟)은 주로 조회, POST(포스트)는 생성·작업 요청, PUT(풋)은 대상 표현 대체, PATCH(패치)는 부분 변경, DELETE(딜리트)는 제거에 사용합니다.","mechanism":"안전성은 요청 의미상 상태 변경을 요구하지 않는 성질입니다. 멱등성은 같은 요청을 반복해도 의도한 최종 효과가 한 번과 같은 성질입니다. 응답 코드나 로그까지 매번 같다는 뜻은 아닙니다. 실제 구현이 메서드의 의미를 지켜야 합니다.","example":"DELETE(딜리트)를 한 번 수행하면 삭제되고 두 번째는 404일 수 있지만 최종 삭제 상태는 같다.","mistake":"같은 요청을 재시도할 때 상태 변경이 중복되는지 확인합니다. 결제·작업 접수처럼 부작용이 있는 POST(포스트)는 키와 입력을 함께 기록해 중복과 충돌을 구분합니다.","question":"GET(겟)으로 결제하도록 만들면 왜 위험한가요?","answer":"크롤러·캐시·자동 재요청이 상태를 바꿀 수 있습니다. 안전한 조회 의미에 어긋납니다.","id":"c12-s2","number":2,"chapter":12},{"title":"상태 코드와 오류 계약","definition":"2xx는 성공 의미, 3xx는 재지정·캐시 관련 처리, 4xx는 요청·권한·현재 상태 문제, 5xx는 서버 처리 실패를 표현합니다.","mechanism":"200·201·202·204는 성공 안에서도 의미가 다릅니다. 401은 유효한 인증 없음, 403은 허용 거부, 404는 대상 없음, 409는 상태 충돌, 429는 요청 제한에 쓸 수 있습니다. body(바디)의 오류 코드와 메시지도 안정적으로 정의합니다.","example":"202 Accepted는 작업 접수이지 완료가 아니다. 작업 ID(아이디)와 진행·실패 조회 경로가 필요하다.","mistake":"모든 실패를 200과 '실패' 문자열로 보내면 모니터링·클라이언트 제어가 어려워집니다.","question":"502·503·504는 모두 같은 문제인가요?","answer":"502는 게이트웨이가 잘못된 upstream(업스트림) 응답을 받은 상황, 503은 서비스 불가, 504는 게이트웨이의 upstream 대기 초과 등 의미가 다릅니다.","id":"c12-s3","number":3,"chapter":12},{"title":"TLS(티엘에스)·HTTPS(에이치티티피에스)·인증서","definition":"HTTPS(에이치티티피에스)는 TLS(티엘에스)로 HTTP(에이치티티피)의 전송 구간을 보호합니다. 암호화와 변조 탐지, 일반적인 서버 신원 확인을 제공합니다.","mechanism":"클라이언트는 인증서의 이름·유효기간·신뢰 체인을 검증합니다. TLS(티엘에스)가 끝나는 프록시 이후 구간은 별도 보호가 필요할 수 있습니다. HTTPS(에이치티티피에스)는 서버 DB(디비) 암호화나 로그인 권한을 대신하지 않습니다.","example":"브라우저가 example.com에 접속하면 인증서가 그 이름에 유효한지 확인한다. 다른 이름의 인증서를 믿고 넘어가면 안 된다.","mistake":"SSL/TLS 검증을 끄는 것은 인증서 오류의 근본 해결이 아닙니다.","question":"인증서 유효기간은 맞는데 실패하면?","answer":"이름 불일치, 중간 인증서 누락, 신뢰 루트와 시스템 시간 등도 확인해야 합니다.","id":"c12-s4","number":4,"chapter":12},{"title":"쿠키·세션·브라우저 저장소","definition":"HTTP(에이치티티피) 요청은 그 자체로 로그인 상태를 지속 저장하지 않습니다. 쿠키와 서버 세션 등을 이용해 여러 요청을 같은 사용자 상태와 연결합니다.","mechanism":"쿠키는 조건에 맞으면 브라우저가 자동 전송합니다. 세션 ID(아이디)를 쿠키에 담고 실제 상태를 서버에서 조회할 수 있습니다. LocalStorage는 JS(제이에스) 접근 가능하며 쿠키와 전송 방식·XSS(엑스에스에스)·CSRF(씨에스알에프) 위험이 다릅니다.","example":"로그인 → 서버 세션 생성 → 쿠키에 ID(아이디) → 다음 요청에서 서버가 ID로 세션 확인.","mistake":"쿠키 자체가 반드시 로그인 정보를 뜻하지는 않습니다. 여러 목적의 값을 담을 수 있습니다.","question":"HttpOnly(에이치티티피온리)가 쿠키의 자동 전송도 막나요?","answer":"아닙니다. JS(제이에스)의 값 읽기를 제한할 뿐 요청 첨부는 쿠키 조건에 따라 계속될 수 있습니다.","id":"c12-s5","number":5,"chapter":12},{"title":"HTTP(에이치티티피) 캐시·프록시·CDN(씨디엔)·버전","definition":"캐시는 이전 응답을 재사용하고 프록시는 요청을 중계합니다. CDN(씨디엔)은 여러 위치에서 콘텐츠를 제공해 지연과 원본 부하를 줄일 수 있습니다.","mechanism":"Cache-Control과 ETag 같은 규칙으로 신선도·재검증을 관리합니다. 개인화 응답은 공유 캐시에 섞이지 않게 해야 합니다. HTTP/2의 다중화와 HTTP/3의 QUIC(큐유아이씨)도 앱의 잘못된 캐시·권한 정책을 해결하지는 않습니다.","example":"ETag가 같으면 304로 본문 재전송을 줄일 수 있다. 서버·브라우저가 각각 어떤 캐시를 보는지 구분한다.","mistake":"모든 API(에이피아이) 응답을 CDN(씨디엔)에 저장하면 로그인 데이터가 유출될 수 있습니다.","question":"캐시 때문에 수정 내용이 안 보일 때?","answer":"캐시 key(키)·TTL(티티엘)·재검증·무효화 정책을 보고 어떤 계층이 이전 응답을 주는지 확인합니다.","id":"c12-s6","number":6,"chapter":12}],"sources":[["MDN: HTTP 개요","https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Overview"],["IETF: HTTP semantics RFC 9110","https://www.rfc-editor.org/rfc/rfc9110"],["MDN: HTTP caching","https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching"]]},{"number":13,"title":"FastAPI(패스트에이피아이)와 백엔드 요청 흐름","prerequisite":"2–4장: 함수·타입, 12장: HTTP.","intro":"API(에이피아이) 핸들러에서 받은 값을 검증하고, 업무 규칙을 거쳐 저장하거나 결과를 반환하는 흐름을 따라갑니다.","practice":"연습용 작업 접수 API에서 빈 파일, 허용 범위를 벗어난 입력, 정상 입력의 응답을 기록하세요. 작업 상태 조회도 하나 추가합니다.","done_when":"요청 검증 실패와 작업 처리 실패를 다른 상태로 표현하고, 접수 성공이 분석 완료를 뜻하지 않음을 응답에서 구분합니다.","example_title":"주문 생성 요청의 한 바퀴","trace":["Router(라우터)에서 요청 본문 형태를 확인하고 인증된 사용자를 얻습니다. 사용자가 보낸 가격·권한 값을 그대로 신뢰하지 않습니다.","Service(서비스)에서 재고·가격·업무 규칙을 판단합니다. Repository(리포지터리)를 통해 저장하고 함께 성공해야 할 변경을 트랜잭션으로 묶습니다.","commit(커밋) 성공 뒤 생성 ID(아이디)를 응답합니다. 요청이 끊겼어도 저장은 완료될 수 있으므로 재요청에 대한 중복 정책도 필요합니다."],"table":[["단계","역할","대표 오류"],["입력 검증","형태·범위 확인","필수 필드 누락"],["업무 처리","권한·상태·규칙","재고·잔액 부족"],["저장","조회·변경·트랜잭션","제약 위반·연결 실패"],["응답","상태·형식·오류 계약","내부 정보 노출"]],"lessons":[{"title":"API(에이피아이)·REST(레스트)·계약","definition":"API(에이피아이)는 프로그램끼리 사용하는 인터페이스입니다. REST(레스트)는 자원 중심 표현, 무상태 요청 등 제약을 바탕으로 한 설계 스타일입니다.","mechanism":"경로·method(메서드)·입출력 schema(스키마)·오류·페이지네이션·권한을 계약으로 정합니다. 이름만 REST(레스트)로 붙인다고 좋은 API(에이피아이)가 되는 것은 아닙니다. 클라이언트와 서버가 독립적으로 변경 가능한 경계를 설계해야 합니다.","example":"GET(겟) /reports/42는 보고서 조회, POST(포스트) /reports는 생성 요청으로 표현할 수 있다. 생성 처리시간과 상태 조회 요구도 계약에 포함한다.","mistake":"무상태가 DB(디비)·세션 저장소를 절대로 쓰지 않는다는 뜻은 아닙니다. 요청을 해석할 문맥 의존성을 구분해야 합니다.","question":"API(에이피아이) 필드를 갑자기 삭제하면 어떤 문제가 있나요?","answer":"클라이언트가 깨질 수 있습니다. 호환성·버전·이전 기간과 사용처 확인이 필요합니다.","id":"c13-s1","number":1,"chapter":13},{"title":"입력 검증·직렬화·Pydantic(파이단틱)","definition":"입력 검증은 형식·타입·범위가 계약에 맞는지 확인합니다. 직렬화는 객체를 JSON(제이슨) 등 전송 가능한 표현으로 바꾸는 과정입니다.","mechanism":"Pydantic(파이단틱)은 schema(스키마) 기반 검증과 변환을 돕지만 동시 재고나 현재 사용자 권한은 DB(디비)·업무 로직을 봐야 합니다. 변환이 허용되는지 strict 검증인지도 정책에 따라 선택합니다. 응답에서 내부 비밀 필드를 제외해야 합니다.","example":"수량이 양의 정수인지 검증한 뒤 실제 재고가 충분한지는 원자적인 DB(디비) 처리와 함께 확인한다.","mistake":"수량이 정수라는 검사와 주문할 재고가 있는지 확인하는 업무 검사는 별개입니다. 실패 응답과 재고가 변경되지 않는 조건을 각각 검증합니다.","question":"응답 모델을 따로 정의하는 이유는?","answer":"클라이언트 계약을 안정화하고 DB(디비) 객체의 내부 필드·비밀정보가 자동 노출되는 것을 줄이기 위해서입니다.","id":"c13-s2","number":2,"chapter":13},{"title":"FastAPI(패스트에이피아이) 라우팅과 의존성","definition":"라우팅은 요청 경로와 method(메서드)를 처리 함수에 연결합니다. Depends는 DB(디비) 세션·현재 사용자 같은 의존성을 선언해 재사용하게 합니다.","mechanism":"요청 처리 전에 필요한 의존성이 실행되고 결과가 함수에 전달됩니다. yield 의존성은 자원 정리를 구성할 수 있지만 commit(커밋)·rollback(롤백) 정책을 자동으로 만들어 주지는 않습니다. 리소스별 인가도 직접 구현해야 합니다.","example":"@app.get('/health')는 조회 경로 예시다. DB(디비) 세션 dependency와 사용자 인증 dependency를 별도로 주입할 수 있다.","mistake":"Depends를 썼다는 이유로 모든 API(에이피아이)에 권한 검증이 적용된다고 생각하면 안 됩니다.","question":"테스트에서 실제 DB(디비) 대신 가짜 저장소를 쓰려면?","answer":"의존성을 교체 가능한 경계로 만들고 override나 명시적 주입을 사용합니다. 대역 테스트와 실제 DB(디비) 계약 검증은 구분합니다.","id":"c13-s3","number":3,"chapter":13},{"title":"ASGI(에이에스지아이)·동기 endpoint(엔드포인트)·비동기 endpoint","definition":"ASGI(에이에스지아이)는 Python(파이썬) 웹 앱과 서버가 통신하는 인터페이스입니다. Uvicorn(유비콘) 같은 서버가 요청을 받아 FastAPI(패스트에이피아이) 앱을 실행합니다.","mechanism":"async(에이싱크) endpoint(엔드포인트)는 await(어웨이트) 가능한 I/O에 적합합니다. FastAPI(패스트에이피아이)가 직접 실행하는 def(데프) endpoint는 보통 thread(스레드) pool에서 처리하지만 async 안에서 직접 호출한 일반 함수까지 자동 이동하지 않습니다. worker(워커)를 늘릴 때 DB(디비) 풀과 메모리도 함께 증가합니다.","example":"async def endpoint 안의 time.sleep은 event loop를 막는다. 비동기 대기는 await 가능한 API를 사용해야 한다.","mistake":"비동기 핸들러에서 동기 DB(디비) 드라이버나 오래 걸리는 CPU(씨피유) 작업을 직접 호출하면 이벤트 루프가 멈출 수 있습니다. 요청 전체 지연과 막힌 구간을 먼저 측정합니다.","question":"모델 추론이 긴 API(에이피아이)는 어떻게 구성하나요?","answer":"실제 연산 성격을 확인해 별도 worker(워커)·프로세스·추론 서버 등을 검토합니다. 취소·timeout(타임아웃)과 동시성 상한도 필요합니다.","id":"c13-s4","number":4,"chapter":13},{"title":"Router(라우터)·Service(서비스)·Repository(리포지터리)","definition":"Router(라우터)는 HTTP(에이치티티피) 계약, Service(서비스)는 업무 흐름, Repository(리포지터리)는 저장소 접근을 맡도록 나눌 수 있습니다. 이는 흔한 구조이지 반드시 세 파일이어야 한다는 규칙은 아닙니다.","mechanism":"입력 변환과 업무 결정, SQL(에스큐엘)이 한 함수에 섞이면 변경·테스트가 어려워집니다. 트랜잭션은 함께 성공해야 하는 업무 단위에 맞춰 조정해야 합니다. 각 repository가 매번 commit(커밋)하면 여러 변경을 원자적으로 묶기 어렵습니다.","example":"주문 API(에이피아이) → 주문 service → 재고·주문 repository. 두 DB(디비) 변경은 같은 업무 트랜잭션에 참여하도록 설계할 수 있다.","mistake":"계층을 나누기만 하면 결합도가 자동으로 낮아지는 것은 아닙니다.","question":"두 repository 호출 중 하나만 실패하면?","answer":"공유 트랜잭션으로 rollback(롤백)할지, 부분 상태와 보상으로 다룰지 결정해야 합니다. 성공 반환만 이어 붙이면 정합성이 깨집니다.","id":"c13-s5","number":5,"chapter":13},{"title":"긴 작업·작업 큐·오류·timeout(타임아웃)","definition":"OCR(오씨알)·보고서 생성처럼 오래 걸리는 일은 HTTP(에이치티티피) 요청 수명과 작업 수명을 분리할 수 있습니다. API(에이피아이)는 접수하고 worker(워커)가 수행하는 방식입니다.","mechanism":"작업 ID(아이디)·진행 상태·결과·실패 정보를 저장합니다. timeout(타임아웃)은 기다림의 한계이며 외부 작업 취소를 자동 보장하지 않습니다. 재시도와 작업 중복을 처리하고 프로세스가 꺼져도 작업이 남아야 하는지 결정합니다.","example":"POST(포스트) /jobs → 202와 job_id → GET(겟) /jobs/{id(아이디)}로 상태 확인. 실패도 최종 상태로 표현한다.","mistake":"작업 접수 성공과 처리 완료를 구분합니다. 작업 상태를 어디에 저장하고, 작업 도중 프로세스가 재시작되면 무엇을 다시 처리할 수 있는지 확인합니다.","question":"응답 연결이 끊기면 작업이 끝났는지 어떻게 아나요?","answer":"응답이 끊겨도 서버가 작업을 접수했을 수 있습니다. 요청 전에 만든 같은 멱등 키로 다시 접수해 기존 작업 ID(아이디)를 받은 뒤 상태를 조회합니다. 서버에 중복 방지 기능이 있어야 이 방식이 안전합니다.","id":"c13-s6","number":6,"chapter":13}],"sources":[["FastAPI: async","https://fastapi.tiangolo.com/async/"],["FastAPI: Dependencies","https://fastapi.tiangolo.com/tutorial/dependencies/"],["Pydantic: Models","https://docs.pydantic.dev/latest/concepts/models/"]]},{"number":14,"title":"SQL(에스큐엘)과 데이터 모델링","prerequisite":"2장: 값과 조건, 13장: 저장 단계.","intro":"조회 API(에이피아이)의 결과 수가 예상보다 많다면 조인 관계와 중복 행부터 봅니다. 제약은 입력 단계의 오류를 데이터베이스에서도 잡아 줍니다.","practice":"사용자 두 명과 주문 두 건을 준비하되 두 주문 모두 한 사람에게 연결하세요. INNER JOIN과 LEFT JOIN의 행 수를 비교합니다.","done_when":"주문이 없는 사용자의 처리와 오른쪽 테이블의 조건을 ON 또는 WHERE에 둘 때 생기는 차이를 설명합니다.","example_title":"사용자와 주문을 JOIN(조인)하기","trace":["users 한 행은 사용자 한 명, orders 한 행은 주문 한 건이라고 정의합니다. orders.user_id가 사용자와 연결됩니다.","사용자 한 명에게 주문이 3개 있으면 JOIN(조인) 결과에서도 그 사용자 정보가 3번 나타날 수 있습니다. 원본 사용자 수와 결과 행 수가 다릅니다.","주문이 없는 사용자도 필요하면 LEFT(레프트) JOIN(조인)을 고려합니다. 오른쪽 테이블 조건을 WHERE(웨어)에 두면 의도치 않게 그 행을 제외할 수 있습니다."],"table":[["제약","보장하려는 규칙","주의"],["PRIMARY KEY","행 식별","업무 의미와 변경 가능성 고려"],["FOREIGN KEY","참조 대상 존재","삭제·갱신 정책 필요"],["UNIQUE","키 중복 제한","NULL 처리·DB 설정 확인"],["CHECK / NOT NULL","값 조건·필수값","앱 규칙 전체를 대체하진 않음"]],"lessons":[{"title":"테이블·행·열·키·제약","definition":"관계형 DB(디비)는 데이터를 테이블의 행과 열로 표현합니다. 기본키는 행 식별, 외래키는 다른 테이블과의 관계를 표현합니다.","mechanism":"NOT(엔오티) NULL(널)·UNIQUE(유니크)·CHECK(체크)·FK(에프케이) 같은 제약은 저장 가능한 상태를 제한합니다. 앱만 검사하면 동시 요청이 검사를 통과할 수 있어 DB(디비) 제약이 마지막 방어가 됩니다. 실제 업무에서 무엇이 유일한지 정의하는 것이 먼저입니다.","example":"users(id(아이디) PK(피케이)), reports(id PK, user_id FK(에프케이)). email을 유일하게 쓸지와 대소문자 정책도 함께 정한다.","mistake":"기본키를 만들었다고 모든 업무 중복이 막히지는 않습니다. 업무 식별자 제약도 필요할 수 있습니다.","question":"동시에 같은 이메일 가입이 들어오면?","answer":"DB(디비)의 적절한 UNIQUE(유니크) 제약과 충돌 처리가 필요합니다. 먼저 조회해 없으면 INSERT(아이엔에스이알티)하는 로직만으로 충분하지 않습니다.","id":"c14-s1","number":1,"chapter":14},{"title":"SELECT(셀렉트)·WHERE(웨어)·NULL(널)·정렬","definition":"SELECT(셀렉트)는 조회할 열을, WHERE(웨어)는 행 조건을, ORDER(오더) BY(바이)는 결과 순서를 지정합니다. NULL(널)은 알려지지 않거나 없는 값을 나타내는 별도 상태입니다.","mechanism":"NULL(널) 비교는 보통 IS(아이에스) NULL을 쓰며 = NULL은 기대한 참이 되지 않습니다. ORDER(오더) BY(바이)가 없으면 결과 순서를 보장한다고 가정하지 않습니다. LIMIT(엘아이엠아이티)는 반환 수를 제한하며 정렬·페이지 전략과 함께 사용합니다.","example":"SELECT id FROM reports WHERE deleted_at IS NULL ORDER BY id LIMIT 20; 는 삭제 표시 없는 앞 20개를 ID순 조회하는 예시다.","mistake":"행이 물리적으로 저장된 순서가 항상 조회 순서라고 생각하면 안 됩니다.","question":"NULL(널)과 빈 문자열은 같나요?","answer":"다릅니다. 값이 없음을 나타내는 정책과 길이 0인 문자열의 의미를 스키마·앱에서 일관되게 정해야 합니다.","id":"c14-s2","number":2,"chapter":14},{"title":"JOIN(조인)과 행 수 증가","definition":"JOIN(조인)은 관계 조건으로 여러 테이블의 행을 연결합니다. INNER(아이엔엔이알) JOIN은 일치 행, LEFT(레프트) JOIN은 왼쪽을 유지하며 오른쪽 불일치를 NULL(널)로 표현합니다.","mechanism":"일대다 관계를 JOIN(조인)하면 부모 행이 여러 결과 행으로 늘 수 있습니다. LEFT(레프트) JOIN 뒤 WHERE(웨어)에서 오른쪽 값을 필터링하면 원래 보존하려던 행이 사라질 수 있습니다. 결과 행 수와 집계 의미를 확인해야 합니다.","example":"사용자 한 명의 주문 세 건을 JOIN(조인)하면 사용자 정보가 세 행에 반복될 수 있다.","mistake":"조회 행 수가 늘면 키별로 양쪽 테이블의 매칭 건수를 확인합니다. 집계 전에 조인하면 합계도 부풀 수 있으므로 예상 행 수를 먼저 테스트합니다.","question":"주문 없는 사용자도 보고 싶다면?","answer":"LEFT(레프트) JOIN(조인)을 검토하고 오른쪽 필터를 ON(오엔)에 둘지 WHERE(웨어)에 둘지 의도에 맞게 정해야 합니다.","id":"c14-s3","number":3,"chapter":14},{"title":"집계·GROUP(그룹) BY(바이)·윈도 함수","definition":"집계는 여러 행을 개수·합계 같은 결과로 묶습니다. GROUP(그룹) BY(바이)는 그룹별 행을 만들고 윈도 함수는 개별 행을 유지하며 집계·순위 정보를 붙일 수 있습니다.","mechanism":"WHERE(웨어)는 집계 전 행 조건, HAVING(에이치에이브이아이엔지)은 집계 후 그룹 조건입니다. JOIN(조인)으로 행이 늘어난 뒤 합산하면 금액이 부풀 수 있습니다. NULL(널)을 포함할 때 COUNT(씨오유엔티)(*)와 COUNT(column(컬럼)) 의미도 다릅니다.","example":"고객별 매출 합계는 GROUP(그룹) BY(바이), 거래 행마다 고객 내 순위를 붙이는 것은 ROW_NUMBER() OVER(오브이이알)(...)로 표현할 수 있다.","mistake":"합계가 맞는지 확인하지 않고 SQL(에스큐엘)이 실행된다는 이유만으로 정답이라고 보지 않습니다.","question":"COUNT(씨오유엔티)(column(컬럼))이 전체 행 수보다 작은 이유는?","answer":"그 열이 NULL(널)인 행을 세지 않기 때문입니다. 전체 행 개수는 COUNT(씨오유엔티)(*)와 비교합니다.","id":"c14-s4","number":4,"chapter":14},{"title":"정규화·중복·데이터 모델","definition":"정규화는 사실의 중복과 갱신 이상을 줄이도록 관계를 나누는 설계 원칙입니다. 어떤 사실이 어떤 키에 의존하는지 살핍니다.","mechanism":"사용자 주소를 모든 주문과 같은 의미로 복사하면 현재 주소 변경이 어려울 수 있습니다. 다만 주문 당시 배송지처럼 과거 시점의 사실은 별도로 보존해야 합니다. 중복 제거와 이력 보존은 업무 의미에 따라 구분합니다.","example":"현재 사용자 이름은 users, 주문 시점의 배송지는 order_shipping_snapshot에 둘 수 있다.","mistake":"모든 중복이 나쁜 것은 아닙니다. 의도적인 캐시·스냅샷과 갱신 오류를 만드는 중복을 구분합니다.","question":"비정규화는 언제 검토하나요?","answer":"측정된 조회 병목이 있고 중복 갱신·검증 비용을 감당할 수 있을 때 검토합니다. 성능 추측만으로 먼저 적용하지 않습니다.","id":"c14-s5","number":5,"chapter":14},{"title":"SQL(에스큐엘)·NoSQL·스키마 변경","definition":"SQL(에스큐엘)은 관계형 DB(디비)를 다루는 언어이고 NoSQL은 문서·키값·그래프 등 다양한 저장 모델을 아우르는 분류입니다. 어느 쪽이 항상 빠르다는 일반화는 부정확합니다.","mechanism":"조회 패턴·트랜잭션·일관성·스키마 변화·운영 역량으로 선택합니다. 스키마 없는 DB(디비)도 앱에는 데이터 계약이 필요합니다. 배포 중 컬럼을 바꾸면 구버전 앱과 새버전 앱의 호환성을 고려해야 합니다.","example":"새 필드를 먼저 허용 가능하게 추가 → 앱 전환 → 데이터 채움 → 이전 필드 제거 같은 단계적 변경을 검토한다.","mistake":"구버전과 신버전이 동시에 실행될 수 있습니다. 새 필드 추가와 구 코드 호환을 먼저 검증한 뒤 데이터를 채우고, 제약과 이전 필드 제거는 나중에 적용합니다.","question":"컬럼 이름을 바로 바꾸면 왜 위험한가요?","answer":"이전 앱 버전의 SQL(에스큐엘)이 깨질 수 있습니다. 점진 이전·롤백 가능성과 데이터량에 따른 잠금 시간을 봐야 합니다.","id":"c14-s6","number":6,"chapter":14}],"sources":[["PostgreSQL: SQL Tutorial","https://www.postgresql.org/docs/current/tutorial-sql.html"],["PostgreSQL: Constraints","https://www.postgresql.org/docs/current/ddl-constraints.html"]]},{"number":15,"title":"트랜잭션·인덱스·DB(디비) 운영","prerequisite":"14장: 행·키·UPDATE(업데이트)·조회.","intro":"잔액·재고처럼 동시에 바뀔 수 있는 값은 읽고 쓰는 사이에 다른 요청이 들어올 수 있습니다.","practice":"테스트 DB에 재고 1개를 넣고 두 연결에서 같은 상품에 조건부 UPDATE를 시도하세요. 변경된 행 수와 최종 재고를 기록합니다.","done_when":"한 요청만 성공하고 재고가 음수가 되지 않습니다. 응답 유실 뒤 같은 업무 요청을 다시 보내는 경우는 별도 문제임을 설명합니다.","example_title":"10만 원에서 8만 원씩 동시 출금","trace":["A와 B가 모두 잔액 10만 원을 읽으면 둘 다 출금 가능하다고 판단할 수 있습니다. 조회와 차감 사이의 틈이 문제입니다.","잔액이 8만 원 이상일 때만 차감하는 조건을 UPDATE(업데이트) 자체에 넣습니다. PostgreSQL(포스트그레스큐엘) Read(리드) Committed(커미티드)의 같은 행 갱신에서는 대기 후 갱신 대상 조건을 다시 평가합니다.","변경 행 수가 1이면 성공, 0이면 실패로 처리합니다. 출금 이력 등 함께 반영해야 할 작업은 같은 트랜잭션에 묶고 요청 중복은 별도로 제어합니다."],"table":[["ACID","뜻","예"],["원자성","전부 반영 또는 취소","차감만 되고 입금 실패 방지"],["일관성","정해진 제약 유지","키·CHECK·업무 규칙"],["격리성","동시 실행의 영향 제어","격리 수준·잠금"],["지속성","확정 결과 보존","설정·장애 범위에 따른 보장"]],"lessons":[{"title":"트랜잭션·ACID(애시드)·commit(커밋)","definition":"트랜잭션은 DB(디비) 작업을 논리적 성공·실패 단위로 묶습니다. commit(커밋)은 확정, rollback(롤백)은 미확정 변경 취소입니다.","mechanism":"ACID(애시드)는 원자성·일관성·격리성·지속성입니다. DB(디비)가 제공하는 기능과 앱이 정의한 업무 제약이 함께 필요합니다. 외부 파일·결제·LLM(엘엘엠) 호출까지 DB rollback(롤백)으로 자동 취소되지는 않습니다.","example":"송금은 차감과 입금을 하나의 DB(디비) 트랜잭션으로 묶는다. commit(커밋) 후 취소는 별도 반대 거래 같은 보상 작업이 필요할 수 있다.","mistake":"트랜잭션만 쓰면 잔액 검사를 따로 하지 않아도 된다는 생각은 틀립니다.","question":"두 테이블 저장이 각각 commit(커밋)되면 원자적인가요?","answer":"둘을 하나의 업무 단위로 볼 때 원자적이지 않습니다. 두 번째 실패 시 첫 번째 변경이 남을 수 있습니다.","id":"c15-s1","number":1,"chapter":15},{"title":"MVCC(엠브이씨씨)·snapshot(스냅샷)·격리 수준","definition":"MVCC(엠브이씨씨)는 여러 버전의 행 등을 이용해 동시 작업의 읽기·쓰기를 관리하는 방식입니다. snapshot(스냅샷)은 어떤 시점의 변경을 볼지 정하는 관점입니다.","mechanism":"PostgreSQL(포스트그레스큐엘)의 기본 Read(리드) Committed(커미티드)에서 일반 SELECT(셀렉트)는 쿼리 시작 전에 커밋된 변경과 현재 트랜잭션이 앞서 수행한 변경을 봅니다. Repeatable Read와 Serializable(시리얼라이저블)은 더 강한 격리 특성이 있지만 모든 DB(디비)가 같은 구현은 아닙니다. Serializable은 충돌 시 취소·재시도가 필요할 수 있습니다.","example":"같은 트랜잭션의 SELECT 두 번 사이에 다른 트랜잭션이 commit하면 Read Committed에서 결과가 달라질 수 있다.","mistake":"읽기가 잠금을 덜 기다린다는 것과 쓰기 충돌이 없다는 것은 다릅니다.","question":"Serializable(시리얼라이저블)이면 재시도 코드가 필요 없나요?","answer":"충돌한 트랜잭션이 실패할 수 있으므로 전체 업무 재시도와 멱등성 처리가 필요합니다.","id":"c15-s2","number":2,"chapter":15},{"title":"원자적 UPDATE(업데이트)·행 잠금·낙관적 제어","definition":"동시 갱신은 읽기와 쓰기 사이의 변경을 고려해야 합니다. 조건부 UPDATE(업데이트), SELECT(셀렉트) FOR(에프오알) UPDATE, 버전 컬럼 등으로 제어할 수 있습니다.","mechanism":"잔액 조건을 UPDATE(업데이트)에 넣으면 한 문장에서 조건과 차감을 평가합니다. 행 잠금은 검사 중 다른 쓰기를 제어하고, 버전 비교는 읽은 뒤 값이 바뀌었는지 충돌을 탐지합니다. 영향 행 수와 충돌 시 동작을 처리해야 합니다.","example":"UPDATE accounts SET balance=balance-80 WHERE id=1 AND balance>=80; 변경 행 수 0은 성공 차감이 아니다.","mistake":"조건부 UPDATE(업데이트)는 성공한 행 수로 판단합니다. DB(디비) 락을 잡은 채 외부 API(에이피아이)를 기다리지 않도록 트랜잭션 범위와 업무 흐름을 확인합니다.","question":"version이 예상과 달라 갱신 0행이면?","answer":"충돌로 보고 최신 값을 읽어 재판단하거나 사용자에게 충돌을 알립니다. 무조건 덮어쓰면 버전 검사의 의미가 사라집니다.","id":"c15-s3","number":3,"chapter":15},{"title":"인덱스·B-tree(비트리)·복합 인덱스","definition":"인덱스는 조회를 돕는 추가 자료구조입니다. B-tree(비트리) 계열은 정렬된 키와 균형 있는 구조로 여러 범위·순서 조회에 쓰입니다.","mechanism":"인덱스 열 순서·선택도·정렬 조건에 따라 사용 효과가 달라집니다. 복합 인덱스의 선두 조건은 효율에 중요한 영향을 주지만 엔진·계획별 최적화도 존재합니다. 인덱스마다 저장·쓰기 유지 비용이 발생합니다.","example":"사용자별 최신 주문 조회에는 (user_id, created_at) 같은 인덱스를 검토하고 실제 계획으로 확인한다.","mistake":"인덱스가 많을수록 모든 서비스가 빨라지는 것은 아닙니다.","question":"작은 테이블에서 Seq(시퀀셜) Scan을 고르면 문제인가요?","answer":"전체를 순차로 읽는 것이 더 저렴할 수 있습니다. 인덱스 미사용 자체보다 실제 비용과 응답 목표를 봅니다.","id":"c15-s4","number":4,"chapter":15},{"title":"EXPLAIN(익스플레인)·통계·연결 풀·N+1","definition":"EXPLAIN(익스플레인)은 실행 계획을 보여주고 EXPLAIN ANALYZE(애널라이즈)는 실제 실행 통계까지 제공합니다. 느린 DB(디비)는 쿼리뿐 아니라 대기와 연결 문제도 봐야 합니다.","mechanism":"예상·실제 행 수, scan(스캔)·join(조인)·정렬, buffer(버퍼)·시간을 비교합니다. 앱이 사용자 목록 조회 후 사용자마다 주문을 다시 읽는 N+1은 요청 수를 키울 수 있습니다. 풀 크기는 전체 DB(디비) 연결 한도와 worker(워커) 수를 함께 고려합니다.","example":"worker(워커) 4개가 각각 최대 연결 20개를 갖는다면 최대 사용량이 늘어날 수 있다. 여기에 배치·관리 연결도 포함한다.","mistake":"ANALYZE(애널라이즈)는 실제 쿼리를 실행하므로 변경 SQL(에스큐엘)이나 고부하 쿼리를 운영에서 무심코 실행하면 안 됩니다.","question":"DB(디비) 응답이 빠른데 API(에이피아이)가 DB를 오래 기다린다면?","answer":"쿼리 실행 전 연결 풀 대기, 락 대기, N+1 호출 수와 네트워크 시간을 확인합니다.","id":"c15-s5","number":5,"chapter":15},{"title":"백업·복제·복원·PITR(피아이티알)","definition":"백업은 과거 시점 데이터의 복구 수단이고 복제는 다른 인스턴스에 변경을 전달하는 방식입니다. 둘은 목적이 겹치지만 동일하지 않습니다.","mechanism":"잘못된 삭제도 복제될 수 있어 복제만으로 백업을 대체하지 못합니다. 로그와 백업을 이용한 시점 복구는 지원 범위·보존 설정이 중요합니다. 복구 목표와 실제 복원 시간·데이터 검증을 확인해야 합니다.","example":"RPO(알피오)가 5분이면 장애 직전 최대 5분치 변경 손실을 허용한다. RTO(알티오)가 1시간이면 장애 후 1시간 이내 복구가 목표다.","mistake":"백업 성공 로그가 있다는 사실과 복원이 가능하다는 사실은 다릅니다.","question":"매일 백업하면 손실을 항상 0으로 만들 수 있나요?","answer":"백업 사이의 변경이 손실될 수 있습니다. 로그 보존·복제·복구 정책을 목표에 맞게 구성해야 합니다.","id":"c15-s6","number":6,"chapter":15}],"sources":[["PostgreSQL: Transaction Isolation","https://www.postgresql.org/docs/current/transaction-iso.html"],["PostgreSQL: Indexes","https://www.postgresql.org/docs/current/indexes.html"],["PostgreSQL: Backup","https://www.postgresql.org/docs/current/backup.html"]]},{"number":16,"title":"PostgreSQL(포스트그레스큐엘) 내부 동작과 정합성","prerequisite":"15장: ACID(애시드)·MVCC(엠브이씨씨)·인덱스.","intro":"데이터베이스 저장과 메시지 발행이 서로 다른 단계라면, 한쪽 성공 뒤 다른 쪽이 실패한 경우를 설계합니다.","practice":"주문 저장 직후 메시지 발행이 실패한다고 가정하세요. 같은 트랜잭션에 주문과 outbox를 쓸 때 재발행 순서와 소비자의 중복 처리 방법을 적습니다.","done_when":"발행 후 완료 표시 전에 작업자가 종료되는 경우에도 이벤트가 중복될 수 있음을 설명하고 소비 단계의 제어를 제안합니다.","example_title":"저장 성공 후 메시지 발행 실패","trace":["주문 DB(디비) commit(커밋)은 성공했는데 메시지 서버에 알리기 전에 앱이 종료됩니다. 주문은 있는데 처리 worker(워커)가 모릅니다.","업무 변경과 outbox(아웃박스) 이벤트를 같은 DB(디비) 트랜잭션에 넣으면 나중에 발행기가 미전송 이벤트를 찾아 보낼 수 있습니다.","발행 성공 후 완료 표시 전에 죽으면 다시 보낼 수도 있습니다. 소비자가 멱등 처리해야 하므로 outbox(아웃박스)를 exactly-once 보장이라고 단정하지 않습니다."],"table":[["문제","관련 수단","남는 책임"],["같은 행 갱신 경합","조건부 UPDATE·행 락","결과 검사"],["여러 행의 업무 조건","적절한 잠금·Serializable","실패 시 전체 재시도"],["DB와 이벤트 연결","transactional outbox","중복 발행·소비 처리"],["장애 후 복원","WAL·backup·PITR","복원 연습·보존 정책"]],"lessons":[{"title":"WAL(더블유에이엘)·체크포인트·crash(크래시) 복구","definition":"WAL(더블유에이엘)은 데이터 파일 변경에 앞서 복구에 필요한 로그를 기록하는 방식입니다. 체크포인트는 복구 시작점과 데이터 반영 진행을 관리하는 절차입니다.","mechanism":"DB(디비)는 매 commit(커밋)마다 모든 변경 데이터 페이지를 즉시 정해진 자리에 쓰는 대신 로그의 내구성을 활용할 수 있습니다. 장애 후 로그를 재생해 일관된 상태로 복구합니다. synchronous_commit 등 설정에 따라 성공 응답과 장애 시 손실 가능성의 관계가 달라지므로 설정을 확인해야 합니다.","example":"WAL(더블유에이엘) 보관과 base backup을 함께 관리하면 특정 시점 복원에 사용할 수 있다. 로그만 무한히 쌓는다고 완전한 백업이 되는 것은 아니다.","mistake":"DB(디비) 체크포인트와 LangGraph(랭그래프) 체크포인트는 이름이 같아도 저장 대상과 복구 계약이 다릅니다.","question":"commit(커밋)됐다는 응답이 절대 어떤 장애에도 안전하다는 뜻인가요?","answer":"스토리지·복제·동기화 설정과 장애 범위에 따른 보장입니다. 단일 장치 파괴까지 포함한 복구는 백업·복제·복원 계획을 따로 확인해야 합니다.","id":"c16-s1","number":1,"chapter":16},{"title":"MVCC(엠브이씨씨)·VACUUM(브이에이씨유유엠)·오래 열린 트랜잭션","definition":"MVCC(엠브이씨씨)는 여러 행 버전을 이용해 읽는 작업과 쓰는 작업의 충돌을 줄입니다. PostgreSQL(포스트그레스큐엘)의 VACUUM(브이에이씨유유엠)은 더 이상 필요 없는 행 버전 공간을 재사용 가능하게 하고 관련 정보를 정리합니다.","mechanism":"UPDATE(업데이트)나 DELETE(딜리트) 후 예전 버전이 즉시 모든 독자에게 불필요해지는 것은 아닙니다. 오래 유지되는 snapshot(스냅샷)이 있으면 정리가 지연될 수 있습니다. autovacuum·통계·트랜잭션 수명을 관리하며 일반 VACUUM(브이에이씨유유엠)이 파일을 항상 크게 줄여 OS(오에스)에 반환하는 것은 아닙니다.","example":"API(에이피아이)가 트랜잭션을 연 채 외부 LLM(엘엘엠) 응답을 오래 기다리면 snapshot(스냅샷)·락·연결을 오래 잡을 수 있다. 외부 대기와 DB(디비) 작업 경계를 줄이는 설계를 검토한다.","mistake":"MVCC(엠브이씨씨)가 있으니 잠금·정리 비용이 없다고 생각하면 안 됩니다.","question":"행을 많이 지웠는데 디스크 파일이 그대로면?","answer":"공간의 재사용 가능 상태와 실제 파일 축소를 구분합니다. bloat와 정리 상태를 확인하고 운영 영향이 큰 재작성은 별도 계획이 필요합니다.","id":"c16-s2","number":2,"chapter":16},{"title":"복합·부분·커버링 인덱스","definition":"복합 인덱스는 여러 열을 묶고, 부분 인덱스는 조건을 만족하는 행만, 커버링 목적의 인덱스는 조회에 필요한 열을 함께 담습니다.","mechanism":"B-tree(비트리) (tenant_id, created_at)는 tenant(테넌트) 조건과 시간 범위·정렬 조합에 유용할 수 있습니다. 일반적인 선두 열 조건이 중요하지만 최신 PostgreSQL(포스트그레스큐엘)의 skip scan(스캔) 같은 최적화도 있어 절대 규칙으로 단정하지 않습니다. index-only scan도 MVCC(엠브이씨씨) 가시성 확인 때문에 항상 heap(힙) 접근이 0이 되는 것은 아닙니다.","example":"미처리 작업이 전체의 일부라면 status='pending'인 행만 대상으로 하는 부분 인덱스를 검토할 수 있다. 실제 쿼리 조건이 인덱스 조건과 맞아야 한다.","mistake":"인덱스 열을 모두 포함했다고 모든 상황에서 같은 성능을 보장하지 않습니다.","question":"복합 인덱스 열 순서는 어떻게 정하나요?","answer":"주요 WHERE(웨어)·범위·ORDER(오더) BY(바이)와 분포를 보고 후보를 세운 뒤 실행 계획·읽은 행·쓰기 비용을 측정합니다.","id":"c16-s3","number":3,"chapter":16},{"title":"읽기 이상·write(라이트) skew·Serializable(시리얼라이저블)","definition":"격리 수준은 동시에 실행하는 트랜잭션이 무엇을 볼 수 있고 어떤 충돌을 허용할지 정합니다. write(라이트) skew는 각각 다른 행을 바꾸면서 함께 지켜야 할 조건을 깨뜨리는 유형입니다.","mechanism":"당직자 두 명이 각자 다른 당직자가 남는다고 읽고 본인 행을 off로 바꾸면 둘 다 퇴근할 수 있습니다. 단순한 같은 행 잔액 차감과 달리 행 간 업무 조건이 문제입니다. Serializable(시리얼라이저블)은 직렬 실행과 같은 결과를 목표로 하며 충돌 시 전체 트랜잭션 재시도가 필요할 수 있습니다.","example":"PostgreSQL(포스트그레스큐엘) Repeatable Read(리드)는 snapshot(스냅샷) 기반으로 일부 이상을 막지만 모든 직렬화 이상을 막는 것은 아니다. SERIALIZABLE에서도 모든 요청이 충돌 없이 성공하는 것은 아니다.","mistake":"격리 수준 이름만 말하고 실제 지켜야 할 업무 조건을 설명하지 못하면 설계가 불완전합니다.","question":"Serializable(시리얼라이저블)에서
